var STEPS = [{"label": "Requirement", "title": "Requirement", "html": "<p><strong>Given:</strong> CW and CCW traces at $R=100$ mm, $F=1000$ mm/min; $G=15.5\\ \\mu$m (limit 12); pocket wall 150 mm long in Y, perpendicularity 0.015 mm.</p><p><strong>Find:</strong> the dominant error signatures, their magnitudes, and their effect on the pocket.</p><p><strong>Decision to defend:</strong> run the job as is, compensate first, or move it to another machine.</p>"}, {"label": "Model", "title": "Model", "html": "<table class='results'><tr><th>Signature on the plot</th><th>Likely cause</th></tr><tr><td>Ellipse on the 45\u00b0/135\u00b0 diagonals, <strong>same</strong> in CW and CCW</td><td>Squareness error between X and Y</td></tr><tr><td>Ellipse on the diagonals, tilt <strong>flips</strong> between CW and CCW</td><td>Servo mismatch (X and Y position loops respond at different speeds)</td></tr><tr><td>Ellipse along 0\u00b0/90\u00b0</td><td>Scale mismatch (one axis travels slightly more than commanded)</td></tr><tr><td>Step where one half of the trace shifts at 0\u00b0/180\u00b0 (X) or 90\u00b0/270\u00b0 (Y)</td><td>Backlash in that axis</td></tr><tr><td>Short spike just after an axis reversal</td><td>Reversal spike (friction, stick-slip)</td></tr></table><p>For a squareness error $S$ (rad), the radial deviation is</p>$\\Delta r(\\theta)=\\frac{R\\,S}{2}\\sin2\\theta\\quad\\Rightarrow\\quad S=\\frac{2\\,\\Delta r_{peak}}{R}$<p>Read $\\Delta r_{peak}$ from the part of the diagonal ellipse that is <em>the same</em> in CW and CCW. An X backlash offset shifts that axis for a whole half-turn, so it also changes the radial reading by $(b/2)\\cos\\theta$, with opposite sign in the two directions. Averaging CW and CCW removes that projection. The step that remains at 0° and 180° is the backlash itself.</p><p class='note'>Test method: ISO 230-4:2022, circular tests for numerically controlled machine tools. The reported $G = 15.5$ µm is the CW trace, which is also the bidirectional value. The CCW trace spans about 10 µm.</p>"}, {"label": "Compute", "title": "Compute", "html": "<p><strong>Separate what is common to both directions from what changes.</strong> On the diagonals the CW trace bulges about +7.5 \u00b5m at 45\u00b0 and 225\u00b0 and pulls in about \u22127.5 \u00b5m at 135\u00b0 and 315\u00b0. The CCW trace has the same orientation, at about \u00b15 \u00b5m. The ellipse does not flip. Average the two directions: the common part is about \u00b16 \u00b5m, and that common part is squareness. The extra size of the CW trace is the X-backlash offset projected along the circle, about $(4/2)\\cos 45^\\circ \\approx 1.4$ \u00b5m on the diagonals.</p><p>Both traces also step by about 4 \u00b5m where they cross 0\u00b0 and 180\u00b0, the X reversals. There is no matching step at 90\u00b0 or 270\u00b0.</p><div class='calc'>$$S=\\frac{2(6\\ \\mu\\text{m})}{100\\ \\text{mm}}=0.12\\ \\mu\\text{m/mm}=120\\ \\mu\\text{m/m}=1.2\\times10^{-4}\\ \\text{rad}\\approx24.8''$$</div><div class='calc'>$$\\text{X backlash}\\approx4\\ \\mu\\text{m}\\qquad\\text{Y backlash}\\approx0$$</div><p><strong>Effect on the pocket.</strong> Over the 150 mm Y wall, the out-of-square Y axis shifts X by</p><div class='calc'>$$150\\ \\text{mm}\\times1.2\\times10^{-4}=0.018\\ \\text{mm}$$</div>"}, {"label": "Check", "title": "Check", "html": "<ul><li><strong>Squareness, not servo mismatch:</strong> both directions bulge at 45\u00b0/225\u00b0 and pull in at 135\u00b0/315\u00b0. A servo mismatch would flip which diagonal is long. CW is larger than CCW because the X offset adds on the diagonals in one direction and subtracts in the other. Averaging the two directions takes that projection out.</li><li><strong>Consistency with $G$:</strong> the CW trace runs from about +7.5 \u00b5m to about \u22127.5 \u00b5m, a span of about 15.5 \u00b5m, which is the reported circular deviation. The 4 \u00b5m step sits inside that span. CCW spans about 10 \u00b5m. \u2713</li><li><strong>Units:</strong> \u00b5m/mm \u00d7 mm = \u00b5m. \u2713</li><li><strong>Why ISO 230-2 missed it:</strong> a single-axis laser test measures position <em>along</em> X. Squareness is a relationship <em>between</em> two axes, so only a two-axis test such as the ballbar shows it.</li></ul>"}, {"label": "Defend", "title": "Defend", "html": "<div class='decision'><strong>Decision: do not run the job as is.</strong> Predicted perpendicularity error is 0.018 mm from squareness alone, against a 0.015 mm tolerance. Apply the control's squareness compensation (or have the machine realigned), re-test with the ballbar, and confirm $G \\le 12\\ \\mu$m before cutting. Correct the 4 \u00b5m X backlash in the same visit.</div><p><strong>Why the ballbar is the right first test:</strong> it takes about 10 minutes and finds two-axis problems a single-axis test cannot see. It does not replace ISO 230-2: a ballbar covers only a 200 mm circle and says little about accuracy over the full stroke.</p><p class='note'>Course spine: the ballbar sits between machine positioning accuracy and achieved part accuracy. It is a machine test under motion, but still with no cutting load.</p>"}];

(function(){
  function typeset(el){
    if(window.renderMathInElement){
      try{ renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}], throwOnError:false}); }catch(e){}
    }
  }
  var titleEl=document.getElementById('we-title'), stmtEl=document.getElementById('we-statement');
  titleEl.textContent=PROBLEM.title; stmtEl.innerHTML=PROBLEM.statement; typeset(stmtEl);
  var stepper=document.getElementById('stepper');
  var sNum=document.getElementById('s-num'), sTitle=document.getElementById('s-title'), sBody=document.getElementById('s-body'), count=document.getElementById('count');
  var prev=document.getElementById('prev'), next=document.getElementById('next'), play=document.getElementById('play');
  var i=0, timer=null;
  STEPS.forEach(function(s,idx){
    var c=document.createElement('div'); c.className='chip'; c.setAttribute('data-i',idx);
    c.innerHTML='<span class="num">'+(idx+1)+'</span>'+s.label;
    c.addEventListener('click',function(){ stop(); go(idx); });
    stepper.appendChild(c);
  });
  var chips=Array.prototype.slice.call(stepper.querySelectorAll('.chip'));
  function render(){
    var s=STEPS[i]; sNum.textContent=(i+1); sTitle.textContent=s.title; sBody.innerHTML=s.html; typeset(sBody);
    count.textContent='Step '+(i+1)+' of '+STEPS.length;
    chips.forEach(function(c,idx){ c.classList.toggle('active',idx===i); c.classList.toggle('done',idx<i); });
    prev.disabled=(i===0); next.disabled=(i===STEPS.length-1);
  }
  function go(n){ i=Math.max(0,Math.min(STEPS.length-1,n)); render(); }
  function stop(){ if(timer){ clearInterval(timer); timer=null; play.textContent='Play'; } }
  prev.addEventListener('click',function(){ stop(); go(i-1); });
  next.addEventListener('click',function(){ stop(); go(i+1); });
  play.addEventListener('click',function(){
    if(timer){ stop(); return; }
    play.textContent='Pause';
    timer=setInterval(function(){ if(i>=STEPS.length-1){ stop(); return; } go(i+1); }, 9000);
  });
  render();
})();
</script>
</body>
</html>
