<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Worked Example 1.2-A: Reading an ISO 230-2 Positioning Test | MFET 410</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" />
<style>
  :root { --navy:#1F3A5F; --light:#E7EDF4; --accent:#D85A30; --ink:#222; --muted:#5a6b80; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Arial, Helvetica, sans-serif; color:var(--ink); background:#fff; }
  .we { max-width:860px; margin:0 auto; padding:16px; }
  h1 { color:var(--navy); font-size:1.3rem; margin:0 0 6px; }
  .statement { margin:0 0 16px; color:#333; line-height:1.6; background:#f5f8fc; border-left:4px solid var(--navy); padding:10px 14px; border-radius:0 4px 4px 0; }
  .stepper { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .chip { display:flex; align-items:center; gap:6px; font-size:.8rem; color:var(--navy); background:#eef3f9; border:1px solid #cfe0f2; border-radius:16px; padding:4px 10px; cursor:pointer; transition:background .15s,color .15s; }
  .chip .num { display:inline-block; width:18px; height:18px; line-height:18px; text-align:center; background:#cfe0f2; color:var(--navy); border-radius:50%; font-size:.72rem; font-weight:bold; }
  .chip.done { color:#33628f; }
  .chip.active { background:var(--navy); color:#fff; }
  .chip.active .num { background:#fff; color:var(--navy); }
  .card { border:1px solid var(--navy); border-radius:8px; overflow:hidden; min-height:280px; }
  .card-head { background:var(--navy); color:#fff; padding:10px 16px; font-size:1.05rem; font-weight:bold; }
  .card-body { padding:16px; font-size:.97rem; line-height:1.6; }
  .card-body p { margin:0 0 10px; }
  .calc { background:#f5f8fc; border:1px solid #dbe6f2; border-radius:6px; padding:8px 12px; margin:8px 0; }
  .katex-display { overflow-x:auto; overflow-y:hidden; margin:.3em 0; }
  table.results { width:100%; border-collapse:collapse; margin-top:6px; font-size:.92rem; }
  table.results th, table.results td { border:1px solid #cfe0f2; padding:6px 8px; text-align:left; }
  table.results th { background:var(--navy); color:#fff; font-weight:bold; }
  table.results tr:nth-child(even) td { background:#f5f8fc; }
  table.results td.num, table.results th.num { text-align:right; }
  .note { font-size:.86rem; color:var(--muted); margin-top:8px; }
  .decision { border:2px solid var(--accent); border-radius:6px; padding:8px 12px; margin:10px 0; background:#fdf4f0; }
  .controls { display:flex; align-items:center; gap:8px; margin-top:14px; }
  button { background:var(--navy); color:#fff; border:none; border-radius:4px; padding:8px 14px; cursor:pointer; font-size:.9rem; }
  button:hover { background:#16283f; }
  button.ghost { background:#fff; color:var(--navy); border:1px solid var(--navy); }
  button:disabled { opacity:.4; cursor:default; }
  .stepcount { font-size:.85rem; color:var(--muted); margin-left:auto; }
  svg { max-width:100%; height:auto; }
  .fig { text-align:center; margin:8px 0; }
  .fig .cap { font-size:.82rem; color:var(--muted); }
</style>
</head>
<body>
<div class="we">
  <h1 id="we-title"></h1>
  <div class="statement" id="we-statement"></div>
  <div class="stepper" id="stepper"></div>
  <div class="card">
    <div class="card-head"><span id="s-num"></span>. <span id="s-title"></span></div>
    <div class="card-body" id="s-body"></div>
  </div>
  <div class="controls">
    <button class="ghost" id="prev" type="button">Prev</button>
    <button id="play" type="button">Play</button>
    <button class="ghost" id="next" type="button">Next</button>
    <span class="stepcount" id="count"></span>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script>
var PROBLEM = {"title": "Worked Example 1.2-A: Reading an ISO 230-2 Positioning Test", "statement": "A laser interferometer test of the VMC-R1 X axis gives the mean deviation and standard deviation at five targets for approaches in the positive (\u2191) and negative (\u2193) directions. The spec sheet promises positioning accuracy <strong>\u00b10.005 mm</strong> and repeatability <strong>\u00b10.002 mm</strong> (acceptance: ISO 230-2 $A \\le 10\\ \\mu$m, $R \\le 4\\ \\mu$m). Does the axis meet its specification, and what does the test tell you about how to program a precise hole pattern?<table class='results'><tr><th>Target (mm)</th><th class='num'>x\u0304\u2191</th><th class='num'>x\u0304\u2193</th><th class='num'>s\u2191</th><th class='num'>s\u2193</th></tr><tr><td>0</td><td class='num'>0.4</td><td class='num'>-1.6</td><td class='num'>0.30</td><td class='num'>0.35</td></tr><tr><td>150</td><td class='num'>1.8</td><td class='num'>-0.4</td><td class='num'>0.35</td><td class='num'>0.30</td></tr><tr><td>300</td><td class='num'>3.1</td><td class='num'>0.9</td><td class='num'>0.40</td><td class='num'>0.40</td></tr><tr><td>450</td><td class='num'>3.9</td><td class='num'>1.8</td><td class='num'>0.35</td><td class='num'>0.45</td></tr><tr><td>600</td><td class='num'>4.6</td><td class='num'>2.2</td><td class='num'>0.35</td><td class='num'>0.40</td></tr></table><p class='note'>All values in \u00b5m. Five runs in each direction at each target, machine at stable temperature, no load.</p>"};
var STEPS = [{"label": "Requirement", "title": "Requirement", "html": "<p><strong>Given:</strong> the test table above (\u00b5m); acceptance limits $A\\le10\\ \\mu$m, $R\\le4\\ \\mu$m.</p><p><strong>Find:</strong> the reversal value $B$, bidirectional repeatability $R$, unidirectional repeatability $R{\\uparrow}$, bidirectional accuracy $A$, and the systematic deviation $E$; then judge acceptance.</p><p><strong>Decision to defend:</strong> should critical features be approached from one direction?</p>"}, {"label": "Model", "title": "Model", "html": "<p>ISO 230-2 separates the <strong>systematic</strong> part of positioning (the mean deviations $\\bar{x}$) from the <strong>random</strong> part (the spread $s$). Its parameters use $\\pm2s$ bands:</p>$$B_i=\\bar{x}_i{\\uparrow}-\\bar{x}_i{\\downarrow}\\qquad R{\\uparrow}=\\max(4s_i{\\uparrow})$$$$R=\\max_i\\left[\\max\\left(2s_i{\\uparrow}+2s_i{\\downarrow}+|B_i|,\\ 4s_i{\\uparrow},\\ 4s_i{\\downarrow}\\right)\\right]$$$A=\\max_i\\left(\\bar{x}_i{\\uparrow}+2s_i{\\uparrow},\\ \\bar{x}_i{\\downarrow}+2s_i{\\downarrow}\\right)-\\min_i\\left(\\bar{x}_i{\\uparrow}-2s_i{\\uparrow},\\ \\bar{x}_i{\\downarrow}-2s_i{\\downarrow}\\right)$$E=\\max_i(\\bar{x}_i{\\uparrow},\\bar{x}_i{\\downarrow})-\\min_i(\\bar{x}_i{\\uparrow},\\bar{x}_i{\\downarrow})$<p class='note'>The maximum and the minimum run over every target and both directions. Source: ISO 230-2:2014, <em>Determination of accuracy and repeatability of positioning of numerically controlled axes</em>.</p>"}, {"label": "Compute", "title": "Compute", "html": "<table class='results'><tr><th>Target</th><th class='num'>B<sub>i</sub> = x̄↑ − x̄↓</th><th class='num'>2s↑+2s↓+|B<sub>i</sub>|</th><th class='num'>4s↑</th><th class='num'>4s↓</th><th class='num'>R<sub>i</sub></th></tr><tr><td>0</td><td class='num'>2.0</td><td class='num'>3.3</td><td class='num'>1.2</td><td class='num'>1.4</td><td class='num'>3.3</td></tr><tr><td>150</td><td class='num'>2.2</td><td class='num'>3.5</td><td class='num'>1.4</td><td class='num'>1.2</td><td class='num'>3.5</td></tr><tr><td>300</td><td class='num'>2.2</td><td class='num'>3.8</td><td class='num'>1.6</td><td class='num'>1.6</td><td class='num'>3.8</td></tr><tr><td>450</td><td class='num'>2.1</td><td class='num'>3.7</td><td class='num'>1.4</td><td class='num'>1.8</td><td class='num'>3.7</td></tr><tr><td>600</td><td class='num'>2.4</td><td class='num'>3.9</td><td class='num'>1.4</td><td class='num'>1.6</td><td class='num'>3.9</td></tr></table><div class='calc'>$$B=\\max|B_i|=2.4\\ \\mu\\text{m}\\qquad R=3.9\\ \\mu\\text{m}\\qquad R{\\uparrow}=4(0.40)=1.6\\ \\mu\\text{m}$$</div><div class='calc'>$$A=\\max(4.6+0.70,\\ 2.2+0.80)-\\min(0.4-0.60,\\ -1.6-0.70)=5.3-(-2.3)=7.6\\ \\mu\\text{m}$$</div><div class='calc'>$E=4.6-(-1.6)=6.2\\ \\mu\\text{m}$</div><p>Those extremes are the whole-axis maximum and minimum. The highest upper band is $4.6+2(0.35)=5.3$ µm at 600 mm, positive direction. The lowest lower band is $-1.6-2(0.35)=-2.3$ µm at 0 mm, negative direction. Every other target falls inside that range.</p>"}, {"label": "Check", "title": "Check", "html": "<ul><li><strong>Ordering:</strong> $A\\ (7.6)\\ \\ge E\\ (6.2)$, as it must, since $A$ adds the random $\\pm2s$ bands to the systematic spread. ✓</li><li><strong>Each $R_i \\ge |B_i|$:</strong> repeatability cannot be smaller than the reversal. ✓</li><li><strong>Acceptance:</strong> $A=7.6\\le10$ ✓; $R=3.9\\le4$ ✓ (only just).</li><li><strong>What dominates $R$:</strong> at the 600 mm target, $|B|=2.4$ of the 3.9 µm. Reversal (lost motion) is most of the bidirectional repeatability.</li><li><strong>Trend:</strong> the bidirectional mean rises from −0.6 µm at 0 mm to 3.4 µm at 600 mm, 6.7 µm/m end to end. Worked Example 1.4-A uses that slope. A steady trend is systematic, so it can be corrected with the control's pitch-error compensation table.</li></ul>"}, {"label": "Defend", "title": "Defend", "html": "<div class='decision'><strong>Decision:</strong> the axis meets its acceptance spec. Program critical features (a precision hole pattern, probing moves) to approach <strong>from one direction</strong>. The repeatability that then applies is $R{\\uparrow}=1.6\\ \\mu$m instead of $R=3.9\\ \\mu$m, because the 2.4 \u00b5m reversal drops out.</div><p><strong>What the test does not tell you:</strong> ISO 230-2 is run unloaded, at stable temperature, one axis at a time. Cutting force, thermal drift during production, the fixture, and the part are all absent. The \u00b10.005 mm on the spec sheet is a <em>machine positioning accuracy</em>. It is the first line of an error budget (Page 1.4), not the answer.</p><p class='note'>Field practice: re-run the test after a crash or relocation, and keep the compensation table current.</p>"}];

(function(){
  function typeset(el){
    if(window.renderMathInElement){
      try{ renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}], throwOnError:false}); }catch(e){}
    }
  }
  var titleEl=document.getElementById('we-title'), stmtEl=document.getElementById('we-statement');
  titleEl.textContent=PROBLEM.title; stmtEl.innerHTML=PROBLEM.statement; typeset(stmtEl);
  var stepper=document.getElementById('stepper');
  var sNum=document.getElementById('s-num'), sTitle=document.getElementById('s-title'), sBody=document.getElementById('s-body'), count=document.getElementById('count');
  var prev=document.getElementById('prev'), next=document.getElementById('next'), play=document.getElementById('play');
  var i=0, timer=null;
  STEPS.forEach(function(s,idx){
    var c=document.createElement('div'); c.className='chip'; c.setAttribute('data-i',idx);
    c.innerHTML='<span class="num">'+(idx+1)+'</span>'+s.label;
    c.addEventListener('click',function(){ stop(); go(idx); });
    stepper.appendChild(c);
  });
  var chips=Array.prototype.slice.call(stepper.querySelectorAll('.chip'));
  function render(){
    var s=STEPS[i]; sNum.textContent=(i+1); sTitle.textContent=s.title; sBody.innerHTML=s.html; typeset(sBody);
    count.textContent='Step '+(i+1)+' of '+STEPS.length;
    chips.forEach(function(c,idx){ c.classList.toggle('active',idx===i); c.classList.toggle('done',idx<i); });
    prev.disabled=(i===0); next.disabled=(i===STEPS.length-1);
  }
  function go(n){ i=Math.max(0,Math.min(STEPS.length-1,n)); render(); }
  function stop(){ if(timer){ clearInterval(timer); timer=null; play.textContent='Play'; } }
  prev.addEventListener('click',function(){ stop(); go(i-1); });
  next.addEventListener('click',function(){ stop(); go(i+1); });
  play.addEventListener('click',function(){
    if(timer){ stop(); return; }
    play.textContent='Pause';
    timer=setInterval(function(){ if(i>=STEPS.length-1){ stop(); return; } go(i+1); }, 9000);
  });
  render();
})();
</script>
</body>
</html>
