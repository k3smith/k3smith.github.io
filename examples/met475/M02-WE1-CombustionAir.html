<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Worked Example 2.1: Combustion Air and Air-Fuel Ratio | MET 475</title>
<!-- Reusable worked-example player. Edit PROBLEM and STEPS. Units: use \text{}\cdot\text{} not a literal middot inside \text{}. -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" />
<style>
  :root { --navy:#1F3A5F; --light:#E7EDF4; --accent:#D85A30; --ink:#222; --muted:#5a6b80; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Arial, Helvetica, sans-serif; color:var(--ink); background:#fff; }
  .we { max-width:860px; margin:0 auto; padding:16px; }
  h1 { color:var(--navy); font-size:1.3rem; margin:0 0 6px; }
  .statement { margin:0 0 16px; color:#333; line-height:1.6; background:#f5f8fc; border-left:4px solid var(--navy); padding:10px 14px; border-radius:0 4px 4px 0; }
  .stepper { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .chip { display:flex; align-items:center; gap:6px; font-size:.8rem; color:var(--navy); background:#eef3f9; border:1px solid #cfe0f2; border-radius:16px; padding:4px 10px; cursor:pointer; }
  .chip .num { display:inline-block; width:18px; height:18px; line-height:18px; text-align:center; background:#cfe0f2; color:var(--navy); border-radius:50%; font-size:.72rem; font-weight:bold; }
  .chip.done { color:#33628f; }
  .chip.active { background:var(--navy); color:#fff; }
  .chip.active .num { background:#fff; color:var(--navy); }
  .card { border:1px solid var(--navy); border-radius:8px; overflow:hidden; min-height:280px; }
  .card-head { background:var(--navy); color:#fff; padding:10px 16px; font-size:1.05rem; font-weight:bold; }
  .card-body { padding:16px; font-size:.97rem; line-height:1.6; }
  .card-body p { margin:0 0 10px; }
  .kv { list-style:none; margin:0 0 10px; padding:0; }
  .kv li { padding:3px 0; }
  .calc { background:#f5f8fc; border:1px solid #dbe6f2; border-radius:6px; padding:8px 12px; margin:8px 0; }
  .katex-display { overflow-x:auto; overflow-y:hidden; margin:.3em 0; }
  table.results { width:100%; border-collapse:collapse; margin-top:6px; font-size:.92rem; }
  table.results th, table.results td { border:1px solid #cfe0f2; padding:6px 8px; text-align:left; }
  table.results th { background:var(--navy); color:#fff; }
  .note { font-size:.86rem; color:var(--muted); margin-top:8px; }
  .cite { font-size:.82rem; color:var(--muted); }
  .verdict { font-weight:bold; color:#1d7a4d; }
  .controls { display:flex; align-items:center; gap:8px; margin-top:14px; }
  button { background:var(--navy); color:#fff; border:none; border-radius:4px; padding:8px 14px; cursor:pointer; font-size:.9rem; }
  button:hover { background:#16283f; }
  button.ghost { background:#fff; color:var(--navy); border:1px solid var(--navy); }
  button:disabled { opacity:.4; cursor:default; }
  .stepcount { font-size:.85rem; color:var(--muted); margin-left:auto; }
  svg { max-width:100%; height:auto; }
</style>
</head>
<body>
<div class="we">
  <h1 id="we-title"></h1>
  <div class="statement" id="we-statement"></div>
  <div class="stepper" id="stepper"></div>
  <div class="card"><div class="card-head"><span id="s-num"></span>. <span id="s-title"></span></div><div class="card-body" id="s-body"></div></div>
  <div class="controls">
    <button class="ghost" id="prev" type="button">Prev</button>
    <button id="play" type="button">Play</button>
    <button class="ghost" id="next" type="button">Next</button>
    <span class="stepcount" id="count"></span>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script>
var PROBLEM = {
  title: "Worked Example 2.1: Combustion Air and Air-Fuel Ratio",
  statement: "A marine boiler burns heavy fuel oil of composition 86% carbon, 11% hydrogen, and 3% sulfur by mass, at a rate of $0.30\\ \\text{kg/s}$, with 20% excess air. Find the stoichiometric air-fuel ratio and the actual combustion-air mass flow, and verify whether a forced-draft fan rated for $6.0\\ \\text{kg/s}$ of air is adequate."
};
var SKETCH = '<svg viewBox="0 0 440 150" role="img" aria-label="Fuel and air enter a furnace and leave as flue gas.">'
+ '<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#1F3A5F"/></marker></defs>'
+ '<rect x="15" y="20" width="90" height="34" rx="4" fill="#E7EDF4" stroke="#1F3A5F" stroke-width="1.4"/><text x="60" y="42" text-anchor="middle" fill="#1F3A5F" font-size="12">Fuel</text>'
+ '<rect x="15" y="96" width="90" height="34" rx="4" fill="#E7EDF4" stroke="#1F3A5F" stroke-width="1.4"/><text x="60" y="118" text-anchor="middle" fill="#1F3A5F" font-size="12">Air</text>'
+ '<line x1="105" y1="37" x2="180" y2="65" stroke="#1F3A5F" stroke-width="2" marker-end="url(#a)"/>'
+ '<line x1="105" y1="113" x2="180" y2="85" stroke="#1F3A5F" stroke-width="2" marker-end="url(#a)"/>'
+ '<rect x="185" y="48" width="110" height="54" rx="4" fill="#fbeee2" stroke="#d8802f" stroke-width="1.4"/><text x="240" y="80" text-anchor="middle" fill="#9a6a2f" font-size="12" font-weight="bold">Furnace</text>'
+ '<line x1="295" y1="75" x2="360" y2="75" stroke="#1F3A5F" stroke-width="2" marker-end="url(#a)"/>'
+ '<text x="400" y="79" text-anchor="middle" fill="#1F3A5F" font-size="12">Flue gas</text></svg>';
var STEPS = [
 { label:"Restate", title:"Restate the problem",
   html:"<p>A boiler burns a known heavy fuel oil at a known rate with 20% excess air. We must find the stoichiometric air-fuel ratio, the actual air mass flow the burner draws, and then judge whether the installed forced-draft fan can supply that air.</p>" },
 { label:"Given/Find", title:"Given and Find",
   html:"<p><strong>Given:</strong></p><ul class='kv'>"
     +"<li>Fuel: $C=0.86,\\ H=0.11,\\ S=0.03$ (mass fractions)</li>"
     +"<li>Fuel rate $\\dot m_f = 0.30\\ \\text{kg/s}$</li>"
     +"<li>Excess air $= 20\\%$</li>"
     +"<li>Fan rating $= 6.0\\ \\text{kg/s}$ of air</li></ul>"
     +"<p><strong>Find:</strong> stoichiometric air-fuel ratio, actual air mass flow, and whether the fan is adequate.</p>" },
 { label:"Sketch", title:"Assumptions and sketch",
   html:"<p>Assume complete combustion and that air is 23.3% oxygen by mass. On a mass basis, 1 kg of C needs 2.667 kg of O&#8322;, 1 kg of H needs 8 kg, and 1 kg of S needs 1 kg.</p>"
     + SKETCH
     + "<p class='cite'>Reference: Reeds Vol 3, ch. 13, Principles of Combustion.</p>" },
 { label:"Equations", title:"Equations",
   html:"$$\\begin{aligned} O_2 &= 2.667\\,C + 8\\,H + 1\\,S \\quad(\\text{kg O}_2/\\text{kg fuel}) \\\\ \\text{AFR}_{stoich} &= O_2 / 0.233 \\\\ \\text{air}_{actual} &= \\text{AFR}_{stoich}\\,(1+\\text{excess}) \\\\ \\dot m_{air} &= \\dot m_f \\times \\text{air}_{actual} \\end{aligned}$$" },
 { label:"Calculate", title:"Calculations (units tracked)",
   html:"<div class='calc'>$$\\begin{aligned} O_2 &= 2.667(0.86) + 8(0.11) + 1(0.03) \\\\ &= 2.293 + 0.880 + 0.030 = 3.203\\ \\tfrac{\\text{kg O}_2}{\\text{kg fuel}} \\end{aligned}$$</div>"
     +"<div class='calc'>$$\\text{AFR}_{stoich} = \\frac{3.203}{0.233} = \\textcolor{#D85A30}{13.75\\ \\tfrac{\\text{kg air}}{\\text{kg fuel}}}$$</div>"
     +"<div class='calc'>$$\\text{air}_{actual} = 13.75 \\times 1.20 = 16.50\\ \\tfrac{\\text{kg air}}{\\text{kg fuel}}$$</div>"
     +"<div class='calc'>$$\\dot m_{air} = 0.30 \\times 16.50 = \\textcolor{#D85A30}{4.95\\ \\text{kg/s}}$$</div>" },
 { label:"Check", title:"Check for reasonableness",
   html:"<p>Heavy fuel oil typically has a stoichiometric air-fuel ratio near 14 to 1, and our 13.75 matches. Adding 20% excess raises it to about 16.5, as expected. A fuel rate of $0.30\\ \\text{kg/s}$ times about 16.5 gives roughly $5\\ \\text{kg/s}$ of air, which is the right order of magnitude for a small marine boiler.</p>" },
 { label:"Result", title:"Result",
   html:"<table class='results'><tr><th>Quantity</th><th>Value</th></tr>"
     +"<tr><td>Stoichiometric air-fuel ratio</td><td>$13.75 : 1$</td></tr>"
     +"<tr><td>Actual combustion-air flow</td><td>$4.95\\ \\text{kg/s}$</td></tr>"
     +"<tr><td>Fan rating</td><td>$6.0\\ \\text{kg/s}$</td></tr></table>"
     +"<p><span class='verdict'>Verdict: PASS.</span> The fan supplies $6.0\\ \\text{kg/s}$ against a demand of $4.95\\ \\text{kg/s}$, a margin of about 21%, so it is adequate with sensible reserve.</p>" }
];
(function(){
  function typeset(el){ if(window.renderMathInElement){ try{ renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false}); }catch(e){} } }
  var titleEl=document.getElementById('we-title'), stmtEl=document.getElementById('we-statement');
  titleEl.textContent=PROBLEM.title; stmtEl.innerHTML=PROBLEM.statement; typeset(stmtEl);
  var stepper=document.getElementById('stepper');
  var sNum=document.getElementById('s-num'), sTitle=document.getElementById('s-title'), sBody=document.getElementById('s-body'), count=document.getElementById('count');
  var prev=document.getElementById('prev'), next=document.getElementById('next'), play=document.getElementById('play');
  var i=0, timer=null;
  STEPS.forEach(function(s,idx){ var c=document.createElement('div'); c.className='chip'; c.innerHTML='<span class="num">'+(idx+1)+'</span>'+s.label; c.addEventListener('click',function(){ stop(); go(idx); }); stepper.appendChild(c); });
  var chips=Array.prototype.slice.call(stepper.querySelectorAll('.chip'));
  function render(){ var s=STEPS[i]; sNum.textContent=(i+1); sTitle.textContent=s.title; sBody.innerHTML=s.html; typeset(sBody); count.textContent='Step '+(i+1)+' of '+STEPS.length; chips.forEach(function(c,idx){ c.classList.toggle('active',idx===i); c.classList.toggle('done',idx<i); }); prev.disabled=(i===0); next.disabled=(i===STEPS.length-1); }
  function go(n){ i=Math.max(0,Math.min(STEPS.length-1,n)); render(); }
  function stop(){ if(timer){ clearInterval(timer); timer=null; play.textContent='Play'; } }
  prev.addEventListener('click',function(){ stop(); go(i-1); });
  next.addEventListener('click',function(){ stop(); go(i+1); });
  play.addEventListener('click',function(){ if(timer){ stop(); return; } play.textContent='Pause'; timer=setInterval(function(){ if(i>=STEPS.length-1){ stop(); return; } go(i+1); },7000); });
  render();
})();
</script>
</body>
</html>
