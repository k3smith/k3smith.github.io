<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Worked Example 2.3-B | MET 320</title>
<!--
  REUSABLE WORKED-EXAMPLE PLAYER
  To adapt for another problem: edit the PROBLEM object (title + statement)
  and the STEPS array below. Keep the 7-step structure.
  Math: write LaTeX with $...$ (inline) or $$...$$ (display). KaTeX renders it.
-->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" />
<style>
  :root { --navy:#1F3A5F; --light:#E7EDF4; --accent:#D85A30; --ink:#222; --muted:#5a6b80; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Arial, Helvetica, sans-serif; color:var(--ink); background:#fff; }
  .we { max-width:860px; margin:0 auto; padding:16px; }
  h1 { color:var(--navy); font-size:1.3rem; margin:0 0 6px; }
  .statement { margin:0 0 16px; color:#333; line-height:1.6; background:#f5f8fc; border-left:4px solid var(--navy); padding:10px 14px; border-radius:0 4px 4px 0; }
  .stepper { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .chip { display:flex; align-items:center; gap:6px; font-size:.8rem; color:var(--navy); background:#eef3f9; border:1px solid #cfe0f2; border-radius:16px; padding:4px 10px; cursor:pointer; transition:background .15s,color .15s; }
  .chip .num { display:inline-block; width:18px; height:18px; line-height:18px; text-align:center; background:#cfe0f2; color:var(--navy); border-radius:50%; font-size:.72rem; font-weight:bold; }
  .chip.done { color:#33628f; }
  .chip.active { background:var(--navy); color:#fff; }
  .chip.active .num { background:#fff; color:var(--navy); }
  .card { border:1px solid var(--navy); border-radius:8px; overflow:hidden; min-height:280px; }
  .card-head { background:var(--navy); color:#fff; padding:10px 16px; font-size:1.05rem; font-weight:bold; }
  .card-body { padding:16px; font-size:.97rem; line-height:1.6; }
  .card-body p { margin:0 0 10px; }
  .kv { list-style:none; margin:0 0 10px; padding:0; }
  .kv li { padding:3px 0; }
  .calc { background:#f5f8fc; border:1px solid #dbe6f2; border-radius:6px; padding:8px 12px; margin:8px 0; }
  .katex-display { overflow-x:auto; overflow-y:hidden; margin:.3em 0; }
  table.results { width:100%; border-collapse:collapse; margin-top:6px; font-size:.92rem; }
  table.results th, table.results td { border:1px solid #cfe0f2; padding:6px 8px; text-align:left; }
  table.results th { background:var(--navy); color:#fff; font-weight:bold; }
  table.results tr:nth-child(even) td { background:#f5f8fc; }
  .note { font-size:.86rem; color:var(--muted); margin-top:8px; }
  .cite { font-size:.82rem; color:var(--muted); }
  .controls { display:flex; align-items:center; gap:8px; margin-top:14px; }
  button { background:var(--navy); color:#fff; border:none; border-radius:4px; padding:8px 14px; cursor:pointer; font-size:.9rem; }
  button:hover { background:#16283f; }
  button.ghost { background:#fff; color:var(--navy); border:1px solid var(--navy); }
  button:disabled { opacity:.4; cursor:default; }
  .stepcount { font-size:.85rem; color:var(--muted); margin-left:auto; }
  svg { max-width:100%; height:auto; }
</style>
</head>
<body>
<div class="we">
  <h1 id="we-title"></h1>
  <div class="statement" id="we-statement"></div>
  <div class="stepper" id="stepper"></div>
  <div class="card">
    <div class="card-head"><span id="s-num"></span>. <span id="s-title"></span></div>
    <div class="card-body" id="s-body"></div>
  </div>
  <div class="controls">
    <button class="ghost" id="prev" type="button">Prev</button>
    <button id="play" type="button">Play</button>
    <button class="ghost" id="next" type="button">Next</button>
    <span class="stepcount" id="count"></span>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script>
var PROBLEM = {
  title: "Worked Example 2.3-B: Angle of twist of a shaft",
  statement: "Using the same shaft as Example 2.3-A ($d = 30\\ \\text{mm}$, torque $T = 98{,}800\\ \\text{N}\\cdot\\text{mm}$), with shaft length $L = 500\\ \\text{mm}$ and shear modulus $G = 80{,}000\\ \\text{MPa}$, find the angle of twist and compare it to the common rotating-machinery guideline of $1^\\circ$ per meter of length."
};

var SKETCH = '<svg viewBox="0 0 460 180" role="img" aria-label="A shaft fixed at the left end and twisted through angle phi at the right end by a torque T.">'
+ '<defs><marker id="ta" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1F3A5F"/></marker></defs>'
+ '<rect x="60" y="60" width="20" height="70" fill="#9aa8ba" stroke="#1F3A5F" stroke-width="1.5"/>'
+ '<rect x="80" y="80" width="230" height="30" fill="#cfe0f2" stroke="#1F3A5F" stroke-width="1.5"/>'
+ '<ellipse cx="310" cy="95" rx="9" ry="16" fill="#eef3f9" stroke="#1F3A5F" stroke-width="1.5"/>'
+ '<line x1="80" y1="140" x2="310" y2="140" stroke="#5a6b80" stroke-width="1" stroke-dasharray="3 3"/>'
+ '<text x="195" y="155" text-anchor="middle" fill="#5a6b80" font-size="11">L = 500 mm</text>'
+ '<path d="M310,66 A28,28 0 1 1 282,58" fill="none" stroke="#1F3A5F" stroke-width="2" marker-end="url(#ta)"/>'
+ '<text x="322" y="150" fill="#1F3A5F" font-size="13" font-style="italic">T</text>'
+ '<path d="M336,95 A26,26 0 0 1 330,112" fill="none" stroke="#D85A30" stroke-width="1.6"/>'
+ '<text x="345" y="100" fill="#D85A30" font-size="13" font-style="italic">&#966;</text>'
+ '<text x="195" y="52" text-anchor="middle" fill="#5a6b80" font-size="11">fixed left end, twist at right end</text>'
+ '</svg>';

var STEPS = [
  { label:"Restate", title:"Restate the problem",
    html:"<p>The same shaft that we checked for shear stress also twists under the applied torque. Here we find how many degrees the free end rotates relative to the fixed end, then compare that twist rate to a stiffness guideline. This is a stiffness (deflection) check, not a strength check: a shaft can be strong enough yet still twist too much for the application.</p>" },
  { label:"Given/Find", title:"Given and Find",
    html:"<p><strong>Given:</strong></p><ul class='kv'>"
      +"<li>$d = 30\\ \\text{mm}$, $T = 98{,}800\\ \\text{N}\\cdot\\text{mm}$</li>"
      +"<li>$L = 500\\ \\text{mm}$ &nbsp;(twisted length)</li>"
      +"<li>$G = 80{,}000\\ \\text{MPa}$ &nbsp;(shear modulus of steel)</li></ul>"
      +"<p><strong>Find:</strong> the angle of twist $\\phi$ in degrees, and the twist rate in degrees per meter.</p>" },
  { label:"Sketch", title:"Assumptions and sketch",
    html:"<p>Assumptions: prismatic solid circular shaft, linear-elastic material, pure torsion over the full length $L$. The angle of twist accumulates uniformly along the shaft.</p>"
      + SKETCH
      + "<p class='cite'>Reference: Mott, Ch. 3, angle of twist $\\phi = TL/(GJ)$, with $J = \\pi d^4/32$.</p>" },
  { label:"Equations", title:"Equations",
    html:"<p>Twist angle, then convert to degrees and a per-meter rate:</p>"
      +"$$\\begin{aligned} J &= \\frac{\\pi d^4}{32} \\qquad \\phi = \\frac{T L}{G J} \\\\[4pt] \\phi_{deg} &= \\phi \\cdot \\frac{180}{\\pi} \\qquad \\text{rate} = \\phi_{deg}\\cdot\\frac{1000}{L} \\end{aligned}$$"
      +"<p>$J=\\pi d^4/32$ is the <em>polar moment of inertia</em> of the solid shaft. $\\phi=TL/(GJ)$ is the angle of twist (in radians) over a shaft length $L$, where $T$ is the torque and $G$ is the material's <em>shear modulus</em> (its resistance to twisting). The remaining relations convert that angle to degrees and to a twist rate per metre of length.</p>" },
  { label:"Calculate", title:"Calculations (units tracked)",
    html:"<div class='calc'>$$J = \\frac{\\pi d^4}{32} = \\frac{\\pi(30)^4}{32} = 79{,}522\\ \\text{mm}^4$$</div>"
      +"<div class='calc'>$$\\phi = \\frac{TL}{GJ} = \\frac{TL}{G(\\pi d^4/32)} = \\frac{32\\,T L}{\\pi G d^4} = \\frac{32(98{,}800)(500)}{\\pi(80{,}000)(30)^4} = \\textcolor{#D85A30}{0.00777\\ \\text{rad}}$$</div>"
      +"<div class='calc'>$$\\phi_{deg} = \\phi\\cdot\\frac{180}{\\pi} = \\textcolor{#D85A30}{0.445^\\circ}, \\qquad \\text{rate} = \\phi_{deg}\\cdot\\frac{1000}{L} = 0.445\\cdot\\frac{1000}{500} = \\textcolor{#D85A30}{0.89^\\circ/\\text{m}}$$</div>" },
  { label:"Check", title:"Check for reasonableness",
    html:"<p>Sanity checks:</p><ul class='kv'>"
      +"<li>A fraction of a degree of twist over half a meter is physically reasonable for a lightly loaded 30 mm shaft.</li>"
      +"<li>The twist rate $0.89^\\circ/\\text{m}$ sits just under the $1^\\circ/\\text{m}$ rule of thumb, so the shaft is torsionally acceptable for general machinery.</li></ul>" },
  { label:"Result", title:"Result and verdict",
    html:"<table class='results'><tr><th>Quantity</th><th>Symbol</th><th>Result</th></tr>"
      +"<tr><td>Angle of twist</td><td>$\\phi$</td><td>$0.445^\\circ$</td></tr>"
      +"<tr><td>Twist rate</td><td>$\\phi/L$</td><td>$0.89^\\circ/\\text{m}$</td></tr></table>"
      +"<p><strong>Verdict:</strong> just under the $1^\\circ$ per meter guideline, so acceptable for general rotating machinery. Precision equipment (CNC spindles, optics) may require $\\phi < 0.25^\\circ/\\text{m}$, so always confirm the angular accuracy the application needs.</p>" }
];


(function(){
  function typeset(el){
    if(window.renderMathInElement){
      try{ renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}], throwOnError:false}); }catch(e){}
    }
  }
  var titleEl=document.getElementById('we-title'), stmtEl=document.getElementById('we-statement');
  titleEl.textContent=PROBLEM.title;
  stmtEl.innerHTML=PROBLEM.statement;
  typeset(stmtEl);

  var stepper=document.getElementById('stepper');
  var sNum=document.getElementById('s-num'), sTitle=document.getElementById('s-title'), sBody=document.getElementById('s-body'), count=document.getElementById('count');
  var prev=document.getElementById('prev'), next=document.getElementById('next'), play=document.getElementById('play');
  var i=0, timer=null;
  STEPS.forEach(function(s,idx){
    var c=document.createElement('div'); c.className='chip'; c.setAttribute('data-i',idx);
    c.innerHTML='<span class="num">'+(idx+1)+'</span>'+s.label;
    c.addEventListener('click',function(){ stop(); go(idx); });
    stepper.appendChild(c);
  });
  var chips=Array.prototype.slice.call(stepper.querySelectorAll('.chip'));
  function render(){
    var s=STEPS[i];
    sNum.textContent=(i+1); sTitle.textContent=s.title; sBody.innerHTML=s.html;
    typeset(sBody);
    count.textContent='Step '+(i+1)+' of '+STEPS.length;
    chips.forEach(function(c,idx){ c.classList.toggle('active',idx===i); c.classList.toggle('done',idx<i); });
    prev.disabled=(i===0); next.disabled=(i===STEPS.length-1);
  }
  function go(n){ i=Math.max(0,Math.min(STEPS.length-1,n)); render(); }
  function stop(){ if(timer){ clearInterval(timer); timer=null; play.textContent='Play'; } }
  prev.addEventListener('click',function(){ stop(); go(i-1); });
  next.addEventListener('click',function(){ stop(); go(i+1); });
  play.addEventListener('click',function(){
    if(timer){ stop(); return; }
    play.textContent='Pause';
    timer=setInterval(function(){ if(i>=STEPS.length-1){ stop(); return; } go(i+1); }, 7000);
  });
  render();
})();
</script>
</body>
</html>
