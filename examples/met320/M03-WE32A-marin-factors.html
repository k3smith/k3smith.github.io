<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Worked Example 3.2-A | MET 320</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" />
<style>
  :root { --navy:#1F3A5F; --light:#E7EDF4; --accent:#D85A30; --ink:#222; --muted:#5a6b80; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Arial, Helvetica, sans-serif; color:var(--ink); background:#fff; }
  .we { max-width:860px; margin:0 auto; padding:16px; }
  h1 { color:var(--navy); font-size:1.3rem; margin:0 0 6px; }
  .statement { margin:0 0 16px; color:#333; line-height:1.6; background:#f5f8fc; border-left:4px solid var(--navy); padding:10px 14px; border-radius:0 4px 4px 0; }
  .stepper { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .chip { display:flex; align-items:center; gap:6px; font-size:.8rem; color:var(--navy); background:#eef3f9; border:1px solid #cfe0f2; border-radius:16px; padding:4px 10px; cursor:pointer; transition:background .15s,color .15s; }
  .chip .num { display:inline-block; width:18px; height:18px; line-height:18px; text-align:center; background:#cfe0f2; color:var(--navy); border-radius:50%; font-size:.72rem; font-weight:bold; }
  .chip.done { color:#33628f; }
  .chip.active { background:var(--navy); color:#fff; }
  .chip.active .num { background:#fff; color:var(--navy); }
  .card { border:1px solid var(--navy); border-radius:8px; overflow:hidden; min-height:280px; }
  .card-head { background:var(--navy); color:#fff; padding:10px 16px; font-size:1.05rem; font-weight:bold; }
  .card-body { padding:16px; font-size:.97rem; line-height:1.6; }
  .card-body p { margin:0 0 10px; }
  .kv { list-style:none; margin:0 0 10px; padding:0; }
  .kv li { padding:3px 0; }
  .calc { background:#f5f8fc; border:1px solid #dbe6f2; border-radius:6px; padding:8px 12px; margin:8px 0; }
  .eq-label { margin:12px 0 0; font-size:.92rem; color:var(--navy); font-weight:bold; }
  .katex-display { overflow-x:auto; overflow-y:hidden; margin:.3em 0; }
  table.results { width:100%; border-collapse:collapse; margin-top:6px; font-size:.92rem; }
  table.results th, table.results td { border:1px solid #cfe0f2; padding:6px 8px; text-align:left; }
  table.results th { background:var(--navy); color:#fff; font-weight:bold; }
  table.results tr:nth-child(even) td { background:#f5f8fc; }
  .note { font-size:.86rem; color:var(--muted); margin-top:8px; }
  .cite { font-size:.82rem; color:var(--muted); }
  .controls { display:flex; align-items:center; gap:8px; margin-top:14px; }
  button { background:var(--navy); color:#fff; border:none; border-radius:4px; padding:8px 14px; cursor:pointer; font-size:.9rem; }
  button:hover { background:#16283f; }
  button.ghost { background:#fff; color:var(--navy); border:1px solid var(--navy); }
  button:disabled { opacity:.4; cursor:default; }
  .stepcount { font-size:.85rem; color:var(--muted); margin-left:auto; }
  svg { max-width:100%; height:auto; }
</style>
</head>
<body>
<div class="we">
  <h1 id="we-title"></h1>
  <div class="statement" id="we-statement"></div>
  <div class="stepper" id="stepper"></div>
  <div class="card">
    <div class="card-head"><span id="s-num"></span>. <span id="s-title"></span></div>
    <div class="card-body" id="s-body"></div>
  </div>
  <div class="controls">
    <button class="ghost" id="prev" type="button">Prev</button>
    <button id="play" type="button">Play</button>
    <button class="ghost" id="next" type="button">Next</button>
    <span class="stepcount" id="count"></span>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script>
var PROBLEM = {
  title: "Worked Example 3.2-A: Applying Marin Factors and Kf",
  statement: "The SAE 1040 HR shaft from Page 3.1 continues here: $S_u = 496$, $S'_e = 248$, $\\sigma_a = 180$, $\\sigma_m = 0\\ \\text{MPa}$. It is $d = 30\\ \\text{mm}$ with a machined surface and a 99% reliability requirement, and a shoulder fillet with $K_t = 1.8$, notch sensitivity $q = 0.82$. Marin factors: $C_m = 1.0$ (steel), $C_{st} = 1.0$ (bending), $C_R = 0.81$ (99% reliability), $C_s = 0.85$ (size). Find the corrected endurance limit $S_e$, the fatigue notch factor $K_f$, and the effective alternating stress $\\sigma_{a,eff}$."
};

var SKETCH = '<svg viewBox="0 0 460 180" role="img" aria-label="A stepped shaft with a shoulder fillet where the diameter changes, marked as the critical stress-concentration location with Kt equals 1.8.">'
+ '<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1F3A5F"/></marker></defs>'
+ '<rect x="70" y="70" width="130" height="46" fill="#cfe0f2" stroke="#1F3A5F" stroke-width="1.5"/>'
+ '<rect x="200" y="80" width="180" height="26" fill="#dfe8f3" stroke="#1F3A5F" stroke-width="1.5"/>'
+ '<line x1="200" y1="64" x2="200" y2="122" stroke="#D85A30" stroke-width="1.4" stroke-dasharray="3 3"/>'
+ '<text x="200" y="138" text-anchor="middle" fill="#D85A30" font-size="10">shoulder fillet, Kt = 1.8</text>'
+ '<path d="M96,66 A22,22 0 0 1 118,50" fill="none" stroke="#1F3A5F" stroke-width="2" marker-end="url(#ar)"/>'
+ '<text x="82" y="58" fill="#1F3A5F" font-size="12" font-style="italic">M</text>'
+ '<text x="135" y="98" text-anchor="middle" fill="#5a6b80" font-size="10">d = 30 mm</text>'
+ '<text x="230" y="164" text-anchor="middle" fill="#5a6b80" font-size="10">reversed bending at a stress raiser</text>'
+ '</svg>';

var STEPS = [
  { label:"Restate", title:"Restate the problem",
    html:"<p>The ideal endurance limit $S'_e$ from Page 3.1 belongs to a perfect, polished lab specimen. A real shaft is larger, has a machined (not polished) surface, must meet a reliability target, and carries a stress-raising fillet. The Marin modifying factors de-rate $S'_e$ down to a realistic in-service value $S_e$, while the fatigue notch factor $K_f$ raises the working alternating stress to an effective value. Comparing those two numbers is what tells us whether fatigue is a threat, which we finish on Page 3.3.</p>" },
  { label:"Given/Find", title:"Given and Find",
    html:"<p><strong>Given</strong> (carried from Page 3.1 plus this page's data):</p><ul class='kv'>"
      +"<li>$S'_e = 248\\ \\text{MPa}$, $\\sigma_a = 180\\ \\text{MPa}$, $\\sigma_m = 0$, $S_u = 496\\ \\text{MPa}$</li>"
      +"<li>Marin factors: $C_m = 1.0$, $C_{st} = 1.0$, $C_R = 0.81$, $C_s = 0.85$</li>"
      +"<li>shoulder fillet: $K_t = 1.8$, notch sensitivity $q = 0.82$; $d = 30\\ \\text{mm}$</li></ul>"
      +"<p><strong>Find:</strong> the corrected endurance limit $S_e$, the fatigue stress-concentration factor $K_f$, and the effective alternating stress $\\sigma_{a,eff}$.</p>" },
  { label:"Sketch", title:"Assumptions and sketch",
    html:"<p>Assumptions: bending loading on a machined steel shaft, $d = 30\\ \\text{mm}$, with a 99% reliability requirement; the size factor $C_s$ and the notch sensitivity $q$ are read from Mott's charts for this diameter and material. The notch is the shoulder fillet where the diameter steps down, which is where a fatigue crack would start.</p>"
      + SKETCH
      + "<p class='cite'>Reference: Mott Ch. 5, corrected endurance limit and Marin factors (&sect;5-7, Eq. 5-11); fatigue stress-concentration factor $K_f = 1 + q(K_t-1)$ (Eq. 5-14).</p>" },
  { label:"Equations", title:"Equations",
    html:"<p>De-rate the ideal endurance limit, convert the geometric notch factor to a fatigue notch factor, and amplify the alternating stress:</p>"
      +"<p class='eq-label'>Corrected endurance limit (Marin factors):</p>"
      +"$$S_e = C_m\\, C_{st}\\, C_R\\, C_s\\, S'_e$$"
      +"<p class='eq-label'>Fatigue stress-concentration factor:</p>"
      +"$$K_f = 1 + q(K_t - 1)$$"
      +"<p class='eq-label'>Effective alternating stress:</p>"
      +"$$\\sigma_{a,eff} = K_f\\,\\sigma_a$$"
      +"<p>Each $C$ is a Marin modifying factor and each is $\\le 1$, so together they shrink the ideal $S'_e$ to the in-service $S_e$: $C_m$ is the material factor, $C_{st}$ the stress-type factor (1.0 for bending, about 0.58 for torsion), $C_R$ the reliability factor (0.81 at 99%), and $C_s$ the size factor (larger shafts are weaker in fatigue). $K_t$ is the <em>geometric</em> stress-concentration factor of the fillet and $q$ is the material's <em>notch sensitivity</em> ($q = 0$ ignores the notch, $q = 1$ feels it fully); $K_f$ is the resulting fatigue stress-concentration factor, applied to $\\sigma_a$ to give the effective alternating stress $\\sigma_{a,eff}$.</p>" },
  { label:"Calculate", title:"Calculations (units tracked)",
    html:"<div class='calc'>$$S_e = C_m\\, C_{st}\\, C_R\\, C_s\\, S'_e = (1.0)(1.0)(0.81)(0.85)(248) = 0.6885(248) = \\textcolor{#D85A30}{170.8\\ \\text{MPa}}$$</div>"
      +"<div class='calc'>$$K_f = 1 + q(K_t - 1) = 1 + 0.82(1.8 - 1) = 1 + 0.82(0.8) = \\textcolor{#D85A30}{1.656}$$</div>"
      +"<div class='calc'>$$\\sigma_{a,eff} = K_f\\,\\sigma_a = 1.656(180) = \\textcolor{#D85A30}{298\\ \\text{MPa}}$$</div>" },
  { label:"Check", title:"Check for reasonableness",
    html:"<p>Sanity checks:</p><ul class='kv'>"
      +"<li>Every Marin factor is $\\le 1$, so $S_e = 170.8\\ \\text{MPa}$ must come out below $S'_e = 248\\ \\text{MPa}$: it does, a 31% reduction driven mostly by the reliability and size factors.</li>"
      +"<li>$K_f = 1.656$ lies between 1 and $K_t = 1.8$, as it must, since the notch sensitivity $q = 0.82$ is less than 1.</li>"
      +"<li>The effective stress $\\sigma_{a,eff} = 298\\ \\text{MPa}$ now <em>exceeds</em> the corrected endurance limit $S_e = 171\\ \\text{MPa}$: fatigue failure is predicted, so a safety-factor check and redesign are needed on Page 3.3.</li></ul>" },
  { label:"Result", title:"Result and verdict",
    html:"<table class='results'><tr><th>Quantity</th><th>Symbol</th><th>Value</th></tr>"
      +"<tr><td>Corrected endurance limit</td><td>$S_e$</td><td>$170.8\\ \\text{MPa}$</td></tr>"
      +"<tr><td>Fatigue notch factor</td><td>$K_f$</td><td>$1.656$</td></tr>"
      +"<tr><td>Effective alternating stress</td><td>$\\sigma_{a,eff}$</td><td>$298\\ \\text{MPa}$</td></tr></table>"
      +"<p><strong>Verdict:</strong> the real-world corrections cut the endurance limit to $S_e = 170.8\\ \\text{MPa}$ while the notch raised the working stress to $\\sigma_{a,eff} = 298\\ \\text{MPa}$. Because $\\sigma_{a,eff} > S_e$, this shaft is predicted to fail by fatigue as designed. Carry $S_e = 170.8$ and $\\sigma_{a,eff} = 298\\ \\text{MPa}$ to Page 3.3 to compute the Goodman and yield safety factors and to size the redesign.</p>" }
];


(function(){
  function typeset(el){
    if(window.renderMathInElement){
      try{ renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}], throwOnError:false}); }catch(e){}
    }
  }
  var titleEl=document.getElementById('we-title'), stmtEl=document.getElementById('we-statement');
  titleEl.textContent=PROBLEM.title;
  stmtEl.innerHTML=PROBLEM.statement;
  typeset(stmtEl);

  var stepper=document.getElementById('stepper');
  var sNum=document.getElementById('s-num'), sTitle=document.getElementById('s-title'), sBody=document.getElementById('s-body'), count=document.getElementById('count');
  var prev=document.getElementById('prev'), next=document.getElementById('next'), play=document.getElementById('play');
  var i=0, timer=null;
  STEPS.forEach(function(s,idx){
    var c=document.createElement('div'); c.className='chip'; c.setAttribute('data-i',idx);
    c.innerHTML='<span class="num">'+(idx+1)+'</span>'+s.label;
    c.addEventListener('click',function(){ stop(); go(idx); });
    stepper.appendChild(c);
  });
  var chips=Array.prototype.slice.call(stepper.querySelectorAll('.chip'));
  function render(){
    var s=STEPS[i];
    sNum.textContent=(i+1); sTitle.textContent=s.title; sBody.innerHTML=s.html;
    typeset(sBody);
    count.textContent='Step '+(i+1)+' of '+STEPS.length;
    chips.forEach(function(c,idx){ c.classList.toggle('active',idx===i); c.classList.toggle('done',idx<i); });
    prev.disabled=(i===0); next.disabled=(i===STEPS.length-1);
  }
  function go(n){ i=Math.max(0,Math.min(STEPS.length-1,n)); render(); }
  function stop(){ if(timer){ clearInterval(timer); timer=null; play.textContent='Play'; } }
  prev.addEventListener('click',function(){ stop(); go(i-1); });
  next.addEventListener('click',function(){ stop(); go(i+1); });
  play.addEventListener('click',function(){
    if(timer){ stop(); return; }
    play.textContent='Pause';
    timer=setInterval(function(){ if(i>=STEPS.length-1){ stop(); return; } go(i+1); }, 7000);
  });
  render();
})();
</script>
</body>
</html>
