<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Worked Example 6.1-A: Shaft Forces | MET 320</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" />
<style>
  :root { --navy:#1F3A5F; --light:#E7EDF4; --accent:#D85A30; --ink:#222; --muted:#5a6b80; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Arial, Helvetica, sans-serif; color:var(--ink); background:#fff; }
  .we { max-width:860px; margin:0 auto; padding:16px; }
  h1 { color:var(--navy); font-size:1.3rem; margin:0 0 6px; }
  .statement { margin:0 0 16px; color:#333; line-height:1.6; background:#f5f8fc; border-left:4px solid var(--navy); padding:10px 14px; border-radius:0 4px 4px 0; }
  .stepper { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .chip { display:flex; align-items:center; gap:6px; font-size:.8rem; color:var(--navy); background:#eef3f9; border:1px solid #cfe0f2; border-radius:16px; padding:4px 10px; cursor:pointer; transition:background .15s,color .15s; }
  .chip .num { display:inline-block; width:18px; height:18px; line-height:18px; text-align:center; background:#cfe0f2; color:var(--navy); border-radius:50%; font-size:.72rem; font-weight:bold; }
  .chip.done { color:#33628f; }
  .chip.active { background:var(--navy); color:#fff; }
  .chip.active .num { background:#fff; color:var(--navy); }
  .card { border:1px solid var(--navy); border-radius:8px; overflow:hidden; min-height:280px; }
  .card-head { background:var(--navy); color:#fff; padding:10px 16px; font-size:1.05rem; font-weight:bold; }
  .card-body { padding:16px; font-size:.97rem; line-height:1.6; }
  .card-body p { margin:0 0 10px; }
  .kv { list-style:none; margin:0 0 10px; padding:0; }
  .kv li { padding:3px 0; }
  .calc { background:#f5f8fc; border:1px solid #dbe6f2; border-radius:6px; padding:8px 12px; margin:8px 0; }
  .eq-label { margin:12px 0 0; font-size:.92rem; color:var(--navy); font-weight:bold; }
  .katex-display { overflow-x:auto; overflow-y:hidden; margin:.3em 0; }
  table.results { width:100%; border-collapse:collapse; margin-top:6px; font-size:.92rem; }
  table.results th, table.results td { border:1px solid #cfe0f2; padding:6px 8px; text-align:left; }
  table.results th { background:var(--navy); color:#fff; font-weight:bold; }
  table.results tr:nth-child(even) td { background:#f5f8fc; }
  .note { font-size:.86rem; color:var(--muted); margin-top:8px; }
  .cite { font-size:.82rem; color:var(--muted); }
  .controls { display:flex; align-items:center; gap:8px; margin-top:14px; }
  button { background:var(--navy); color:#fff; border:none; border-radius:4px; padding:8px 14px; cursor:pointer; font-size:.9rem; }
  button:hover { background:#16283f; }
  button.ghost { background:#fff; color:var(--navy); border:1px solid var(--navy); }
  button:disabled { opacity:.4; cursor:default; }
  .stepcount { font-size:.85rem; color:var(--muted); margin-left:auto; }
  svg { max-width:100%; height:auto; }
</style>
</head>
<body>
<div class="we">
  <h1 id="we-title"></h1>
  <div class="statement" id="we-statement"></div>
  <div class="stepper" id="stepper"></div>
  <div class="card">
    <div class="card-head"><span id="s-num"></span>. <span id="s-title"></span></div>
    <div class="card-body" id="s-body"></div>
  </div>
  <div class="controls">
    <button class="ghost" id="prev" type="button">Prev</button>
    <button id="play" type="button">Play</button>
    <button class="ghost" id="next" type="button">Next</button>
    <span class="stepcount" id="count"></span>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script>
var PROBLEM = {"title": "Worked Example 6.1-A: Forces on the Project Shaft", "statement": "A conveyor-drive shaft transmits $P = 7.5\\ \\text{kW}$ at $n = 600\\ \\text{rpm}$ between bearings at $x = 0$ and $x = 500\\ \\text{mm}$. A spur gear ($m = 5$, $N_P = 30$, $\\phi = 20^\\circ$, $D_P = 150\\ \\text{mm}$) sits at $x = 150$ and a V-belt sheave ($D_s = 250\\ \\text{mm}$, $F_1/F_2 = 3$) at $x = 350$. Find the transmitted torque and the gear and belt forces applied to the shaft."};
var SKETCH = '<svg viewBox="0 0 470 180" role="img" aria-label="Shaft carrying a spur gear and a V-belt sheave with applied forces.">'
+ '<defs>'
+ '<marker id="afO" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D85A30"/></marker>'
+ '<marker id="afG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2c7a54"/></marker>'
+ '</defs>'
+ '<line x1="60" y1="90" x2="410" y2="90" stroke="#1F3A5F" stroke-width="6"/>'
+ '<polygon points="60,90 48,114 72,114" fill="#cfe0f2" stroke="#1F3A5F"/>'
+ '<polygon points="410,90 398,114 422,114" fill="#cfe0f2" stroke="#1F3A5F"/>'
+ '<text x="52" y="129" font-size="10" fill="#5a6b80">A (x=0)</text>'
+ '<text x="380" y="129" font-size="10" fill="#5a6b80">B (x=500)</text>'
+ '<circle cx="165" cy="90" r="14" fill="#dfe8f3" stroke="#1F3A5F"/>'
+ '<circle cx="305" cy="90" r="19" fill="#dfe8f3" stroke="#1F3A5F"/>'
+ '<text x="140" y="150" font-size="9.5" fill="#5a6b80">gear (x=150)</text>'
+ '<text x="275" y="150" font-size="9.5" fill="#5a6b80">sheave (x=350)</text>'
+ '<line x1="165" y1="36" x2="165" y2="72" stroke="#D85A30" stroke-width="2.5" marker-end="url(#afO)"/>'
+ '<text x="172" y="50" font-size="9.5" fill="#D85A30">W_t = 1592 N (V)</text>'
+ '<line x1="184" y1="108" x2="240" y2="108" stroke="#2c7a54" stroke-width="2.2" marker-end="url(#afG)"/>'
+ '<text x="188" y="124" font-size="9.5" fill="#2c7a54">W_r = 579 N (H)</text>'
+ '<line x1="328" y1="72" x2="390" y2="72" stroke="#2c7a54" stroke-width="2.5" marker-end="url(#afG)"/>'
+ '<text x="330" y="64" font-size="9.5" fill="#2c7a54">F_B = 1910 N (H)</text>'
+ '<text x="100" y="172" font-size="9" fill="#7d8ea0">T = 119.4 N&middot;m constant between gear and sheave</text>'
+ '</svg>';
var STEPS = [{"label": "Restate", "title": "Restate the problem", "html": "<p>This is the Module 6 project shaft. A motor drives it through a spur gear; a V-belt sheave takes power off to a driven machine. Every downstream step &mdash; bending, shaft diameter, bearings &mdash; starts from the forces these two elements apply to the shaft, so this page computes them from the transmitted torque and the drive geometry.</p>"}, {"label": "Given/Find", "title": "Given and Find", "html": "<p><strong>Given:</strong></p><ul class='kv'><li>Power $P = 7.5\\ \\text{kW}$ at $n = 600\\ \\text{rpm}$; bearings at $A\\,(x{=}0)$ and $B\\,(x{=}500\\ \\text{mm})$</li><li>Spur gear at $x = 150\\ \\text{mm}$: $m = 5\\ \\text{mm}$, $N_P = 30$, $\\phi = 20^\\circ$, so $D_P = mN_P = 150\\ \\text{mm}$</li><li>V-belt sheave at $x = 350\\ \\text{mm}$: $D_s = 250\\ \\text{mm}$, tension ratio $F_1/F_2 = 3$</li></ul><p><strong>Find:</strong> the transmitted torque and the gear and belt forces the shaft must carry (magnitude, direction, plane).</p>"}, {"label": "Sketch", "title": "Force sketch", "html": "<p>The gear tangential force $W_t$ acts in the vertical plane; the gear radial force $W_r$ and the belt pull $F_B$ act in the horizontal plane (same direction).</p>__SKETCH__<p class='cite'>Reference: Mott Ch. 12 &sect;12-2; gear forces Ch. 9; V-belt shaft load Ch. 7.</p>"}, {"label": "Equations", "title": "Equations", "html": "<p class='eq-label'>Transmitted torque:</p>$$T = \\frac{9550\\,P}{n}\\ \\ (\\text{N}\\cdot\\text{m};\\ P\\text{ in kW},\\ n\\text{ in rpm})$$<p class='eq-label'>Gear forces:</p>$$W_t = \\frac{2T}{D_P},\\qquad W_r = W_t\\tan\\phi,\\qquad W_a = 0\\ (\\text{spur})$$<p class='eq-label'>V-belt shaft bending load (from the two tensions):</p>$$F_{net} = \\frac{2T}{D_s},\\quad F_2 = \\frac{F_{net}}{r-1},\\quad F_1 = rF_2,\\quad F_B = F_1 + F_2$$"}, {"label": "Calculate", "title": "Calculations", "html": "<div class='calc'>$$T = \\frac{9550(7.5)}{600} = \\textcolor{#D85A30}{119.4\\ \\text{N}\\cdot\\text{m}} = 119{,}400\\ \\text{N}\\cdot\\text{mm}$$</div><div class='calc'>$$W_t = \\frac{2(119{,}400)}{150} = \\textcolor{#D85A30}{1592\\ \\text{N}},\\qquad W_r = 1592\\tan 20^\\circ = 1592(0.3640) = \\textcolor{#D85A30}{579\\ \\text{N}}$$</div><div class='calc'>$$F_{net} = \\frac{2(119{,}400)}{250} = 955\\ \\text{N},\\quad F_2 = \\frac{955}{2} = 477.5\\ \\text{N},\\quad F_1 = 3(477.5) = 1432.5\\ \\text{N}$$</div><div class='calc'>$$F_B = 1432.5 + 477.5 = \\textcolor{#D85A30}{1910\\ \\text{N}}$$</div>"}, {"label": "Check", "title": "Check for reasonableness", "html": "<ul class='kv'><li>Torque is constant between gear and sheave (no power added or removed in between), so both elements see $T = 119.4\\ \\text{N}\\cdot\\text{m}$.</li><li>The belt bending load ($1910\\ \\text{N}$) exceeds the gear tangential force because the belt&rsquo;s slack-side pretension adds to the net drive force &mdash; expected for a V-belt.</li><li>$W_t$ is vertical; $W_r$ and $F_B$ are both horizontal, so the shaft bends in two planes &mdash; the subject of Page 6.2.</li></ul>"}, {"label": "Result", "title": "Result and hand-off", "html": "<table class='results'><tr><th>Location</th><th>Force</th></tr><tr><td>Gear (x=150)</td><td>$W_t = 1592\\ \\text{N}$ (vertical), $W_r = 579\\ \\text{N}$ (horizontal), $W_a = 0$</td></tr><tr><td>Sheave (x=350)</td><td>$F_B = 1910\\ \\text{N}$ (horizontal)</td></tr><tr><td>Torque</td><td>$T = 119.4\\ \\text{N}\\cdot\\text{m}$, constant $x=150$ to $350$</td></tr></table><p><strong>Hand-off:</strong> these forces are the input to the two-plane bending analysis on Page 6.2 (Worked Example 6.2-A), which resolves them into bearing reactions and bending moments.</p>"}];

STEPS.forEach(function(s){ if(s.html) s.html = s.html.split('__SKETCH__').join(SKETCH); });

(function(){
  function typeset(el){
    if(window.renderMathInElement){
      try{ renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}], throwOnError:false}); }catch(e){}
    }
  }
  var titleEl=document.getElementById('we-title'), stmtEl=document.getElementById('we-statement');
  titleEl.textContent=PROBLEM.title; stmtEl.innerHTML=PROBLEM.statement; typeset(stmtEl);
  var stepper=document.getElementById('stepper');
  var sNum=document.getElementById('s-num'), sTitle=document.getElementById('s-title'), sBody=document.getElementById('s-body'), count=document.getElementById('count');
  var prev=document.getElementById('prev'), next=document.getElementById('next'), play=document.getElementById('play');
  var i=0, timer=null;
  STEPS.forEach(function(s,idx){
    var c=document.createElement('div'); c.className='chip'; c.setAttribute('data-i',idx);
    c.innerHTML='<span class="num">'+(idx+1)+'</span>'+s.label;
    c.addEventListener('click',function(){ stop(); go(idx); });
    stepper.appendChild(c);
  });
  var chips=Array.prototype.slice.call(stepper.querySelectorAll('.chip'));
  function render(){
    var s=STEPS[i]; sNum.textContent=(i+1); sTitle.textContent=s.title; sBody.innerHTML=s.html; typeset(sBody);
    count.textContent='Step '+(i+1)+' of '+STEPS.length;
    chips.forEach(function(c,idx){ c.classList.toggle('active',idx===i); c.classList.toggle('done',idx<i); });
    prev.disabled=(i===0); next.disabled=(i===STEPS.length-1);
  }
  function go(n){ i=Math.max(0,Math.min(STEPS.length-1,n)); render(); }
  function stop(){ if(timer){ clearInterval(timer); timer=null; play.textContent='Play'; } }
  prev.addEventListener('click',function(){ stop(); go(i-1); });
  next.addEventListener('click',function(){ stop(); go(i+1); });
  play.addEventListener('click',function(){
    if(timer){ stop(); return; }
    play.textContent='Pause';
    timer=setInterval(function(){ if(i>=STEPS.length-1){ stop(); return; } go(i+1); }, 7000);
  });
  render();
})();
</script>
</body>
</html>
