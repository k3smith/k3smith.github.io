<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Worked Example 7.2-A: RC5 Clearance Fit Limits | MET 320</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" />
<style>
  :root { --navy:#1F3A5F; --light:#E7EDF4; --accent:#D85A30; --ink:#222; --muted:#5a6b80; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Arial, Helvetica, sans-serif; color:var(--ink); background:#fff; }
  .we { max-width:860px; margin:0 auto; padding:16px; }
  h1 { color:var(--navy); font-size:1.3rem; margin:0 0 6px; }
  .statement { margin:0 0 16px; color:#333; line-height:1.6; background:#f5f8fc; border-left:4px solid var(--navy); padding:10px 14px; border-radius:0 4px 4px 0; }
  .stepper { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .chip { display:flex; align-items:center; gap:6px; font-size:.8rem; color:var(--navy); background:#eef3f9; border:1px solid #cfe0f2; border-radius:16px; padding:4px 10px; cursor:pointer; transition:background .15s,color .15s; }
  .chip .num { display:inline-block; width:18px; height:18px; line-height:18px; text-align:center; background:#cfe0f2; color:var(--navy); border-radius:50%; font-size:.72rem; font-weight:bold; }
  .chip.done { color:#33628f; }
  .chip.active { background:var(--navy); color:#fff; }
  .chip.active .num { background:#fff; color:var(--navy); }
  .card { border:1px solid var(--navy); border-radius:8px; overflow:hidden; min-height:280px; }
  .card-head { background:var(--navy); color:#fff; padding:10px 16px; font-size:1.05rem; font-weight:bold; }
  .card-body { padding:16px; font-size:.97rem; line-height:1.6; }
  .card-body p { margin:0 0 10px; }
  .kv { list-style:none; margin:0 0 10px; padding:0; }
  .kv li { padding:3px 0; }
  .calc { background:#f5f8fc; border:1px solid #dbe6f2; border-radius:6px; padding:8px 12px; margin:8px 0; }
  .eq-label { margin:12px 0 0; font-size:.92rem; color:var(--navy); font-weight:bold; }
  .katex-display { overflow-x:auto; overflow-y:hidden; margin:.3em 0; }
  table.results { width:100%; border-collapse:collapse; margin-top:6px; font-size:.92rem; }
  table.results th, table.results td { border:1px solid #cfe0f2; padding:6px 8px; text-align:left; }
  table.results th { background:var(--navy); color:#fff; font-weight:bold; }
  table.results tr:nth-child(even) td { background:#f5f8fc; }
  .note { font-size:.86rem; color:var(--muted); margin-top:8px; }
  .cite { font-size:.82rem; color:var(--muted); }
  .controls { display:flex; align-items:center; gap:8px; margin-top:14px; }
  button { background:var(--navy); color:#fff; border:none; border-radius:4px; padding:8px 14px; cursor:pointer; font-size:.9rem; }
  button:hover { background:#16283f; }
  button.ghost { background:#fff; color:var(--navy); border:1px solid var(--navy); }
  button:disabled { opacity:.4; cursor:default; }
  .stepcount { font-size:.85rem; color:var(--muted); margin-left:auto; }
  svg { max-width:100%; height:auto; }
</style>
</head>
<body>
<div class="we">
  <h1 id="we-title"></h1>
  <div class="statement" id="we-statement"></div>
  <div class="stepper" id="stepper"></div>
  <div class="card">
    <div class="card-head"><span id="s-num"></span>. <span id="s-title"></span></div>
    <div class="card-body" id="s-body"></div>
  </div>
  <div class="controls">
    <button class="ghost" id="prev" type="button">Prev</button>
    <button id="play" type="button">Play</button>
    <button class="ghost" id="next" type="button">Next</button>
    <span class="stepcount" id="count"></span>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script>
var PROBLEM = {"title": "Worked Example 7.2-A: RC5 Clearance Fit Limits", "statement": "A steel journal runs in a bronze bushing at a 2.000 in nominal diameter with an RC5 (medium running) clearance fit. Using Mott Table 13-3 (RC5 row for the 1.97&ndash;3.15 in band: hole $0/{+}1.8$, shaft $-2.5/{-}3.7$ thousandths), find the hole and shaft limit dimensions and the minimum (allowance) and maximum assembly clearance."};
var SKETCH = '<svg viewBox="0 0 460 200" role="img" aria-label="Clearance-fit tolerance zones: hole zone above the basic-size line, shaft zone below, with a clearance gap.">'
+ '<line x1="40" y1="95" x2="430" y2="95" stroke="#5a6b80" stroke-width="1" stroke-dasharray="5 3"/>'
+ '<text x="360" y="91" font-size="10" fill="#5a6b80">basic size 2.0000</text>'
+ '<rect x="90" y="73.4" width="150" height="21.6" fill="#dfe8f3" stroke="#1F3A5F"/>'
+ '<text x="105" y="66" font-size="10" fill="#1F3A5F">HOLE  0 to +1.8  (2.0000&ndash;2.0018)</text>'
+ '<rect x="90" y="125" width="150" height="14.4" fill="#cfe0f2" stroke="#1F3A5F"/>'
+ '<text x="105" y="155" font-size="10" fill="#1F3A5F">SHAFT  &minus;2.5 to &minus;3.7  (1.9963&ndash;1.9975)</text>'
+ '<line x1="270" y1="99" x2="270" y2="121" stroke="#D85A30" stroke-width="2"/>'
+ '<polygon points="270,95 266,103 274,103" fill="#D85A30"/>'
+ '<polygon points="270,125 266,117 274,117" fill="#D85A30"/>'
+ '<text x="278" y="114" font-size="10" fill="#D85A30">min clr 2.5 thou</text>'
+ '<text x="150" y="192" font-size="9.5" fill="#5a6b80">Clearance fit: shaft always smaller than hole (deviations in 0.001 in)</text>'
+ '</svg>';
var STEPS = [{"label": "Restate", "title": "Restate the problem", "html": "<p>A steel journal runs in a bronze bushing at a 2.000 in nominal diameter. The engineer selects an <strong>RC5</strong> (medium running) clearance fit so the journal always has room for an oil film. We read the standard limits from Mott&rsquo;s Table 13-3, convert the deviations to actual hole and shaft limit dimensions, and confirm the assembly clearance range.</p>"}, {"label": "Given/Find", "title": "Given and Find", "html": "<p><strong>Given:</strong></p><ul class='kv'><li>Nominal (basic) diameter $= 2.000\\ \\text{in}$ &mdash; falls in the $1.97\\text{\u2013}3.15\\ \\text{in}$ band</li><li>Class <strong>RC5</strong> (medium running), hole-basis system</li><li>Mott Table 13-3, RC5 row: hole $0/{+}1.8$, shaft $-2.5/{-}3.7$ (thousandths)</li></ul><p><strong>Find:</strong> hole limit dimensions, shaft limit dimensions, and the minimum (allowance) and maximum clearance.</p>"}, {"label": "Sketch", "title": "Tolerance zones (clearance fit)", "html": "<p>In a hole-basis clearance fit the hole tolerance starts at the basic size and grows upward; the shaft sits entirely below the basic line, so a gap always remains.</p>__SKETCH__<p class='cite'>Reference: Mott &sect;13-5, Table 13-3 (RC2/RC5/RC8); Fig. 13-4 (RC tolerance zones).</p>"}, {"label": "Equations", "title": "Reading the table", "html": "<p class='eq-label'>Actual limits = basic size + deviation (deviations in thousandths of an inch):</p>$$\\text{Hole: } LL=2.000+0,\\ UL=2.000+0.0018$$$$\\text{Shaft: } UL=2.000-0.0025,\\ LL=2.000-0.0037$$<p class='eq-label'>Clearance extremes:</p>$$c_{min}=LL_{hole}-UL_{shaft}\\ (\\text{allowance}),\\qquad c_{max}=UL_{hole}-LL_{shaft}$$"}, {"label": "Calculate", "title": "Calculations", "html": "<div class='calc'>$$\\text{Hole: } 2.0000\\ \\text{to}\\ \\textcolor{#D85A30}{2.0018\\ \\text{in}}$$</div><div class='calc'>$$\\text{Shaft: } 1.9963\\ \\text{(LL) to}\\ \\textcolor{#D85A30}{1.9975\\ \\text{in (UL)}}$$</div><div class='calc'>$$c_{min}=2.0000-1.9975=\\textcolor{#D85A30}{0.0025\\ \\text{in}}\\quad(2.5\\ \\text{thou})$$</div><div class='calc'>$$c_{max}=2.0018-1.9963=\\textcolor{#D85A30}{0.0055\\ \\text{in}}\\quad(5.5\\ \\text{thou})$$</div>"}, {"label": "Check", "title": "Checks", "html": "<ul class='kv'><li>$c_{min}=2.5$ thou and $c_{max}=5.5$ thou match the &ldquo;limits of clearance&rdquo; column of Table 13-3 &#10003;.</li><li>The shaft UL ($1.9975$) is below the hole LL ($2.0000$), so a positive clearance is guaranteed at every combination &mdash; a true clearance fit &#10003;.</li><li>2.5&ndash;5.5 thou at 2 in is a sensible running clearance for a hydrodynamic oil film at moderate speed.</li></ul>"}, {"label": "Result", "title": "Result and verdict", "html": "<table class='results'><tr><th>Quantity</th><th>Result</th></tr><tr><td>Hole limits</td><td>$2.0000$ / $2.0018\\ \\text{in}$</td></tr><tr><td>Shaft limits</td><td>$1.9963$ / $1.9975\\ \\text{in}$</td></tr><tr><td>Min clearance (allowance)</td><td>$0.0025\\ \\text{in}$</td></tr><tr><td>Max clearance</td><td>$0.0055\\ \\text{in}$</td></tr></table><p><strong>Verdict:</strong> specify hole $2.0000/2.0018$ in and shaft $1.9963/1.9975$ in. The journal always has 2.5&ndash;5.5 thou of clearance &mdash; enough to maintain a lubricating film in moderate-speed plain-bearing service.</p>"}];

STEPS.forEach(function(s){ if(s.html) s.html = s.html.split('__SKETCH__').join(SKETCH); });

(function(){
  function typeset(el){
    if(window.renderMathInElement){
      try{ renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}], throwOnError:false}); }catch(e){}
    }
  }
  var titleEl=document.getElementById('we-title'), stmtEl=document.getElementById('we-statement');
  titleEl.textContent=PROBLEM.title; stmtEl.innerHTML=PROBLEM.statement; typeset(stmtEl);
  var stepper=document.getElementById('stepper');
  var sNum=document.getElementById('s-num'), sTitle=document.getElementById('s-title'), sBody=document.getElementById('s-body'), count=document.getElementById('count');
  var prev=document.getElementById('prev'), next=document.getElementById('next'), play=document.getElementById('play');
  var i=0, timer=null;
  STEPS.forEach(function(s,idx){
    var c=document.createElement('div'); c.className='chip'; c.setAttribute('data-i',idx);
    c.innerHTML='<span class="num">'+(idx+1)+'</span>'+s.label;
    c.addEventListener('click',function(){ stop(); go(idx); });
    stepper.appendChild(c);
  });
  var chips=Array.prototype.slice.call(stepper.querySelectorAll('.chip'));
  function render(){
    var s=STEPS[i]; sNum.textContent=(i+1); sTitle.textContent=s.title; sBody.innerHTML=s.html; typeset(sBody);
    count.textContent='Step '+(i+1)+' of '+STEPS.length;
    chips.forEach(function(c,idx){ c.classList.toggle('active',idx===i); c.classList.toggle('done',idx<i); });
    prev.disabled=(i===0); next.disabled=(i===STEPS.length-1);
  }
  function go(n){ i=Math.max(0,Math.min(STEPS.length-1,n)); render(); }
  function stop(){ if(timer){ clearInterval(timer); timer=null; play.textContent='Play'; } }
  prev.addEventListener('click',function(){ stop(); go(i-1); });
  next.addEventListener('click',function(){ stop(); go(i+1); });
  play.addEventListener('click',function(){
    if(timer){ stop(); return; }
    play.textContent='Pause';
    timer=setInterval(function(){ if(i>=STEPS.length-1){ stop(); return; } go(i+1); }, 7000);
  });
  render();
})();
</script>
</body>
</html>
