<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Worked Example 8.2-A: Compression Spring Stress and Buckling Check | MET 320</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" />
<style>
  :root { --navy:#1F3A5F; --light:#E7EDF4; --accent:#D85A30; --ink:#222; --muted:#5a6b80; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Arial, Helvetica, sans-serif; color:var(--ink); background:#fff; }
  .we { max-width:860px; margin:0 auto; padding:16px; }
  h1 { color:var(--navy); font-size:1.3rem; margin:0 0 6px; }
  .statement { margin:0 0 16px; color:#333; line-height:1.6; background:#f5f8fc; border-left:4px solid var(--navy); padding:10px 14px; border-radius:0 4px 4px 0; }
  .stepper { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .chip { display:flex; align-items:center; gap:6px; font-size:.8rem; color:var(--navy); background:#eef3f9; border:1px solid #cfe0f2; border-radius:16px; padding:4px 10px; cursor:pointer; transition:background .15s,color .15s; }
  .chip .num { display:inline-block; width:18px; height:18px; line-height:18px; text-align:center; background:#cfe0f2; color:var(--navy); border-radius:50%; font-size:.72rem; font-weight:bold; }
  .chip.done { color:#33628f; }
  .chip.active { background:var(--navy); color:#fff; }
  .chip.active .num { background:#fff; color:var(--navy); }
  .card { border:1px solid var(--navy); border-radius:8px; overflow:hidden; min-height:280px; }
  .card-head { background:var(--navy); color:#fff; padding:10px 16px; font-size:1.05rem; font-weight:bold; }
  .card-body { padding:16px; font-size:.97rem; line-height:1.6; }
  .card-body p { margin:0 0 10px; }
  .kv { list-style:none; margin:0 0 10px; padding:0; }
  .kv li { padding:3px 0; }
  .calc { background:#f5f8fc; border:1px solid #dbe6f2; border-radius:6px; padding:8px 12px; margin:8px 0; }
  .eq-label { margin:12px 0 0; font-size:.92rem; color:var(--navy); font-weight:bold; }
  .katex-display { overflow-x:auto; overflow-y:hidden; margin:.3em 0; }
  table.results { width:100%; border-collapse:collapse; margin-top:6px; font-size:.92rem; }
  table.results th, table.results td { border:1px solid #cfe0f2; padding:6px 8px; text-align:left; }
  table.results th { background:var(--navy); color:#fff; font-weight:bold; }
  table.results tr:nth-child(even) td { background:#f5f8fc; }
  .note { font-size:.86rem; color:var(--muted); margin-top:8px; }
  .cite { font-size:.82rem; color:var(--muted); }
  .controls { display:flex; align-items:center; gap:8px; margin-top:14px; }
  button { background:var(--navy); color:#fff; border:none; border-radius:4px; padding:8px 14px; cursor:pointer; font-size:.9rem; }
  button:hover { background:#16283f; }
  button.ghost { background:#fff; color:var(--navy); border:1px solid var(--navy); }
  button:disabled { opacity:.4; cursor:default; }
  .stepcount { font-size:.85rem; color:var(--muted); margin-left:auto; }
  svg { max-width:100%; height:auto; }
</style>
</head>
<body>
<div class="we">
  <h1 id="we-title"></h1>
  <div class="statement" id="we-statement"></div>
  <div class="stepper" id="stepper"></div>
  <div class="card">
    <div class="card-head"><span id="s-num"></span>. <span id="s-title"></span></div>
    <div class="card-body" id="s-body"></div>
  </div>
  <div class="controls">
    <button class="ghost" id="prev" type="button">Prev</button>
    <button id="play" type="button">Play</button>
    <button class="ghost" id="next" type="button">Next</button>
    <span class="stepcount" id="count"></span>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script>
var PROBLEM = {"title": "Worked Example 8.2-A: Compression Spring Stress and Buckling Check", "statement": "Using the valve return spring from Page 8.1 ($D_w=0.125\\ \\text{in}$, $D_m=1.000\\ \\text{in}$, $C=8$, $N_a=10$, music wire, $L_f=3.00$, $L_o=1.75\\ \\text{in}$, $F_o=45.2\\ \\text{lb}$, $F_s=54.2\\ \\text{lb}$), find the Wahl factor and operating shear stress, compare to the design shear stress from Mott Fig. 18-9, check the solid-length set condition, and check buckling with Fig. 18-15."};
var SKETCH = '<svg viewBox="0 0 420 200" role="img" aria-label="Compression spring under operating load Fo, with free, operating, and solid lengths marked for buckling and set checks.">'
+ '<defs><marker id="a82" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D85A30"/></marker></defs>'
+ '<line x1="40" y1="28" x2="160" y2="28" stroke="#1F3A5F" stroke-width="3"/>'
+ '<line x1="40" y1="168" x2="160" y2="168" stroke="#1F3A5F" stroke-width="3"/>'
+ '<path d="M50,28 L150,50 L50,72 L150,94 L50,116 L150,138 L50,160 L150,168" fill="none" stroke="#1F3A5F" stroke-width="2"/>'
+ '<line x1="100" y1="20" x2="100" y2="8" stroke="#D85A30" stroke-width="2.4" marker-end="url(#a82)"/>'
+ '<text x="108" y="16" font-size="10" fill="#D85A30">F_o = 45.2 lb</text>'
+ '<line x1="178" y1="28" x2="178" y2="168" stroke="#5a6b80" stroke-width="1"/>'
+ '<line x1="173" y1="28" x2="183" y2="28" stroke="#5a6b80"/>'
+ '<line x1="173" y1="168" x2="183" y2="168" stroke="#5a6b80"/>'
+ '<text x="188" y="70" font-size="9.5" fill="#5a6b80">L_f = 3.00</text>'
+ '<text x="188" y="88" font-size="9.5" fill="#5a6b80">L_o = 1.75</text>'
+ '<text x="188" y="106" font-size="9.5" fill="#5a6b80">L_s = 1.50</text>'
+ '<text x="240" y="48" font-size="10" fill="#1F3A5F">stress at F_o (Wahl-corrected)</text>'
+ '<text x="240" y="72" font-size="10" fill="#1F3A5F">set check at F_s (solid)</text>'
+ '<text x="240" y="96" font-size="10" fill="#1F3A5F">buckling: L_f / D_m = 3.0</text>'
+ '<text x="240" y="120" font-size="10" fill="#2c7a54">f_o / L_f = 0.42 (stable)</text>'
+ '<text x="50" y="192" font-size="9.5" fill="#5a6b80">Page 8.1 spring: C = 8, music wire; ends squared and ground</text>'
+ '</svg>';
var STEPS = [{"label": "Restate", "title": "Restate the problem", "html": "<p>The spring is geometrically sound (Page 8.1). Now verify it is <em>strong enough</em>: the wire is loaded in torsion, so we find the corrected shear stress at the operating load and compare it to a design shear stress read from the music-wire chart. Two further checks guard against permanent set (solid-length stress) and sideways buckling.</p>"}, {"label": "Given/Find", "title": "Given and Find", "html": "<ul class='kv'><li>$D_w=0.125$, $D_m=1.000\\ \\text{in}$, $C=8$, $N_a=10$</li><li>$F_o=45.2\\ \\text{lb}$ (operating), $F_s=54.2\\ \\text{lb}$ (solid)</li><li>$L_f=3.00$, $L_o=1.75\\ \\text{in}$; music wire (A228)</li></ul><p><strong>Find:</strong> Wahl $K$, operating $\\tau$, design factor $N$, solid-length stress vs. the set limit, and the buckling verdict.</p>"}, {"label": "Sketch", "title": "Loads and length checks", "html": "<p>Operating force $F_o$ puts the wire in torsion. The same spring is then checked at solid length (permanent set) and for sideways buckling using the free-length slenderness $L_f/D_m$.</p>__SKETCH__<p class='cite'>Reference: Mott &sect;18-4 (Wahl / shear stress), Fig. 18-9 (design stress), Fig. 18-15 (buckling).</p>"}, {"label": "Equations", "title": "Equations", "html": "<p class='eq-label'>Wahl factor (Mott Eq. 18-5):</p>$$K=\\frac{4C-1}{4C-4}+\\frac{0.615}{C}$$<p class='eq-label'>Corrected shear stress (Eq. 18-4):</p>$$\\tau=\\frac{8\\,K\\,F\\,D_m}{\\pi\\,D_w^3}$$<p class='eq-label'>Design check and set check:</p>$$N=\\frac{\\tau_d}{\\tau}\\ \\ (\\tau_d\\ \\text{from Fig. 18-9}),\\qquad \\tau_s\\le \\tau_{d,\\text{light}}$$"}, {"label": "Calculate", "title": "Calculations", "html": "<div class='calc'>$$K=\\frac{4(8)-1}{4(8)-4}+\\frac{0.615}{8}=\\frac{31}{28}+0.077=\\textcolor{#D85A30}{1.184}$$</div><div class='calc'>$$\\tau=\\frac{8(1.184)(45.2)(1.000)}{\\pi(0.125)^3}=\\frac{428.1}{0.006136}=\\textcolor{#D85A30}{69{,}800\\ \\text{psi}}$$</div><div class='calc'>Fig. 18-9 (music wire), $D_w=0.125\\ \\text{in}$: average service $\\tau_d\\approx118{,}000\\ \\text{psi}$; light service $\\approx130{,}000\\ \\text{psi}$.$$N=\\frac{118{,}000}{69{,}800}=\\textcolor{#D85A30}{1.7}$$</div><div class='calc'>Solid-length stress: $$\\tau_s=\\tau\\frac{F_s}{F_o}=69{,}800\\frac{54.2}{45.2}=\\textcolor{#D85A30}{83{,}700\\ \\text{psi}}$$</div>"}, {"label": "Check", "title": "Checks (strength, set, buckling)", "html": "<ul class='kv'><li><strong>Operating strength:</strong> $\\tau=69{,}800<\\tau_d=118{,}000\\ \\text{psi}$ &#10003; ($N=1.7$).</li><li><strong>Set (solid length):</strong> $\\tau_s=83{,}700<$ light-service $130{,}000\\ \\text{psi}$ &#10003; &mdash; no permanent set even if compressed to solid.</li><li><strong>Buckling (Fig. 18-15):</strong> $L_f/D_m=3.00/1.000=3.0$; actual deflection ratio $f_o/L_f=(3.00-1.75)/3.00=0.42$. On Curve A this slenderness is in the stable region &#10003; &mdash; no buckling.</li></ul>"}, {"label": "Result", "title": "Result and verdict", "html": "<table class='results'><tr><th>Check</th><th>Result</th></tr><tr><td>Wahl factor $K$</td><td>1.184</td></tr><tr><td>Operating shear stress</td><td>69,800 psi</td></tr><tr><td>Design factor (avg service)</td><td>$N=1.7$</td></tr><tr><td>Solid-length stress vs. set limit</td><td>83,700 &lt; 130,000 psi &#10003;</td></tr><tr><td>Buckling ($L_f/D_m=3.0$)</td><td>stable &#10003;</td></tr></table><p><strong>Verdict:</strong> the valve return spring is adequately designed &mdash; operating stress well below the average-service design stress, no set at solid length, and no buckling.</p>"}];

STEPS.forEach(function(s){ if(s.html) s.html = s.html.split('__SKETCH__').join(SKETCH); });

(function(){
  function typeset(el){
    if(window.renderMathInElement){
      try{ renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}], throwOnError:false}); }catch(e){}
    }
  }
  var titleEl=document.getElementById('we-title'), stmtEl=document.getElementById('we-statement');
  titleEl.textContent=PROBLEM.title; stmtEl.innerHTML=PROBLEM.statement; typeset(stmtEl);
  var stepper=document.getElementById('stepper');
  var sNum=document.getElementById('s-num'), sTitle=document.getElementById('s-title'), sBody=document.getElementById('s-body'), count=document.getElementById('count');
  var prev=document.getElementById('prev'), next=document.getElementById('next'), play=document.getElementById('play');
  var i=0, timer=null;
  STEPS.forEach(function(s,idx){
    var c=document.createElement('div'); c.className='chip'; c.setAttribute('data-i',idx);
    c.innerHTML='<span class="num">'+(idx+1)+'</span>'+s.label;
    c.addEventListener('click',function(){ stop(); go(idx); });
    stepper.appendChild(c);
  });
  var chips=Array.prototype.slice.call(stepper.querySelectorAll('.chip'));
  function render(){
    var s=STEPS[i]; sNum.textContent=(i+1); sTitle.textContent=s.title; sBody.innerHTML=s.html; typeset(sBody);
    count.textContent='Step '+(i+1)+' of '+STEPS.length;
    chips.forEach(function(c,idx){ c.classList.toggle('active',idx===i); c.classList.toggle('done',idx<i); });
    prev.disabled=(i===0); next.disabled=(i===STEPS.length-1);
  }
  function go(n){ i=Math.max(0,Math.min(STEPS.length-1,n)); render(); }
  function stop(){ if(timer){ clearInterval(timer); timer=null; play.textContent='Play'; } }
  prev.addEventListener('click',function(){ stop(); go(i-1); });
  next.addEventListener('click',function(){ stop(); go(i+1); });
  play.addEventListener('click',function(){
    if(timer){ stop(); return; }
    play.textContent='Pause';
    timer=setInterval(function(){ if(i>=STEPS.length-1){ stop(); return; } go(i+1); }, 7000);
  });
  render();
})();
</script>
</body>
</html>
