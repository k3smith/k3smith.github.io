<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Worked Example 2.6-A | MET 320</title>
<!--
  REUSABLE WORKED-EXAMPLE PLAYER
  To adapt for another problem: edit the PROBLEM object (title + statement)
  and the STEPS array below. Keep the 7-step structure.
  Math: write LaTeX with $...$ (inline) or $$...$$ (display). KaTeX renders it.
-->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" />
<style>
  :root { --navy:#1F3A5F; --light:#E7EDF4; --accent:#D85A30; --ink:#222; --muted:#5a6b80; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Arial, Helvetica, sans-serif; color:var(--ink); background:#fff; }
  .we { max-width:860px; margin:0 auto; padding:16px; }
  h1 { color:var(--navy); font-size:1.3rem; margin:0 0 6px; }
  .statement { margin:0 0 16px; color:#333; line-height:1.6; background:#f5f8fc; border-left:4px solid var(--navy); padding:10px 14px; border-radius:0 4px 4px 0; }
  .stepper { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .chip { display:flex; align-items:center; gap:6px; font-size:.8rem; color:var(--navy); background:#eef3f9; border:1px solid #cfe0f2; border-radius:16px; padding:4px 10px; cursor:pointer; transition:background .15s,color .15s; }
  .chip .num { display:inline-block; width:18px; height:18px; line-height:18px; text-align:center; background:#cfe0f2; color:var(--navy); border-radius:50%; font-size:.72rem; font-weight:bold; }
  .chip.done { color:#33628f; }
  .chip.active { background:var(--navy); color:#fff; }
  .chip.active .num { background:#fff; color:var(--navy); }
  .card { border:1px solid var(--navy); border-radius:8px; overflow:hidden; min-height:280px; }
  .card-head { background:var(--navy); color:#fff; padding:10px 16px; font-size:1.05rem; font-weight:bold; }
  .card-body { padding:16px; font-size:.97rem; line-height:1.6; }
  .card-body p { margin:0 0 10px; }
  .kv { list-style:none; margin:0 0 10px; padding:0; }
  .kv li { padding:3px 0; }
  .calc { background:#f5f8fc; border:1px solid #dbe6f2; border-radius:6px; padding:8px 12px; margin:8px 0; }
  .katex-display { overflow-x:auto; overflow-y:hidden; margin:.3em 0; }
  table.results { width:100%; border-collapse:collapse; margin-top:6px; font-size:.92rem; }
  table.results th, table.results td { border:1px solid #cfe0f2; padding:6px 8px; text-align:left; }
  table.results th { background:var(--navy); color:#fff; font-weight:bold; }
  table.results tr:nth-child(even) td { background:#f5f8fc; }
  .note { font-size:.86rem; color:var(--muted); margin-top:8px; }
  .cite { font-size:.82rem; color:var(--muted); }
  .controls { display:flex; align-items:center; gap:8px; margin-top:14px; }
  button { background:var(--navy); color:#fff; border:none; border-radius:4px; padding:8px 14px; cursor:pointer; font-size:.9rem; }
  button:hover { background:#16283f; }
  button.ghost { background:#fff; color:var(--navy); border:1px solid var(--navy); }
  button:disabled { opacity:.4; cursor:default; }
  .stepcount { font-size:.85rem; color:var(--muted); margin-left:auto; }
  svg { max-width:100%; height:auto; }
</style>
</head>
<body>
<div class="we">
  <h1 id="we-title"></h1>
  <div class="statement" id="we-statement"></div>
  <div class="stepper" id="stepper"></div>
  <div class="card">
    <div class="card-head"><span id="s-num"></span>. <span id="s-title"></span></div>
    <div class="card-body" id="s-body"></div>
  </div>
  <div class="controls">
    <button class="ghost" id="prev" type="button">Prev</button>
    <button id="play" type="button">Play</button>
    <button class="ghost" id="next" type="button">Next</button>
    <span class="stepcount" id="count"></span>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script>
var PROBLEM = {
  title: "Worked Example 2.6-A: Stepped shaft with a shoulder fillet",
  statement: "A stepped shaft has a large diameter $D = 40\\ \\text{mm}$, a small diameter $d = 30\\ \\text{mm}$, and a fillet radius $r = 3\\ \\text{mm}$ at the shoulder. It carries a bending moment $M = 200\\ \\text{N}\\cdot\\text{m}$ at the step. The material is SAE 4140 OQT 1300 ($S_y = 690\\ \\text{MPa}$). Find the actual maximum stress at the fillet and the static safety factor."
};

var SKETCH = '<svg viewBox="0 0 460 180" role="img" aria-label="A stepped shaft with a large and small diameter joined by a fillet radius at the shoulder, loaded in bending.">'
+ '<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1F3A5F"/></marker></defs>'
+ '<rect x="60" y="55" width="150" height="70" fill="#cfe0f2" stroke="#1F3A5F" stroke-width="1.5"/>'
+ '<path d="M210,55 Q222,55 222,67 L222,113 Q222,125 210,125 Z" fill="#cfe0f2" stroke="none"/>'
+ '<rect x="222" y="67" width="178" height="46" fill="#dfe8f3" stroke="#1F3A5F" stroke-width="1.5"/>'
+ '<path d="M210,55 Q222,55 222,67" fill="none" stroke="#D85A30" stroke-width="2.5"/>'
+ '<path d="M210,125 Q222,125 222,113" fill="none" stroke="#D85A30" stroke-width="2.5"/>'
+ '<text x="135" y="45" text-anchor="middle" fill="#5a6b80" font-size="11">D = 40 mm</text>'
+ '<text x="311" y="57" text-anchor="middle" fill="#5a6b80" font-size="11">d = 30 mm</text>'
+ '<text x="250" y="150" fill="#D85A30" font-size="11">fillet r = 3 mm (stress raiser)</text>'
+ '<path d="M400,90 A26,26 0 0 1 388,66" fill="none" stroke="#1F3A5F" stroke-width="2" marker-end="url(#ar)"/>'
+ '<text x="405" y="120" fill="#1F3A5F" font-size="12" font-style="italic">M</text>'
+ '</svg>';

var STEPS = [
  { label:"Restate", title:"Restate the problem",
    html:"<p>Wherever a shaft changes diameter, the geometry crowds the stress lines and the local stress rises above the nominal value. A stress-concentration factor $K_t$ captures that rise. We compute the nominal bending stress in the smaller section, read $K_t$ from the geometry, multiply to get the true peak stress at the fillet, and then take the static safety factor.</p>" },
  { label:"Given/Find", title:"Given and Find",
    html:"<p><strong>Given:</strong></p><ul class='kv'>"
      +"<li>$D = 40\\ \\text{mm}$, $d = 30\\ \\text{mm}$, $r = 3\\ \\text{mm}$</li>"
      +"<li>$M = 200\\ \\text{N}\\cdot\\text{m} = 200{,}000\\ \\text{N}\\cdot\\text{mm}$</li>"
      +"<li>SAE 4140 OQT 1300, $S_y = 690\\ \\text{MPa}$</li></ul>"
      +"<p><strong>Find:</strong> the nominal stress, the maximum stress at the fillet, and the static safety factor.</p>" },
  { label:"Sketch", title:"Assumptions and sketch",
    html:"<p>Assumptions: bending only at the step, the nominal section is the smaller diameter $d$, and $K_t$ is read from the standard chart using the ratios $r/d$ and $D/d$. For a static check on a ductile steel we apply $K_t$ to be conservative.</p>"
      + SKETCH
      + "<p class='cite'>Reference: Mott, Ch. 3 and Appendix 18 (stress-concentration charts). Nominal $\\sigma = M/S$, peak $\\sigma_{max} = K_t\\,\\sigma_{nom}$.</p>" },
  { label:"Equations", title:"Equations",
    html:"<p>Nominal bending stress, the geometry ratios that set $K_t$, and the peak stress:</p>"
      +"$$\\begin{aligned} S &= \\frac{\\pi d^3}{32} \\qquad \\sigma_{nom} = \\frac{M}{S} \\\\[4pt] \\frac{r}{d}&,\\ \\frac{D}{d} \\ \\Rightarrow\\ K_t \\ (\\text{chart}) \\\\[4pt] \\sigma_{max} &= K_t\\,\\sigma_{nom} \\qquad N = \\frac{S_y}{\\sigma_{max}} \\end{aligned}$$"
      +"<p>$S=\\pi d^3/32$ is the <em>elastic section modulus</em> of the smaller shaft and $\\sigma_{nom}=M/S$ is the nominal bending stress there (ignoring the step). The ratios $r/d$ (fillet radius to diameter) and $D/d$ (larger to smaller diameter) set the <em>stress-concentration factor</em> $K_t$ read from the chart; $\\sigma_{max}=K_t\\,\\sigma_{nom}$ is the actual peak stress at the fillet and $N=S_y/\\sigma_{max}$ the safety factor. $M$ is the bending moment.</p>" },
  { label:"Calculate", title:"Calculations (units tracked)",
    html:"<div class='calc'>$$\\sigma_{nom} = \\frac{M}{S} = \\frac{M}{\\pi d^3/32} = \\frac{32M}{\\pi d^3} = \\frac{32(200{,}000)}{\\pi(30)^3} = 75.4\\ \\text{MPa}$$</div>"
      +"<div class='calc'>$$\\frac{r}{d} = \\frac{3}{30} = 0.10, \\quad \\frac{D}{d} = \\frac{40}{30} = 1.33 \\ \\Rightarrow\\ K_t \\approx 1.75$$</div>"
      +"<div class='calc'>$$\\sigma_{max} = K_t\\,\\sigma_{nom} = \\frac{32 K_t M}{\\pi d^3} = \\frac{32(1.75)(200{,}000)}{\\pi(30)^3} = \\textcolor{#D85A30}{132.0\\ \\text{MPa}}$$</div>"
      +"<div class='calc'>$$N = \\frac{S_y}{\\sigma_{max}} = \\frac{S_y}{32 K_t M/(\\pi d^3)} = \\frac{\\pi d^3 S_y}{32 K_t M} = \\frac{\\pi(30)^3(690)}{32(1.75)(200{,}000)} = \\textcolor{#D85A30}{5.23}$$</div>"
      +"<p class='note'>If instead you take the ductile static shortcut and use $\\sigma_{nom}$ (local yielding blunts the peak): $N = \\pi d^3 S_y/(32M) = 9.15$. The $K_t$-based value is the conservative choice.</p>" },
  { label:"Check", title:"Check for reasonableness",
    html:"<p>Sanity checks:</p><ul class='kv'>"
      +"<li>$K_t \\approx 1.75$ is typical for a moderate fillet ($r/d = 0.10$); a sharper fillet would push it higher.</li>"
      +"<li>Even with the concentration applied, $N = 5.23$ is comfortable for a static load, because the shaft is lightly stressed in pure bending here.</li>"
      +"<li>The peak stress $132.0\\ \\text{MPa}$ stays well below $S_y = 690\\ \\text{MPa}$.</li></ul>" },
  { label:"Result", title:"Result and verdict",
    html:"<table class='results'><tr><th>Quantity</th><th>Symbol</th><th>Result</th></tr>"
      +"<tr><td>Nominal stress</td><td>$\\sigma_{nom}$</td><td>$75.4\\ \\text{MPa}$</td></tr>"
      +"<tr><td>Stress-concentration factor</td><td>$K_t$</td><td>$1.75$</td></tr>"
      +"<tr><td>Peak stress at fillet</td><td>$\\sigma_{max}$</td><td>$132.0\\ \\text{MPa}$</td></tr>"
      +"<tr><td>Static safety factor</td><td>$N$</td><td>$5.23$</td></tr></table>"
      +"<p><strong>Verdict:</strong> safe in static bending. The practical lesson: specify a generous fillet radius on every shoulder. Under fatigue loading you would use the fatigue factor $K_f$ instead, and the margin would shrink considerably.</p>" }
];


(function(){
  function typeset(el){
    if(window.renderMathInElement){
      try{ renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}], throwOnError:false}); }catch(e){}
    }
  }
  var titleEl=document.getElementById('we-title'), stmtEl=document.getElementById('we-statement');
  titleEl.textContent=PROBLEM.title;
  stmtEl.innerHTML=PROBLEM.statement;
  typeset(stmtEl);

  var stepper=document.getElementById('stepper');
  var sNum=document.getElementById('s-num'), sTitle=document.getElementById('s-title'), sBody=document.getElementById('s-body'), count=document.getElementById('count');
  var prev=document.getElementById('prev'), next=document.getElementById('next'), play=document.getElementById('play');
  var i=0, timer=null;
  STEPS.forEach(function(s,idx){
    var c=document.createElement('div'); c.className='chip'; c.setAttribute('data-i',idx);
    c.innerHTML='<span class="num">'+(idx+1)+'</span>'+s.label;
    c.addEventListener('click',function(){ stop(); go(idx); });
    stepper.appendChild(c);
  });
  var chips=Array.prototype.slice.call(stepper.querySelectorAll('.chip'));
  function render(){
    var s=STEPS[i];
    sNum.textContent=(i+1); sTitle.textContent=s.title; sBody.innerHTML=s.html;
    typeset(sBody);
    count.textContent='Step '+(i+1)+' of '+STEPS.length;
    chips.forEach(function(c,idx){ c.classList.toggle('active',idx===i); c.classList.toggle('done',idx<i); });
    prev.disabled=(i===0); next.disabled=(i===STEPS.length-1);
  }
  function go(n){ i=Math.max(0,Math.min(STEPS.length-1,n)); render(); }
  function stop(){ if(timer){ clearInterval(timer); timer=null; play.textContent='Play'; } }
  prev.addEventListener('click',function(){ stop(); go(i-1); });
  next.addEventListener('click',function(){ stop(); go(i+1); });
  play.addEventListener('click',function(){
    if(timer){ stop(); return; }
    play.textContent='Pause';
    timer=setInterval(function(){ if(i>=STEPS.length-1){ stop(); return; } go(i+1); }, 7000);
  });
  render();
})();
</script>
</body>
</html>
