<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Worked Example 2.2-B | MET 320</title>
<!--
  REUSABLE WORKED-EXAMPLE PLAYER
  To adapt for another problem: edit the PROBLEM object (title + statement)
  and the STEPS array below. Keep the 7-step structure.
  Math: write LaTeX with $...$ (inline) or $$...$$ (display). KaTeX renders it.
-->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" />
<style>
  :root { --navy:#1F3A5F; --light:#E7EDF4; --accent:#D85A30; --ink:#222; --muted:#5a6b80; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Arial, Helvetica, sans-serif; color:var(--ink); background:#fff; }
  .we { max-width:860px; margin:0 auto; padding:16px; }
  h1 { color:var(--navy); font-size:1.3rem; margin:0 0 6px; }
  .statement { margin:0 0 16px; color:#333; line-height:1.6; background:#f5f8fc; border-left:4px solid var(--navy); padding:10px 14px; border-radius:0 4px 4px 0; }
  .stepper { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .chip { display:flex; align-items:center; gap:6px; font-size:.8rem; color:var(--navy); background:#eef3f9; border:1px solid #cfe0f2; border-radius:16px; padding:4px 10px; cursor:pointer; transition:background .15s,color .15s; }
  .chip .num { display:inline-block; width:18px; height:18px; line-height:18px; text-align:center; background:#cfe0f2; color:var(--navy); border-radius:50%; font-size:.72rem; font-weight:bold; }
  .chip.done { color:#33628f; }
  .chip.active { background:var(--navy); color:#fff; }
  .chip.active .num { background:#fff; color:var(--navy); }
  .card { border:1px solid var(--navy); border-radius:8px; overflow:hidden; min-height:280px; }
  .card-head { background:var(--navy); color:#fff; padding:10px 16px; font-size:1.05rem; font-weight:bold; }
  .card-body { padding:16px; font-size:.97rem; line-height:1.6; }
  .card-body p { margin:0 0 10px; }
  .kv { list-style:none; margin:0 0 10px; padding:0; }
  .kv li { padding:3px 0; }
  .calc { background:#f5f8fc; border:1px solid #dbe6f2; border-radius:6px; padding:8px 12px; margin:8px 0; }
  .eq-label { margin:12px 0 0; font-size:.92rem; color:var(--navy); font-weight:bold; }
  .katex-display { overflow-x:auto; overflow-y:hidden; margin:.3em 0; }
  table.results { width:100%; border-collapse:collapse; margin-top:6px; font-size:.92rem; }
  table.results th, table.results td { border:1px solid #cfe0f2; padding:6px 8px; text-align:left; }
  table.results th { background:var(--navy); color:#fff; font-weight:bold; }
  table.results tr:nth-child(even) td { background:#f5f8fc; }
  .note { font-size:.86rem; color:var(--muted); margin-top:8px; }
  .cite { font-size:.82rem; color:var(--muted); }
  .controls { display:flex; align-items:center; gap:8px; margin-top:14px; }
  button { background:var(--navy); color:#fff; border:none; border-radius:4px; padding:8px 14px; cursor:pointer; font-size:.9rem; }
  button:hover { background:#16283f; }
  button.ghost { background:#fff; color:var(--navy); border:1px solid var(--navy); }
  button:disabled { opacity:.4; cursor:default; }
  .stepcount { font-size:.85rem; color:var(--muted); margin-left:auto; }
  svg { max-width:100%; height:auto; }
</style>
</head>
<body>
<div class="we">
  <h1 id="we-title"></h1>
  <div class="statement" id="we-statement"></div>
  <div class="stepper" id="stepper"></div>
  <div class="card">
    <div class="card-head"><span id="s-num"></span>. <span id="s-title"></span></div>
    <div class="card-body" id="s-body"></div>
  </div>
  <div class="controls">
    <button class="ghost" id="prev" type="button">Prev</button>
    <button id="play" type="button">Play</button>
    <button class="ghost" id="next" type="button">Next</button>
    <span class="stepcount" id="count"></span>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script>
var PROBLEM = {
  title: "Worked Example 2.2-B: Clevis pin in double shear and bearing",
  statement: "A clevis joint uses a $12\\ \\text{mm}$ steel pin to connect two parts under a $16\\ \\text{kN}$ tensile load. The clevis has two legs, each $8\\ \\text{mm}$ thick, so the pin is in double shear. The pin is SAE 1020 HR steel ($S_y = 207\\ \\text{MPa}$, $S_{sy} \\approx 0.5\\,S_y = 103\\ \\text{MPa}$). Check the pin in shear and the leg in bearing, and identify which governs."
};

var SKETCH = '<svg viewBox="0 0 470 200" role="img" aria-label="A clevis joint in double shear, edge view. The center tongue is pulled left by the full load F. The two clevis legs, one above and one below the tongue, are each pulled right by half the load. A vertical pin passes through the top leg, the tongue, and the bottom leg, so it is cut on two shear planes, one at each tongue-to-leg interface.">'
+ '<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1F3A5F"/></marker></defs>'
// two clevis legs (right) joined by the clevis back
+ '<rect x="228" y="60" width="158" height="27" fill="#cfe0f2" stroke="#1F3A5F" stroke-width="1.5"/>'
+ '<rect x="228" y="113" width="158" height="27" fill="#cfe0f2" stroke="#1F3A5F" stroke-width="1.5"/>'
+ '<rect x="386" y="60" width="15" height="80" fill="#cfe0f2" stroke="#1F3A5F" stroke-width="1.5"/>'
// tongue (center) extends to the left
+ '<rect x="58" y="87" width="184" height="26" fill="#dfe8f3" stroke="#1F3A5F" stroke-width="1.5"/>'
// pin (vertical) through top leg, tongue, bottom leg
+ '<rect x="229" y="52" width="12" height="96" rx="4" fill="#b9cfe8" stroke="#1F3A5F" stroke-width="1.5"/>'
// two shear planes at the tongue-leg interfaces
+ '<line x1="223" y1="87" x2="247" y2="87" stroke="#D85A30" stroke-width="1.8" stroke-dasharray="4 2"/>'
+ '<line x1="223" y1="113" x2="247" y2="113" stroke="#D85A30" stroke-width="1.8" stroke-dasharray="4 2"/>'
// full load F on the tongue (pull left)
+ '<line x1="58" y1="100" x2="18" y2="100" stroke="#1F3A5F" stroke-width="2.5" marker-end="url(#ar)"/>'
+ '<text x="30" y="93" fill="#1F3A5F" font-size="13" font-style="italic">F</text>'
// half load on each leg (pull right)
+ '<line x1="401" y1="73" x2="447" y2="73" stroke="#1F3A5F" stroke-width="2" marker-end="url(#ar)"/>'
+ '<line x1="401" y1="127" x2="447" y2="127" stroke="#1F3A5F" stroke-width="2" marker-end="url(#ar)"/>'
+ '<text x="449" y="69" fill="#1F3A5F" font-size="11" font-style="italic">F/2</text>'
+ '<text x="449" y="132" fill="#1F3A5F" font-size="11" font-style="italic">F/2</text>'
+ '<text x="120" y="82" text-anchor="middle" fill="#5a6b80" font-size="10">tongue carries full F</text>'
+ '<text x="318" y="54" text-anchor="middle" fill="#5a6b80" font-size="10">clevis legs, F/2 each</text>'
+ '<text x="235" y="170" text-anchor="middle" fill="#D85A30" font-size="10">pin d = 12 mm: two shear planes</text>'
+ '</svg>';

var STEPS = [
  { label:"Restate", title:"Restate the problem",
    html:"<p>A pin carries a tensile load across a clevis. Because the pin passes through two outer legs plus a central tongue, the load is split across two shear planes (double shear). A pin joint can fail two ways, so we check both: shear across the pin cross-sections, and bearing (crushing) where the pin presses on the clevis legs. The lower safety factor governs.</p>" },
  { label:"Given/Find", title:"Given and Find",
    html:"<p><strong>Given:</strong></p><ul class='kv'>"
      +"<li>$d = 12\\ \\text{mm}$ &nbsp;(pin diameter)</li>"
      +"<li>$F = 16\\ \\text{kN} = 16{,}000\\ \\text{N}$ &nbsp;(applied load)</li>"
      +"<li>leg thickness $t = 8\\ \\text{mm}$, double shear (2 planes)</li>"
      +"<li>SAE 1020 HR, $S_y = 207\\ \\text{MPa}$, $S_{sy} \\approx 103\\ \\text{MPa}$</li></ul>"
      +"<p><strong>Find:</strong> the shear safety factor, the bearing safety factor, and which one governs.</p>" },
  { label:"Sketch", title:"Assumptions and sketch",
    html:"<p>Assumptions: the load divides equally over the two shear planes; bearing acts over the projected contact area $t \\times d$; the shear yield strength is estimated as $S_{sy} \\approx 0.5\\,S_y$ for a ductile steel. Each clevis leg carries $F/2$ in bearing.</p>"
      + SKETCH
      + "<p class='cite'>Reference: Mott, Ch. 3, direct shear $\\tau = F/A_s$ and bearing stress $\\sigma_b = F/(t\\,d)$.</p>" },
  { label:"Equations", title:"Equations",
    html:"<p>Shear on the pin (two planes) and bearing on one leg:</p>"
      +"<p class='eq-label'>Shear area in double shear (two cross-sections):</p>"
      +"$$A_s = 2\\cdot\\frac{\\pi d^2}{4} = \\frac{\\pi d^2}{2}$$"
      +"<p class='eq-label'>Average shear stress in the pin:</p>"
      +"$$\\tau = \\frac{F}{A_s}$$"
      +"<p class='eq-label'>Substitute $A_s$ into $\\tau$:</p>"
      +"$$\\tau = \\frac{F}{\\pi d^2/2} = \\frac{2F}{\\pi d^2}$$"
      +"<p class='eq-label'>Shear safety factor (with $S_{sy} \\approx 0.5\\,S_y$):</p>"
      +"$$N_{shear} = \\frac{S_{sy}}{\\tau} = \\frac{S_{sy}}{2F/(\\pi d^2)} = \\frac{\\pi d^2 S_{sy}}{2F}$$"
      +"<p class='eq-label'>Bearing stress on one clevis leg (each carries $F/2$):</p>"
      +"$$\\sigma_b = \\frac{F/2}{t\\,d} = \\frac{F}{2t\\,d}$$"
      +"<p class='eq-label'>Bearing safety factor:</p>"
      +"$$N_{bearing} = \\frac{S_y}{\\sigma_b} = \\frac{S_y}{F/(2t\\,d)} = \\frac{2t\\,d\\,S_y}{F}$$" },
  { label:"Calculate", title:"Calculations (units tracked)",
    html:"<div class='calc'>$$A_s = \\frac{\\pi d^2}{2} = \\frac{\\pi(12\\ \\text{mm})^2}{2} = 226.2\\ \\text{mm}^2$$</div>"
      +"<div class='calc'>$$\\tau = \\frac{F}{A_s} = \\frac{F}{\\pi d^2/2} = \\frac{2F}{\\pi d^2} = \\frac{2(16{,}000\\ \\text{N})}{\\pi(12\\ \\text{mm})^2} = \\textcolor{#D85A30}{70.7\\ \\text{MPa}}$$</div>"
      +"<div class='calc'>$$N_{shear} = \\frac{S_{sy}}{\\tau} = \\frac{S_{sy}}{2F/(\\pi d^2)} = \\frac{\\pi d^2 S_{sy}}{2F} = \\frac{\\pi(12\\ \\text{mm})^2(103\\ \\text{MPa})}{2(16{,}000\\ \\text{N})} = \\textcolor{#D85A30}{1.46}$$</div>"
      +"<div class='calc'>$$\\sigma_b = \\frac{F/2}{t\\,d} = \\frac{F}{2t\\,d} = \\frac{16{,}000\\ \\text{N}}{2(8\\ \\text{mm})(12\\ \\text{mm})} = 83.3\\ \\text{MPa}$$</div>"
      +"<div class='calc'>$$N_{bearing} = \\frac{S_y}{\\sigma_b} = \\frac{S_y}{F/(2t\\,d)} = \\frac{2t\\,d\\,S_y}{F} = \\frac{2(8\\ \\text{mm})(12\\ \\text{mm})(207\\ \\text{MPa})}{16{,}000\\ \\text{N}} = \\textcolor{#D85A30}{2.49}$$</div>"
      +"<p class='note'>Units track through: $\\text{N}/\\text{mm}^2 = \\text{MPa}$.</p>" },
  { label:"Check", title:"Check for reasonableness",
    html:"<p>Sanity checks:</p><ul class='kv'>"
      +"<li>Shear stress is well under the tensile stress you would get in the same pin loaded axially, as expected for a stubby pin.</li>"
      +"<li>Shear gives the lower safety factor ($1.46$ vs $2.49$), so shear governs, typical for a small pin in relatively thick legs.</li>"
      +"<li>Both numbers are in the single-digit safety-factor range, physically reasonable for a working joint.</li></ul>" },
  { label:"Result", title:"Result and verdict",
    html:"<table class='results'><tr><th>Check</th><th>Stress</th><th>Safety factor</th></tr>"
      +"<tr><td>Shear (governs)</td><td>$\\tau = 70.7\\ \\text{MPa}$</td><td>$1.46$</td></tr>"
      +"<tr><td>Bearing</td><td>$\\sigma_b = 83.3\\ \\text{MPa}$</td><td>$2.49$</td></tr></table>"
      +"<p><strong>Verdict:</strong> shear governs at $N = 1.46$, which is marginal. Specify a $14\\ \\text{mm}$ pin, or upgrade to SAE 1040 CD ($S_y = 490\\ \\text{MPa}$, $S_{sy} \\approx 245\\ \\text{MPa}$) for a substantially higher shear margin.</p>"
      +"<p class='note'>Always run both checks for a pin joint. The governing mode changes with pin size: small pins in thick plates shear first; large pins in thin plates bear first.</p>" }
];


(function(){
  function typeset(el){
    if(window.renderMathInElement){
      try{ renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}], throwOnError:false}); }catch(e){}
    }
  }
  var titleEl=document.getElementById('we-title'), stmtEl=document.getElementById('we-statement');
  titleEl.textContent=PROBLEM.title;
  stmtEl.innerHTML=PROBLEM.statement;
  typeset(stmtEl);

  var stepper=document.getElementById('stepper');
  var sNum=document.getElementById('s-num'), sTitle=document.getElementById('s-title'), sBody=document.getElementById('s-body'), count=document.getElementById('count');
  var prev=document.getElementById('prev'), next=document.getElementById('next'), play=document.getElementById('play');
  var i=0, timer=null;
  STEPS.forEach(function(s,idx){
    var c=document.createElement('div'); c.className='chip'; c.setAttribute('data-i',idx);
    c.innerHTML='<span class="num">'+(idx+1)+'</span>'+s.label;
    c.addEventListener('click',function(){ stop(); go(idx); });
    stepper.appendChild(c);
  });
  var chips=Array.prototype.slice.call(stepper.querySelectorAll('.chip'));
  function render(){
    var s=STEPS[i];
    sNum.textContent=(i+1); sTitle.textContent=s.title; sBody.innerHTML=s.html;
    typeset(sBody);
    count.textContent='Step '+(i+1)+' of '+STEPS.length;
    chips.forEach(function(c,idx){ c.classList.toggle('active',idx===i); c.classList.toggle('done',idx<i); });
    prev.disabled=(i===0); next.disabled=(i===STEPS.length-1);
  }
  function go(n){ i=Math.max(0,Math.min(STEPS.length-1,n)); render(); }
  function stop(){ if(timer){ clearInterval(timer); timer=null; play.textContent='Play'; } }
  prev.addEventListener('click',function(){ stop(); go(i-1); });
  next.addEventListener('click',function(){ stop(); go(i+1); });
  play.addEventListener('click',function(){
    if(timer){ stop(); return; }
    play.textContent='Pause';
    timer=setInterval(function(){ if(i>=STEPS.length-1){ stop(); return; } go(i+1); }, 7000);
  });
  render();
})();
</script>
</body>
</html>
