<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Worked Example 7.7-A: Bolted Joint Under External Load | MET 320</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" />
<style>
  :root { --navy:#1F3A5F; --light:#E7EDF4; --accent:#D85A30; --ink:#222; --muted:#5a6b80; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Arial, Helvetica, sans-serif; color:var(--ink); background:#fff; }
  .we { max-width:860px; margin:0 auto; padding:16px; }
  h1 { color:var(--navy); font-size:1.3rem; margin:0 0 6px; }
  .statement { margin:0 0 16px; color:#333; line-height:1.6; background:#f5f8fc; border-left:4px solid var(--navy); padding:10px 14px; border-radius:0 4px 4px 0; }
  .stepper { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .chip { display:flex; align-items:center; gap:6px; font-size:.8rem; color:var(--navy); background:#eef3f9; border:1px solid #cfe0f2; border-radius:16px; padding:4px 10px; cursor:pointer; transition:background .15s,color .15s; }
  .chip .num { display:inline-block; width:18px; height:18px; line-height:18px; text-align:center; background:#cfe0f2; color:var(--navy); border-radius:50%; font-size:.72rem; font-weight:bold; }
  .chip.done { color:#33628f; }
  .chip.active { background:var(--navy); color:#fff; }
  .chip.active .num { background:#fff; color:var(--navy); }
  .card { border:1px solid var(--navy); border-radius:8px; overflow:hidden; min-height:280px; }
  .card-head { background:var(--navy); color:#fff; padding:10px 16px; font-size:1.05rem; font-weight:bold; }
  .card-body { padding:16px; font-size:.97rem; line-height:1.6; }
  .card-body p { margin:0 0 10px; }
  .kv { list-style:none; margin:0 0 10px; padding:0; }
  .kv li { padding:3px 0; }
  .calc { background:#f5f8fc; border:1px solid #dbe6f2; border-radius:6px; padding:8px 12px; margin:8px 0; }
  .eq-label { margin:12px 0 0; font-size:.92rem; color:var(--navy); font-weight:bold; }
  .katex-display { overflow-x:auto; overflow-y:hidden; margin:.3em 0; }
  table.results { width:100%; border-collapse:collapse; margin-top:6px; font-size:.92rem; }
  table.results th, table.results td { border:1px solid #cfe0f2; padding:6px 8px; text-align:left; }
  table.results th { background:var(--navy); color:#fff; font-weight:bold; }
  table.results tr:nth-child(even) td { background:#f5f8fc; }
  .note { font-size:.86rem; color:var(--muted); margin-top:8px; }
  .cite { font-size:.82rem; color:var(--muted); }
  .controls { display:flex; align-items:center; gap:8px; margin-top:14px; }
  button { background:var(--navy); color:#fff; border:none; border-radius:4px; padding:8px 14px; cursor:pointer; font-size:.9rem; }
  button:hover { background:#16283f; }
  button.ghost { background:#fff; color:var(--navy); border:1px solid var(--navy); }
  button:disabled { opacity:.4; cursor:default; }
  .stepcount { font-size:.85rem; color:var(--muted); margin-left:auto; }
  svg { max-width:100%; height:auto; }
</style>
</head>
<body>
<div class="we">
  <h1 id="we-title"></h1>
  <div class="statement" id="we-statement"></div>
  <div class="stepper" id="stepper"></div>
  <div class="card">
    <div class="card-head"><span id="s-num"></span>. <span id="s-title"></span></div>
    <div class="card-body" id="s-body"></div>
  </div>
  <div class="controls">
    <button class="ghost" id="prev" type="button">Prev</button>
    <button id="play" type="button">Play</button>
    <button class="ghost" id="next" type="button">Next</button>
    <span class="stepcount" id="count"></span>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script>
var PROBLEM = {"title": "Worked Example 7.7-A: Bolted Joint Under External Load", "statement": "The preloaded joint from Page 7.6 ($F_i=3{,}341\\ \\text{lb}$, $A_t=0.0524\\ \\text{in}^2$, $S_p=85{,}000\\ \\text{psi}$) carries an external separating load $F_{ext}=1{,}500\\ \\text{lb}$ per bolt with joint stiffness ratio $C=0.20$. Find the bolt force and stress under load (Eq. 19-8), the remaining clamp force (Eq. 19-9), and the separation load with its design factor."};
var SKETCH = '<svg viewBox="0 0 360 200" role="img" aria-label="Preloaded bolted joint with an external separating load pulling the flanges apart.">'
+ '<defs>'
+ '<marker id="j1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2c7a54"/></marker>'
+ '</defs>'
+ '<rect x="110" y="70" width="140" height="24" fill="#dfe8f3" stroke="#1F3A5F"/>'
+ '<rect x="110" y="94" width="140" height="24" fill="#eef3f9" stroke="#1F3A5F"/>'
+ '<rect x="168" y="44" width="24" height="12" fill="#cfe0f2" stroke="#1F3A5F"/>'
+ '<rect x="172" y="56" width="16" height="76" fill="#cfe0f2" stroke="#1F3A5F"/>'
+ '<rect x="164" y="132" width="32" height="12" fill="#cfe0f2" stroke="#1F3A5F"/>'
+ '<line x1="180" y1="70" x2="180" y2="40" stroke="#2c7a54" stroke-width="2.5" marker-end="url(#j1)"/>'
+ '<line x1="180" y1="118" x2="180" y2="148" stroke="#2c7a54" stroke-width="2.5" marker-end="url(#j1)"/>'
+ '<text x="196" y="40" font-size="10" fill="#2c7a54">F_ext = 1500 lb / bolt</text>'
+ '<text x="196" y="150" font-size="10" fill="#2c7a54">F_ext</text>'
+ '<text x="200" y="92" font-size="10" fill="#D85A30">bolt: F_i + C F_ext</text>'
+ '<text x="60" y="188" font-size="9.5" fill="#5a6b80">External load shares between bolt (C) and joint (1&minus;C)</text>'
+ '</svg>';
var STEPS = [{"label": "Restate", "title": "Restate the problem", "html": "<p>The preloaded flange from Page 7.6 now carries an external separating load. Because the bolt and the clamped flanges act as springs in parallel, the bolt takes only a fraction $C$ of the external load while the joint loses the rest of its clamp. We check that the bolt does not yield and that the joint does not separate.</p>"}, {"label": "Given/Find", "title": "Given and Find", "html": "<p><strong>Carried in from Page 7.6:</strong></p><ul class='kv'><li>Preload $F_i=3{,}341\\ \\text{lb}$; $A_t=0.0524\\ \\text{in}^2$; $S_p=85{,}000\\ \\text{psi}$</li><li>External separating load $F_{ext}=1{,}500\\ \\text{lb}$ per bolt</li><li>Joint stiffness ratio $C=0.20$ (steel-to-steel, no gasket)</li></ul><p><strong>Find:</strong> bolt force and stress under load, remaining clamp force, and the separation load with its design factor.</p>"}, {"label": "Sketch", "title": "Sketch", "html": "<p>The external load splits: the bolt sees $C\\,F_{ext}$; the joint clamp drops by $(1-C)\\,F_{ext}$.</p>__SKETCH__<p class='cite'>Reference: Mott &sect;19-5, Eq. 19-8 ($F_b$) and Eq. 19-9 ($F_c$); hard steel joints $k_c\\approx 3k_b$.</p>"}, {"label": "Equations", "title": "Equations", "html": "<p class='eq-label'>Bolt force and remaining clamp (Mott Eqs. 19-8, 19-9):</p>$$F_{bolt}=F_i+C\\,F_{ext},\\qquad F_{clamp}=F_i-(1-C)\\,F_{ext}$$<p class='eq-label'>Bolt stress and separation load:</p>$$\\sigma_{bolt}=\\frac{F_{bolt}}{A_t},\\qquad F_{sep}=\\frac{F_i}{1-C}$$"}, {"label": "Calculate", "title": "Calculations", "html": "<div class='calc'>$$F_{bolt}=3{,}341+0.20(1{,}500)=3{,}341+300=\\textcolor{#D85A30}{3{,}641\\ \\text{lb}}$$</div><div class='calc'>$$\\sigma_{bolt}=\\frac{3{,}641}{0.0524}=\\textcolor{#D85A30}{69{,}485\\ \\text{psi}}<85{,}000\\ \\Rightarrow\\ N=\\tfrac{85{,}000}{69{,}485}=1.22$$</div><div class='calc'>$$F_{clamp}=3{,}341-(0.80)(1{,}500)=3{,}341-1{,}200=\\textcolor{#D85A30}{2{,}141\\ \\text{lb}}>0\\ \\checkmark$$</div><div class='calc'>$$F_{sep}=\\frac{3{,}341}{0.80}=\\textcolor{#D85A30}{4{,}176\\ \\text{lb}}\\ \\Rightarrow\\ N_{sep}=\\tfrac{4{,}176}{1{,}500}=2.78$$</div>"}, {"label": "Check", "title": "Checks", "html": "<ul class='kv'><li>Bolt: $69{,}485<85{,}000\\ \\text{psi}$ &mdash; no yield, $N=1.22$ on proof strength &#10003;.</li><li>Joint: $F_{clamp}=2{,}141\\ \\text{lb}>0$ &mdash; stays clamped; separates only at $4{,}176\\ \\text{lb}$ ($N_{sep}=2.78$) &#10003;.</li><li>Static loading is fine. For fluctuating $F_{ext}$, add a fatigue check: amplitude $\\tfrac{C\\,F_{ext}}{2A_t}=\\tfrac{0.20(1500)}{2(0.0524)}=2{,}863\\ \\text{psi}$ vs. the bolt endurance limit (&asymp;18,600 psi, Grade 5 rolled threads).</li></ul>"}, {"label": "Result", "title": "Result and verdict", "html": "<table class='results'><tr><th>Quantity</th><th>Result</th></tr><tr><td>Bolt force under load</td><td>$3{,}641\\ \\text{lb}$</td></tr><tr><td>Bolt stress / $N$</td><td>$69{,}485\\ \\text{psi}$ / $1.22$</td></tr><tr><td>Remaining clamp</td><td>$2{,}141\\ \\text{lb}$ (no separation)</td></tr><tr><td>Separation load / $N_{sep}$</td><td>$4{,}176\\ \\text{lb}$ / $2.78$</td></tr></table><p><strong>Verdict:</strong> the 5/16-18 Grade 5 bolts, preloaded to 3,341 lb, safely carry a 1,500 lb external load per bolt &mdash; no yield ($N=1.22$) and no separation ($N=2.78$) under static loading. A fatigue check is required if the external load fluctuates.</p>"}];

STEPS.forEach(function(s){ if(s.html) s.html = s.html.split('__SKETCH__').join(SKETCH); });

(function(){
  function typeset(el){
    if(window.renderMathInElement){
      try{ renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}], throwOnError:false}); }catch(e){}
    }
  }
  var titleEl=document.getElementById('we-title'), stmtEl=document.getElementById('we-statement');
  titleEl.textContent=PROBLEM.title; stmtEl.innerHTML=PROBLEM.statement; typeset(stmtEl);
  var stepper=document.getElementById('stepper');
  var sNum=document.getElementById('s-num'), sTitle=document.getElementById('s-title'), sBody=document.getElementById('s-body'), count=document.getElementById('count');
  var prev=document.getElementById('prev'), next=document.getElementById('next'), play=document.getElementById('play');
  var i=0, timer=null;
  STEPS.forEach(function(s,idx){
    var c=document.createElement('div'); c.className='chip'; c.setAttribute('data-i',idx);
    c.innerHTML='<span class="num">'+(idx+1)+'</span>'+s.label;
    c.addEventListener('click',function(){ stop(); go(idx); });
    stepper.appendChild(c);
  });
  var chips=Array.prototype.slice.call(stepper.querySelectorAll('.chip'));
  function render(){
    var s=STEPS[i]; sNum.textContent=(i+1); sTitle.textContent=s.title; sBody.innerHTML=s.html; typeset(sBody);
    count.textContent='Step '+(i+1)+' of '+STEPS.length;
    chips.forEach(function(c,idx){ c.classList.toggle('active',idx===i); c.classList.toggle('done',idx<i); });
    prev.disabled=(i===0); next.disabled=(i===STEPS.length-1);
  }
  function go(n){ i=Math.max(0,Math.min(STEPS.length-1,n)); render(); }
  function stop(){ if(timer){ clearInterval(timer); timer=null; play.textContent='Play'; } }
  prev.addEventListener('click',function(){ stop(); go(i-1); });
  next.addEventListener('click',function(){ stop(); go(i+1); });
  play.addEventListener('click',function(){
    if(timer){ stop(); return; }
    play.textContent='Pause';
    timer=setInterval(function(){ if(i>=STEPS.length-1){ stop(); return; } go(i+1); }, 7000);
  });
  render();
})();
</script>
</body>
</html>
