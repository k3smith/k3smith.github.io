<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Worked Example 7.6-A: Bolt Preload and Tightening Torque | MET 320</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" />
<style>
  :root { --navy:#1F3A5F; --light:#E7EDF4; --accent:#D85A30; --ink:#222; --muted:#5a6b80; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Arial, Helvetica, sans-serif; color:var(--ink); background:#fff; }
  .we { max-width:860px; margin:0 auto; padding:16px; }
  h1 { color:var(--navy); font-size:1.3rem; margin:0 0 6px; }
  .statement { margin:0 0 16px; color:#333; line-height:1.6; background:#f5f8fc; border-left:4px solid var(--navy); padding:10px 14px; border-radius:0 4px 4px 0; }
  .stepper { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .chip { display:flex; align-items:center; gap:6px; font-size:.8rem; color:var(--navy); background:#eef3f9; border:1px solid #cfe0f2; border-radius:16px; padding:4px 10px; cursor:pointer; transition:background .15s,color .15s; }
  .chip .num { display:inline-block; width:18px; height:18px; line-height:18px; text-align:center; background:#cfe0f2; color:var(--navy); border-radius:50%; font-size:.72rem; font-weight:bold; }
  .chip.done { color:#33628f; }
  .chip.active { background:var(--navy); color:#fff; }
  .chip.active .num { background:#fff; color:var(--navy); }
  .card { border:1px solid var(--navy); border-radius:8px; overflow:hidden; min-height:280px; }
  .card-head { background:var(--navy); color:#fff; padding:10px 16px; font-size:1.05rem; font-weight:bold; }
  .card-body { padding:16px; font-size:.97rem; line-height:1.6; }
  .card-body p { margin:0 0 10px; }
  .kv { list-style:none; margin:0 0 10px; padding:0; }
  .kv li { padding:3px 0; }
  .calc { background:#f5f8fc; border:1px solid #dbe6f2; border-radius:6px; padding:8px 12px; margin:8px 0; }
  .eq-label { margin:12px 0 0; font-size:.92rem; color:var(--navy); font-weight:bold; }
  .katex-display { overflow-x:auto; overflow-y:hidden; margin:.3em 0; }
  table.results { width:100%; border-collapse:collapse; margin-top:6px; font-size:.92rem; }
  table.results th, table.results td { border:1px solid #cfe0f2; padding:6px 8px; text-align:left; }
  table.results th { background:var(--navy); color:#fff; font-weight:bold; }
  table.results tr:nth-child(even) td { background:#f5f8fc; }
  .note { font-size:.86rem; color:var(--muted); margin-top:8px; }
  .cite { font-size:.82rem; color:var(--muted); }
  .controls { display:flex; align-items:center; gap:8px; margin-top:14px; }
  button { background:var(--navy); color:#fff; border:none; border-radius:4px; padding:8px 14px; cursor:pointer; font-size:.9rem; }
  button:hover { background:#16283f; }
  button.ghost { background:#fff; color:var(--navy); border:1px solid var(--navy); }
  button:disabled { opacity:.4; cursor:default; }
  .stepcount { font-size:.85rem; color:var(--muted); margin-left:auto; }
  svg { max-width:100%; height:auto; }
</style>
</head>
<body>
<div class="we">
  <h1 id="we-title"></h1>
  <div class="statement" id="we-statement"></div>
  <div class="stepper" id="stepper"></div>
  <div class="card">
    <div class="card-head"><span id="s-num"></span>. <span id="s-title"></span></div>
    <div class="card-body" id="s-body"></div>
  </div>
  <div class="controls">
    <button class="ghost" id="prev" type="button">Prev</button>
    <button id="play" type="button">Play</button>
    <button class="ghost" id="next" type="button">Next</button>
    <span class="stepcount" id="count"></span>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script>
var PROBLEM = {"title": "Worked Example 7.6-A: Bolt Preload and Tightening Torque", "statement": "A flanged joint is clamped by 5/16-18 UNC Grade 5 steel bolts ($S_p=85{,}000\\ \\text{psi}$, Mott Table 19-1). Find the tensile stress area (Eq. 19-1), the proof load, the recommended clamping preload (75% of proof), and the tightening torque (Eq. 19-3, $K=0.15$ typical)."};
var SKETCH = '<svg viewBox="0 0 360 190" role="img" aria-label="Bolted flange joint: a bolt clamping two flanges, with preload tension in the bolt and compression in the flanges.">'
+ '<defs>'
+ '<marker id="b1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D85A30"/></marker>'
+ '</defs>'
+ '<rect x="120" y="60" width="120" height="26" fill="#dfe8f3" stroke="#1F3A5F"/>'
+ '<rect x="120" y="86" width="120" height="26" fill="#eef3f9" stroke="#1F3A5F"/>'
+ '<rect x="168" y="34" width="24" height="12" fill="#cfe0f2" stroke="#1F3A5F"/>'
+ '<rect x="172" y="46" width="16" height="80" fill="#cfe0f2" stroke="#1F3A5F"/>'
+ '<rect x="164" y="126" width="32" height="12" fill="#cfe0f2" stroke="#1F3A5F"/>'
+ '<line x1="180" y1="20" x2="180" y2="40" stroke="#D85A30" stroke-width="2.5" marker-end="url(#b1)"/>'
+ '<line x1="180" y1="152" x2="180" y2="132" stroke="#D85A30" stroke-width="2.5" marker-end="url(#b1)"/>'
+ '<text x="196" y="30" font-size="10" fill="#D85A30">preload F_i</text>'
+ '<text x="250" y="80" font-size="10" fill="#1F3A5F">flanges in</text>'
+ '<text x="250" y="94" font-size="10" fill="#1F3A5F">compression</text>'
+ '<text x="60" y="176" font-size="9.5" fill="#5a6b80">5/16-18 UNC Grade 5 bolt clamps the flanges</text>'
+ '</svg>';
var STEPS = [{"label": "Restate", "title": "Restate the problem", "html": "<p>A flanged joint is clamped by 5/16-18 UNC Grade 5 steel bolts. We size the fastener statics: the tensile stress area from the thread geometry, the proof load, the recommended clamping preload (75% of proof), and the tightening torque that produces that preload.</p>"}, {"label": "Given/Find", "title": "Given and Find", "html": "<p><strong>Given:</strong></p><ul class='kv'><li>Bolt 5/16-18 UNC &rarr; $d=0.3125\\ \\text{in}$, $n=18\\ \\text{tpi}$ (pitch $p=1/n$)</li><li>SAE Grade 5, $d<1\\ \\text{in}$: proof strength $S_p=85{,}000\\ \\text{psi}$ (Mott Table 19-1)</li><li>Nut factor $K=0.15$ (typical, as-received); $0.20$ if clean and dry</li></ul><p><strong>Find:</strong> tensile stress area $A_t$, proof load $F_p$, preload $F_i$, and tightening torque $T$.</p>"}, {"label": "Sketch", "title": "Sketch", "html": "<p>Tightening the nut stretches the bolt (tension $F_i$) and squeezes the flanges (compression). Preload is what keeps the joint tight under load.</p>__SKETCH__<p class='cite'>Reference: Mott &sect;19-3 (Eq. 19-1, stress area; Table 19-4), &sect;19-4 (Eq. 19-3, $T=K\\,D\\,P$).</p>"}, {"label": "Equations", "title": "Equations", "html": "<p class='eq-label'>Tensile stress area (UNC/UNF, Mott Eq. 19-1):</p>$$A_t=0.7854\\left(D-\\frac{0.9743}{n}\\right)^2$$<p class='eq-label'>Proof load, preload (75% of proof), and tightening torque (Eq. 19-3):</p>$$F_p=S_p\\,A_t,\\qquad F_i=0.75\\,F_p,\\qquad T=K\\,F_i\\,d$$"}, {"label": "Calculate", "title": "Calculations", "html": "<div class='calc'>$$A_t=0.7854\\left(0.3125-\\tfrac{0.9743}{18}\\right)^2=0.7854(0.2584)^2=\\textcolor{#D85A30}{0.0524\\ \\text{in}^2}$$</div><div class='calc'>$$F_p=85{,}000(0.0524)=\\textcolor{#D85A30}{4{,}454\\ \\text{lb}}$$</div><div class='calc'>$$F_i=0.75(4{,}454)=\\textcolor{#D85A30}{3{,}341\\ \\text{lb}}$$</div><div class='calc'>$$T=0.15(3{,}341)(0.3125)=\\textcolor{#D85A30}{156.6\\ \\text{lb}\\cdot\\text{in}}\\approx 13.0\\ \\text{lb}\\cdot\\text{ft}$$</div>"}, {"label": "Check", "title": "Checks", "html": "<ul class='kv'><li>$A_t=0.0524\\ \\text{in}^2$ matches the tabulated value for 5/16-18 in Mott Table 19-4 &#10003;.</li><li>At $K=0.20$ (clean, dry) the same preload needs $T=0.20(3{,}341)(0.3125)=208.8\\ \\text{lb}\\cdot\\text{in}\\approx 17.4\\ \\text{lb}\\cdot\\text{ft}$ &mdash; nut factor drives torque directly.</li><li>Torque control sets preload only to about $\\pm25\\text{\u2013}35\\%$; use turn-of-nut for critical joints.</li></ul>"}, {"label": "Result", "title": "Result and verdict", "html": "<table class='results'><tr><th>Quantity</th><th>Result</th></tr><tr><td>Tensile stress area $A_t$</td><td>$0.0524\\ \\text{in}^2$</td></tr><tr><td>Proof load $F_p$</td><td>$4{,}454\\ \\text{lb}$</td></tr><tr><td>Preload $F_i$ (0.75$F_p$)</td><td>$3{,}341\\ \\text{lb}$</td></tr><tr><td>Tightening torque $T$</td><td>$156.6\\ \\text{lb}\\cdot\\text{in}$ ($\\approx 13.0\\ \\text{lb}\\cdot\\text{ft}$)</td></tr></table><p><strong>Verdict:</strong> tighten each 5/16-18 Grade 5 bolt to $\\approx 13\\ \\text{lb}\\cdot\\text{ft}$ (as-received) for a 3,341 lb preload. These values carry into Page 7.7, where an external separating load is applied to the joint.</p>"}];

STEPS.forEach(function(s){ if(s.html) s.html = s.html.split('__SKETCH__').join(SKETCH); });

(function(){
  function typeset(el){
    if(window.renderMathInElement){
      try{ renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}], throwOnError:false}); }catch(e){}
    }
  }
  var titleEl=document.getElementById('we-title'), stmtEl=document.getElementById('we-statement');
  titleEl.textContent=PROBLEM.title; stmtEl.innerHTML=PROBLEM.statement; typeset(stmtEl);
  var stepper=document.getElementById('stepper');
  var sNum=document.getElementById('s-num'), sTitle=document.getElementById('s-title'), sBody=document.getElementById('s-body'), count=document.getElementById('count');
  var prev=document.getElementById('prev'), next=document.getElementById('next'), play=document.getElementById('play');
  var i=0, timer=null;
  STEPS.forEach(function(s,idx){
    var c=document.createElement('div'); c.className='chip'; c.setAttribute('data-i',idx);
    c.innerHTML='<span class="num">'+(idx+1)+'</span>'+s.label;
    c.addEventListener('click',function(){ stop(); go(idx); });
    stepper.appendChild(c);
  });
  var chips=Array.prototype.slice.call(stepper.querySelectorAll('.chip'));
  function render(){
    var s=STEPS[i]; sNum.textContent=(i+1); sTitle.textContent=s.title; sBody.innerHTML=s.html; typeset(sBody);
    count.textContent='Step '+(i+1)+' of '+STEPS.length;
    chips.forEach(function(c,idx){ c.classList.toggle('active',idx===i); c.classList.toggle('done',idx<i); });
    prev.disabled=(i===0); next.disabled=(i===STEPS.length-1);
  }
  function go(n){ i=Math.max(0,Math.min(STEPS.length-1,n)); render(); }
  function stop(){ if(timer){ clearInterval(timer); timer=null; play.textContent='Play'; } }
  prev.addEventListener('click',function(){ stop(); go(i-1); });
  next.addEventListener('click',function(){ stop(); go(i+1); });
  play.addEventListener('click',function(){
    if(timer){ stop(); return; }
    play.textContent='Pause';
    timer=setInterval(function(){ if(i>=STEPS.length-1){ stop(); return; } go(i+1); }, 7000);
  });
  render();
})();
</script>
</body>
</html>
