<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Worked Example 6.3-A: Design Stresses | MET 320</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" />
<style>
  :root { --navy:#1F3A5F; --light:#E7EDF4; --accent:#D85A30; --ink:#222; --muted:#5a6b80; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Arial, Helvetica, sans-serif; color:var(--ink); background:#fff; }
  .we { max-width:860px; margin:0 auto; padding:16px; }
  h1 { color:var(--navy); font-size:1.3rem; margin:0 0 6px; }
  .statement { margin:0 0 16px; color:#333; line-height:1.6; background:#f5f8fc; border-left:4px solid var(--navy); padding:10px 14px; border-radius:0 4px 4px 0; }
  .stepper { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .chip { display:flex; align-items:center; gap:6px; font-size:.8rem; color:var(--navy); background:#eef3f9; border:1px solid #cfe0f2; border-radius:16px; padding:4px 10px; cursor:pointer; transition:background .15s,color .15s; }
  .chip .num { display:inline-block; width:18px; height:18px; line-height:18px; text-align:center; background:#cfe0f2; color:var(--navy); border-radius:50%; font-size:.72rem; font-weight:bold; }
  .chip.done { color:#33628f; }
  .chip.active { background:var(--navy); color:#fff; }
  .chip.active .num { background:#fff; color:var(--navy); }
  .card { border:1px solid var(--navy); border-radius:8px; overflow:hidden; min-height:280px; }
  .card-head { background:var(--navy); color:#fff; padding:10px 16px; font-size:1.05rem; font-weight:bold; }
  .card-body { padding:16px; font-size:.97rem; line-height:1.6; }
  .card-body p { margin:0 0 10px; }
  .kv { list-style:none; margin:0 0 10px; padding:0; }
  .kv li { padding:3px 0; }
  .calc { background:#f5f8fc; border:1px solid #dbe6f2; border-radius:6px; padding:8px 12px; margin:8px 0; }
  .eq-label { margin:12px 0 0; font-size:.92rem; color:var(--navy); font-weight:bold; }
  .katex-display { overflow-x:auto; overflow-y:hidden; margin:.3em 0; }
  table.results { width:100%; border-collapse:collapse; margin-top:6px; font-size:.92rem; }
  table.results th, table.results td { border:1px solid #cfe0f2; padding:6px 8px; text-align:left; }
  table.results th { background:var(--navy); color:#fff; font-weight:bold; }
  table.results tr:nth-child(even) td { background:#f5f8fc; }
  .note { font-size:.86rem; color:var(--muted); margin-top:8px; }
  .cite { font-size:.82rem; color:var(--muted); }
  .controls { display:flex; align-items:center; gap:8px; margin-top:14px; }
  button { background:var(--navy); color:#fff; border:none; border-radius:4px; padding:8px 14px; cursor:pointer; font-size:.9rem; }
  button:hover { background:#16283f; }
  button.ghost { background:#fff; color:var(--navy); border:1px solid var(--navy); }
  button:disabled { opacity:.4; cursor:default; }
  .stepcount { font-size:.85rem; color:var(--muted); margin-left:auto; }
  svg { max-width:100%; height:auto; }
</style>
</head>
<body>
<div class="we">
  <h1 id="we-title"></h1>
  <div class="statement" id="we-statement"></div>
  <div class="stepper" id="stepper"></div>
  <div class="card">
    <div class="card-head"><span id="s-num"></span>. <span id="s-title"></span></div>
    <div class="card-body" id="s-body"></div>
  </div>
  <div class="controls">
    <button class="ghost" id="prev" type="button">Prev</button>
    <button id="play" type="button">Play</button>
    <button class="ghost" id="next" type="button">Next</button>
    <span class="stepcount" id="count"></span>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script>
var PROBLEM = {"title": "Worked Example 6.3-A: Endurance Limit and Stress Concentration", "statement": "For the project shaft (critical moment $M = 237.8\\ \\text{N}\\cdot\\text{m}$ at the sheave, $T = 119.4\\ \\text{N}\\cdot\\text{m}$), select AISI 1045 CD steel and determine the corrected endurance limit $s'_n$ by Mott &sect;5-6 and the stress-concentration factor $K_t$ for the shaft design equation."};
var SKETCH = "<svg viewBox=\"0 0 470 175\" role=\"img\" aria-label=\"Endurance-limit reduction from polished baseline to corrected value.\"><text x=\"20\" y=\"20\" font-size=\"11\" fill=\"#1F3A5F\" font-weight=\"bold\">Endurance limit, step by step (MPa)</text><rect x=\"120\" y=\"40\" width=\"300\" height=\"26\" fill=\"#cfe0f2\" stroke=\"#1F3A5F\"/><text x=\"14\" y=\"58\" font-size=\"9.5\" fill=\"#5a6b80\">0.5 s_u (polished)</text><text x=\"426\" y=\"58\" font-size=\"10\" fill=\"#1F3A5F\">313.5</text><rect x=\"120\" y=\"78\" width=\"245\" height=\"26\" fill=\"#dbe8d9\" stroke=\"#2c7a54\"/><text x=\"14\" y=\"96\" font-size=\"9.5\" fill=\"#5a6b80\">s_n machined (Fig 5-11)</text><text x=\"371\" y=\"96\" font-size=\"10\" fill=\"#2c7a54\">256</text><rect x=\"120\" y=\"116\" width=\"188\" height=\"26\" fill=\"#f7ddcf\" stroke=\"#D85A30\"/><text x=\"14\" y=\"134\" font-size=\"9.5\" fill=\"#5a6b80\">s&#8242;_n corrected</text><text x=\"314\" y=\"134\" font-size=\"10\" fill=\"#D85A30\">196</text><text x=\"120\" y=\"162\" font-size=\"9\" fill=\"#7d8ea0\">&#215; C_m(1.0) &#215; C_st(1.0) &#215; C_R(0.90) &#215; C_s(0.85)</text></svg>";
var STEPS = [{"label": "Restate", "title": "Restate the problem", "html": "<p>Before the shaft design equation can size the diameter, we need the corrected endurance limit $s'_n$ of the chosen material (Mott &sect;5-6) and the stress-concentration factor $K_t$ at each critical section. This page establishes both for the project shaft.</p>"}, {"label": "Given/Find", "title": "Given and Find", "html": "<p><strong>Carried in from Pages 6.1&ndash;6.2:</strong> critical section at the sheave ($M = 237.8\\ \\text{N}\\cdot\\text{m}$); secondary at the gear ($M = 222.4\\ \\text{N}\\cdot\\text{m}$); $T = 119.4\\ \\text{N}\\cdot\\text{m}$.</p><p><strong>Find:</strong> select a material, then determine $s'_n$ and $K_t$ for use in Eq. 12-24 on Page 6.4.</p>"}, {"label": "Sketch", "title": "Endurance-limit build-up", "html": "<p>The polished-specimen value is knocked down first by surface finish (already in Fig. 5-11), then by reliability and size.</p>__SKETCH__<p class='cite'>Reference: Mott &sect;5-6, Fig. 5-11 (endurance vs. $s_u$ and surface), Table 5-3 (reliability), Table 5-4 (size).</p>"}, {"label": "Equations", "title": "Equation", "html": "<p class='eq-label'>Corrected endurance limit (Mott &sect;5-6):</p>$$s'_n = s_n\\,C_m\\,C_{st}\\,C_R\\,C_s$$<p class='note'>$s_n$ is read directly from Figure 5-11 for the material&rsquo;s $s_u$ and its surface condition &mdash; the surface finish is already built into that chart, so there is no separate surface factor.</p>"}, {"label": "Calculate", "title": "Calculations", "html": "<div class='calc'>Material: <strong>AISI 1045 cold-drawn</strong> &mdash; $s_u = 627\\ \\text{MPa}$, $s_y = 531\\ \\text{MPa}$.</div><div class='calc'>$$s_n \\approx 256\\ \\text{MPa}\\ \\text{(Fig. 5-11, machined at }s_u=627\\text{; vs. }0.5s_u = 313.5\\text{ polished)}$$</div><div class='calc'>$$C_m = 1.0\\ (\\text{wrought}),\\ C_{st} = 1.0\\ (\\text{bending}),\\ C_R = 0.90\\ (90\\%,\\ \\text{Table 5-3}),\\ C_s = 0.85\\ (\\text{assume }D\\approx 40\\ \\text{mm},\\ \\text{Table 5-4; confirm after Page 6.4})$$</div><div class='calc'>$$s'_n = 256(1.0)(1.0)(0.90)(0.85) = \\textcolor{#D85A30}{196\\ \\text{MPa}}$$</div><div class='calc'>Stress concentration: profile keyseat at both the gear and sheave hubs &rarr; $K_t = 2.0$ (Mott, keyseat).</div>"}, {"label": "Check", "title": "Check for reasonableness", "html": "<ul class='kv'><li>Reading $s_n = 256\\ \\text{MPa}$ from Fig. 5-11 (below $0.5s_u = 313.5$) already accounts for the machined finish &mdash; do not also apply a separate surface factor.</li><li>Reliability and size trim it further to $196\\ \\text{MPa}$; a rotating bending shaft uses $C_{st} = 1.0$ because the bending stress is fully reversed.</li><li>$s'_n = 196\\ \\text{MPa}$ is a sensible corrected endurance limit for a machined medium-carbon steel shaft.</li><li>$C_s$ used an assumed $D \\approx 40\\ \\text{mm}$; Page 6.4 will confirm that size, so no iteration is needed here.</li></ul>"}, {"label": "Result", "title": "Result and hand-off", "html": "<table class='results'><tr><th>Quantity</th><th>Value</th></tr><tr><td>Material</td><td>AISI 1045 CD ($s_u = 627$, $s_y = 531\\ \\text{MPa}$)</td></tr><tr><td>Corrected endurance limit</td><td>$s'_n = 196\\ \\text{MPa}$</td></tr><tr><td>Stress concentration</td><td>$K_t = 2.0$ (profile keyseat, both sections)</td></tr><tr><td>Design factor</td><td>$N = 2.5$ (Mott &sect;12-5)</td></tr></table><p><strong>Hand-off:</strong> $s'_n$, $K_t$, $s_y$ and $N$ go straight into the shaft design equation on Page 6.4 (Worked Example 6.4-A).</p>"}];

STEPS.forEach(function(s){ if(s.html) s.html = s.html.split('__SKETCH__').join(SKETCH); });

(function(){
  function typeset(el){
    if(window.renderMathInElement){
      try{ renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}], throwOnError:false}); }catch(e){}
    }
  }
  var titleEl=document.getElementById('we-title'), stmtEl=document.getElementById('we-statement');
  titleEl.textContent=PROBLEM.title; stmtEl.innerHTML=PROBLEM.statement; typeset(stmtEl);
  var stepper=document.getElementById('stepper');
  var sNum=document.getElementById('s-num'), sTitle=document.getElementById('s-title'), sBody=document.getElementById('s-body'), count=document.getElementById('count');
  var prev=document.getElementById('prev'), next=document.getElementById('next'), play=document.getElementById('play');
  var i=0, timer=null;
  STEPS.forEach(function(s,idx){
    var c=document.createElement('div'); c.className='chip'; c.setAttribute('data-i',idx);
    c.innerHTML='<span class="num">'+(idx+1)+'</span>'+s.label;
    c.addEventListener('click',function(){ stop(); go(idx); });
    stepper.appendChild(c);
  });
  var chips=Array.prototype.slice.call(stepper.querySelectorAll('.chip'));
  function render(){
    var s=STEPS[i]; sNum.textContent=(i+1); sTitle.textContent=s.title; sBody.innerHTML=s.html; typeset(sBody);
    count.textContent='Step '+(i+1)+' of '+STEPS.length;
    chips.forEach(function(c,idx){ c.classList.toggle('active',idx===i); c.classList.toggle('done',idx<i); });
    prev.disabled=(i===0); next.disabled=(i===STEPS.length-1);
  }
  function go(n){ i=Math.max(0,Math.min(STEPS.length-1,n)); render(); }
  function stop(){ if(timer){ clearInterval(timer); timer=null; play.textContent='Play'; } }
  prev.addEventListener('click',function(){ stop(); go(i-1); });
  next.addEventListener('click',function(){ stop(); go(i+1); });
  play.addEventListener('click',function(){
    if(timer){ stop(); return; }
    play.textContent='Pause';
    timer=setInterval(function(){ if(i>=STEPS.length-1){ stop(); return; } go(i+1); }, 7000);
  });
  render();
})();
</script>
</body>
</html>
