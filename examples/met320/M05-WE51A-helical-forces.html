<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Worked Example 5.1-A | MET 320</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" />
<style>
  :root { --navy:#1F3A5F; --light:#E7EDF4; --accent:#D85A30; --ink:#222; --muted:#5a6b80; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Arial, Helvetica, sans-serif; color:var(--ink); background:#fff; }
  .we { max-width:860px; margin:0 auto; padding:16px; }
  h1 { color:var(--navy); font-size:1.3rem; margin:0 0 6px; }
  .statement { margin:0 0 16px; color:#333; line-height:1.6; background:#f5f8fc; border-left:4px solid var(--navy); padding:10px 14px; border-radius:0 4px 4px 0; }
  .stepper { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .chip { display:flex; align-items:center; gap:6px; font-size:.8rem; color:var(--navy); background:#eef3f9; border:1px solid #cfe0f2; border-radius:16px; padding:4px 10px; cursor:pointer; transition:background .15s,color .15s; }
  .chip .num { display:inline-block; width:18px; height:18px; line-height:18px; text-align:center; background:#cfe0f2; color:var(--navy); border-radius:50%; font-size:.72rem; font-weight:bold; }
  .chip.done { color:#33628f; }
  .chip.active { background:var(--navy); color:#fff; }
  .chip.active .num { background:#fff; color:var(--navy); }
  .card { border:1px solid var(--navy); border-radius:8px; overflow:hidden; min-height:280px; }
  .card-head { background:var(--navy); color:#fff; padding:10px 16px; font-size:1.05rem; font-weight:bold; }
  .card-body { padding:16px; font-size:.97rem; line-height:1.6; }
  .card-body p { margin:0 0 10px; }
  .kv { list-style:none; margin:0 0 10px; padding:0; }
  .kv li { padding:3px 0; }
  .calc { background:#f5f8fc; border:1px solid #dbe6f2; border-radius:6px; padding:8px 12px; margin:8px 0; }
  .eq-label { margin:12px 0 0; font-size:.92rem; color:var(--navy); font-weight:bold; }
  .katex-display { overflow-x:auto; overflow-y:hidden; margin:.3em 0; }
  table.results { width:100%; border-collapse:collapse; margin-top:6px; font-size:.92rem; }
  table.results th, table.results td { border:1px solid #cfe0f2; padding:6px 8px; text-align:left; }
  table.results th { background:var(--navy); color:#fff; font-weight:bold; }
  table.results tr:nth-child(even) td { background:#f5f8fc; }
  .note { font-size:.86rem; color:var(--muted); margin-top:8px; }
  .cite { font-size:.82rem; color:var(--muted); }
  .controls { display:flex; align-items:center; gap:8px; margin-top:14px; }
  button { background:var(--navy); color:#fff; border:none; border-radius:4px; padding:8px 14px; cursor:pointer; font-size:.9rem; }
  button:hover { background:#16283f; }
  button.ghost { background:#fff; color:var(--navy); border:1px solid var(--navy); }
  button:disabled { opacity:.4; cursor:default; }
  .stepcount { font-size:.85rem; color:var(--muted); margin-left:auto; }
  svg { max-width:100%; height:auto; }
</style>
</head>
<body>
<div class="we">
  <h1 id="we-title"></h1>
  <div class="statement" id="we-statement"></div>
  <div class="stepper" id="stepper"></div>
  <div class="card">
    <div class="card-head"><span id="s-num"></span>. <span id="s-title"></span></div>
    <div class="card-body" id="s-body"></div>
  </div>
  <div class="controls">
    <button class="ghost" id="prev" type="button">Prev</button>
    <button id="play" type="button">Play</button>
    <button class="ghost" id="next" type="button">Next</button>
    <span class="stepcount" id="count"></span>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script>
var PROBLEM = {
  title: "Worked Example 5.1-A: Forces on a Helical Gear Pair",
  statement: "A helical pair transmits $P = 15\\ \\text{kW}$ from a $n_P = 1200\\ \\text{rpm}$ pinion to a 400 rpm gear. Given $m_n = 4\\ \\text{mm}$, $\\phi_n = 20^\\circ$, $\\psi = 15^\\circ$, $F = 35\\ \\text{mm}$, $N_P = 24$, $N_G = 72$. Find the transverse geometry, pitch-line speed, torque, and the three tooth forces $W_t$, $W_r$, $W_a$. This running example continues on Page 5.2."
};
var SKETCH = '<svg viewBox="0 0 460 230" role="img" aria-label="Left: transverse face view with W_t tangent and W_r toward the center at the pitch point. Right: side view showing helix lines on the face and axial thrust W_a along the shaft.">'
+ '<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#D85A30"/></marker>'
+ '<marker id="arb" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1F3A5F"/></marker></defs>'
+ '<circle cx="120" cy="108" r="62" fill="#eef3f9" stroke="#5a6b80" stroke-width="0.8" stroke-dasharray="5 4"/>'
+ '<circle cx="120" cy="108" r="70" fill="none" stroke="#1F3A5F" stroke-width="1.4"/>'
+ '<line x1="175.9" y1="108.0" x2="190.0" y2="108.0" stroke="#1F3A5F" stroke-width="1"/>'
+ '<line x1="170.1" y1="139.0" x2="180.6" y2="143.0" stroke="#1F3A5F" stroke-width="1"/>'
+ '<line x1="150.8" y1="161.7" x2="155.0" y2="168.6" stroke="#1F3A5F" stroke-width="1"/>'
+ '<line x1="123.4" y1="170.0" x2="120.0" y2="178.0" stroke="#1F3A5F" stroke-width="1"/>'
+ '<line x1="95.0" y1="161.7" x2="85.0" y2="168.6" stroke="#1F3A5F" stroke-width="1"/>'
+ '<line x1="73.3" y1="139.0" x2="59.4" y2="143.0" stroke="#1F3A5F" stroke-width="1"/>'
+ '<line x1="64.1" y1="108.0" x2="50.0" y2="108.0" stroke="#1F3A5F" stroke-width="1"/>'
+ '<line x1="69.9" y1="77.0" x2="59.4" y2="73.0" stroke="#1F3A5F" stroke-width="1"/>'
+ '<line x1="89.2" y1="54.3" x2="85.0" y2="47.4" stroke="#1F3A5F" stroke-width="1"/>'
+ '<line x1="116.6" y1="46.0" x2="120.0" y2="38.0" stroke="#1F3A5F" stroke-width="1"/>'
+ '<line x1="145.0" y1="54.3" x2="155.0" y2="47.4" stroke="#1F3A5F" stroke-width="1"/>'
+ '<line x1="166.7" y1="77.0" x2="180.6" y2="73.0" stroke="#1F3A5F" stroke-width="1"/>'
+ '<circle cx="120" cy="108" r="2.5" fill="#1F3A5F"/>'
+ '<circle cx="120" cy="38" r="4" fill="#2a7a3a"/>'
+ '<text x="112" y="30" text-anchor="end" fill="#2a7a3a" font-size="11">P</text>'
+ '<line x1="120" y1="38" x2="188" y2="38" stroke="#D85A30" stroke-width="2.4" marker-end="url(#ar)"/>'
+ '<text x="150" y="24" fill="#D85A30" font-size="12">W_t</text>'
+ '<line x1="120" y1="38" x2="120" y2="98" stroke="#1F3A5F" stroke-width="2.4" marker-end="url(#arb)"/>'
+ '<text x="126" y="78" fill="#1F3A5F" font-size="12">W_r</text>'
+ '<text x="120" y="196" text-anchor="middle" fill="#5a6b80" font-size="10">face view (transverse plane)</text>'
+ '<text x="120" y="212" text-anchor="middle" fill="#5a6b80" font-size="9">pitch point shown at top for clarity</text>'
+ '<line x1="300" y1="108" x2="452" y2="108" stroke="#5a6b80" stroke-width="1" stroke-dasharray="4 3"/>'
+ '<line x1="300" y1="95" x2="452" y2="95" stroke="#7a8598" stroke-width="6"/>'
+ '<line x1="300" y1="121" x2="452" y2="121" stroke="#7a8598" stroke-width="6"/>'
+ '<rect x="352" y="60" width="34" height="96" rx="3" fill="#dce8f5" stroke="#1F3A5F" stroke-width="1.4"/>'
+ '<line x1="352" y1="78" x2="386" y2="68" stroke="#1F3A5F" stroke-width="1"/>'
+ '<line x1="352" y1="96" x2="386" y2="86" stroke="#1F3A5F" stroke-width="1"/>'
+ '<line x1="352" y1="114" x2="386" y2="104" stroke="#1F3A5F" stroke-width="1"/>'
+ '<line x1="352" y1="132" x2="386" y2="122" stroke="#1F3A5F" stroke-width="1"/>'
+ '<line x1="352" y1="150" x2="386" y2="140" stroke="#1F3A5F" stroke-width="1"/>'
+ '<text x="369" y="54" text-anchor="middle" fill="#5a6b80" font-size="9">&#968;</text>'
+ '<line x1="386" y1="108" x2="440" y2="108" stroke="#2a7a3a" stroke-width="2.6" marker-end="url(#arb)"/>'
+ '<text x="398" y="100" fill="#2a7a3a" font-size="12">W_a</text>'
+ '<text x="376" y="180" text-anchor="middle" fill="#5a6b80" font-size="10">axial thrust (along shaft)</text>'
+ '<text x="376" y="196" text-anchor="middle" fill="#5a6b80" font-size="10">side view (helix on face)</text>'
+ '</svg>';
var STEPS = [
  { label:"Restate", title:"Restate the problem",
    html:"<p>Helical teeth are cut on a helix angle, so unlike spur gears they produce three force components: the transmitted (tangential) force, the radial (separating) force, and an axial thrust. We first fix the transverse geometry, then resolve the tooth load into all three components for the shaft and bearing design in Module 6.</p>" },
  { label:"Given/Find", title:"Given and Find",
    html:"<p><strong>Given:</strong></p><ul class='kv'>"
      +"<li>$P = 15\\ \\text{kW}$; $n_P = 1200\\ \\text{rpm}$ (gear at 400 rpm)</li>"
      +"<li>$m_n = 4\\ \\text{mm}$; $\\phi_n = 20^\\circ$; $\\psi = 15^\\circ$</li>"
      +"<li>$N_P = 24$; $N_G = 72$; $F = 35\\ \\text{mm}$ (face width used on Page 5.2)</li></ul>"
      +"<p><strong>Find:</strong> $m_t$, $D_P$, $D_G$, $C$, $\\phi_t$; $T_P$; $v_t$; $W_t$, $W_r$, $W_a$.</p>" },
  { label:"Sketch", title:"Assumptions and sketch",
    html:"<p>Assumptions: parallel-shaft helical pair; 100% mesh efficiency for the force balance; the radial force uses the <em>transverse</em> pressure angle $\\phi_t$ (not $\\phi_n$).</p>"
      + SKETCH
      + "<p class='cite'>Reference: Mott &sect;8-7 (helical geometry) and &sect;10-1 (forces on helical gear teeth); $\\phi_t$ from Eq. 10-1.</p>" },
  { label:"Equations", title:"Equations",
    html:"<p>Transverse geometry, then torque and the three force components:</p>"
      +"<p class='eq-label'>Transverse module, pitch diameters, and center distance:</p>"
      +"$$m_t = \\frac{m_n}{\\cos\\psi}, \\qquad D = m_t N, \\qquad C = \\frac{D_P + D_G}{2}$$"
      +"<p class='eq-label'>Transverse pressure angle (Eq. 10-1):</p>"
      +"$$\\tan\\phi_t = \\frac{\\tan\\phi_n}{\\cos\\psi}$$"
      +"<p class='eq-label'>Pinion torque and pitch-line speed ($P$ in kW, $D$ in mm):</p>"
      +"$$T_P = \\frac{9550\\,P}{n_P}\\ (\\text{N}\\cdot\\text{m}), \\qquad v_t = \\frac{\\pi D_P n_P}{60\\,000}\\ (\\text{m/s})$$"
      +"<p class='eq-label'>Tooth forces (tangential, radial, axial; normal for check):</p>"
      +"$$W_t = \\frac{2T_P}{D_P}, \\qquad W_r = W_t\\tan\\phi_t, \\qquad W_a = W_t\\tan\\psi$$"
      +"$$W_N = \\frac{W_t}{\\cos\\phi_n\\cos\\psi}$$" },
  { label:"Calculate", title:"Calculations (units tracked)",
    html:"<div class='calc'>$$m_t = \\frac{m_n}{\\cos\\psi} = \\frac{4}{\\cos15^\\circ} = \\textcolor{#D85A30}{4.141\\ \\text{mm}}$$</div>"
      +"<div class='calc'>$$D_P = m_t N_P = 4.141(24) = \\textcolor{#D85A30}{99.4\\ \\text{mm}}, \\qquad D_G = 4.141(72) = \\textcolor{#D85A30}{298.2\\ \\text{mm}}$$</div>"
      +"<div class='calc'>$$C = \\frac{99.4+298.2}{2} = \\textcolor{#D85A30}{198.8\\ \\text{mm}}$$</div>"
      +"<div class='calc'>$$\\tan\\phi_t = \\frac{\\tan20^\\circ}{\\cos15^\\circ} = 0.3768 \\;\\Rightarrow\\; \\phi_t = \\textcolor{#D85A30}{20.6^\\circ}$$</div>"
      +"<div class='calc'>$$T_P = \\frac{9550(15)}{1200} = 119.4\\ \\text{N}\\cdot\\text{m} = 119\\,400\\ \\text{N}\\cdot\\text{mm}$$</div>"
      +"<div class='calc'>$$v_t = \\frac{\\pi(99.4)(1200)}{60\\,000} = \\textcolor{#D85A30}{6.25\\ \\text{m/s}}$$</div>"
      +"<div class='calc'>$$W_t = \\frac{2(119\\,400)}{99.4} = \\textcolor{#D85A30}{2402\\ \\text{N}}$$</div>"
      +"<div class='calc'>$$W_r = 2402\\tan20.6^\\circ = \\textcolor{#D85A30}{905\\ \\text{N}}, \\qquad W_a = 2402\\tan15^\\circ = \\textcolor{#D85A30}{644\\ \\text{N}}$$</div>"
      +"<p class='note'>Speed check: $n_G = n_P(N_P/N_G) = 1200(24/72) = 400\\ \\text{rpm}$ matches the given gear speed.</p>" },
  { label:"Check", title:"Check for reasonableness",
    html:"<p>The three components must resolve to the true normal force $W_N$:</p>"
      +"<div class='calc'>$$W_N = \\frac{2402}{\\cos20^\\circ\\cos15^\\circ} = 2646\\ \\text{N}$$</div>"
      +"<div class='calc'>$$\\sqrt{W_t^2+W_r^2+W_a^2} = \\sqrt{2402^2+905^2+644^2} = 2646\\ \\text{N}\\ \\checkmark$$</div>"
      +"<p>The axial thrust (644 N) is real load the bearings must carry &mdash; a helical set needs thrust-capable bearings.</p>" },
  { label:"Result", title:"Result and verdict",
    html:"<table class='results'><tr><th>Quantity</th><th>Value</th></tr>"
      +"<tr><td>$m_t$ / $\\phi_t$</td><td>4.141 mm / 20.6&deg;</td></tr>"
      +"<tr><td>$D_P$ / $D_G$ / $C$</td><td>99.4 / 298.2 / 198.8 mm</td></tr>"
      +"<tr><td>$T_P$ / $v_t$</td><td>$119.4\\ \\text{N}\\cdot\\text{m}$ / 6.25 m/s</td></tr>"
      +"<tr><td>$W_t$ / $W_r$ / $W_a$</td><td>2402 N / 905 N / 644 N</td></tr></table>"
      +"<p><strong>Verdict:</strong> geometry and all three forces are determined. Carry $W_t = 2402\\ \\text{N}$, $D_P = 99.4\\ \\text{mm}$, $v_t = 6.25\\ \\text{m/s}$, and $F = 35\\ \\text{mm}$ into Page 5.2 for the stress check.</p>" }
];


(function(){
  function typeset(el){
    if(window.renderMathInElement){
      try{ renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}], throwOnError:false}); }catch(e){}
    }
  }
  var titleEl=document.getElementById('we-title'), stmtEl=document.getElementById('we-statement');
  titleEl.textContent=PROBLEM.title;
  stmtEl.innerHTML=PROBLEM.statement;
  typeset(stmtEl);

  var stepper=document.getElementById('stepper');
  var sNum=document.getElementById('s-num'), sTitle=document.getElementById('s-title'), sBody=document.getElementById('s-body'), count=document.getElementById('count');
  var prev=document.getElementById('prev'), next=document.getElementById('next'), play=document.getElementById('play');
  var i=0, timer=null;
  STEPS.forEach(function(s,idx){
    var c=document.createElement('div'); c.className='chip'; c.setAttribute('data-i',idx);
    c.innerHTML='<span class="num">'+(idx+1)+'</span>'+s.label;
    c.addEventListener('click',function(){ stop(); go(idx); });
    stepper.appendChild(c);
  });
  var chips=Array.prototype.slice.call(stepper.querySelectorAll('.chip'));
  function render(){
    var s=STEPS[i];
    sNum.textContent=(i+1); sTitle.textContent=s.title; sBody.innerHTML=s.html;
    typeset(sBody);
    count.textContent='Step '+(i+1)+' of '+STEPS.length;
    chips.forEach(function(c,idx){ c.classList.toggle('active',idx===i); c.classList.toggle('done',idx<i); });
    prev.disabled=(i===0); next.disabled=(i===STEPS.length-1);
  }
  function go(n){ i=Math.max(0,Math.min(STEPS.length-1,n)); render(); }
  function stop(){ if(timer){ clearInterval(timer); timer=null; play.textContent='Play'; } }
  prev.addEventListener('click',function(){ stop(); go(i-1); });
  next.addEventListener('click',function(){ stop(); go(i+1); });
  play.addEventListener('click',function(){
    if(timer){ stop(); return; }
    play.textContent='Pause';
    timer=setInterval(function(){ if(i>=STEPS.length-1){ stop(); return; } go(i+1); }, 7000);
  });
  render();
})();
</script>
</body>
</html>
