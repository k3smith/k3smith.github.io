<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Worked Example 1.1-A | MET 320</title>
<!--
  REUSABLE WORKED-EXAMPLE PLAYER
  To adapt for another problem: edit the PROBLEM object (title + statement)
  and the STEPS array below. Keep the 7-step structure.
  Math: write LaTeX with $...$ (inline) or $$...$$ (display). KaTeX renders it.
-->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" />
<style>
  :root { --navy:#1F3A5F; --light:#E7EDF4; --accent:#D85A30; --ink:#222; --muted:#5a6b80; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Arial, Helvetica, sans-serif; color:var(--ink); background:#fff; }
  .we { max-width:860px; margin:0 auto; padding:16px; }
  h1 { color:var(--navy); font-size:1.3rem; margin:0 0 6px; }
  .statement { margin:0 0 16px; color:#333; line-height:1.6; background:#f5f8fc; border-left:4px solid var(--navy); padding:10px 14px; border-radius:0 4px 4px 0; }
  .stepper { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .chip { display:flex; align-items:center; gap:6px; font-size:.8rem; color:var(--navy); background:#eef3f9; border:1px solid #cfe0f2; border-radius:16px; padding:4px 10px; cursor:pointer; transition:background .15s,color .15s; }
  .chip .num { display:inline-block; width:18px; height:18px; line-height:18px; text-align:center; background:#cfe0f2; color:var(--navy); border-radius:50%; font-size:.72rem; font-weight:bold; }
  .chip.done { color:#33628f; }
  .chip.active { background:var(--navy); color:#fff; }
  .chip.active .num { background:#fff; color:var(--navy); }
  .card { border:1px solid var(--navy); border-radius:8px; overflow:hidden; min-height:280px; }
  .card-head { background:var(--navy); color:#fff; padding:10px 16px; font-size:1.05rem; font-weight:bold; }
  .card-body { padding:16px; font-size:.97rem; line-height:1.6; }
  .card-body p { margin:0 0 10px; }
  .kv { list-style:none; margin:0 0 10px; padding:0; }
  .kv li { padding:3px 0; }
  .calc { background:#f5f8fc; border:1px solid #dbe6f2; border-radius:6px; padding:8px 12px; margin:8px 0; }
  .katex-display { overflow-x:auto; overflow-y:hidden; margin:.3em 0; }
  table.results { width:100%; border-collapse:collapse; margin-top:6px; font-size:.92rem; }
  table.results th, table.results td { border:1px solid #cfe0f2; padding:6px 8px; text-align:left; }
  table.results th { background:var(--navy); color:#fff; font-weight:bold; }
  table.results tr:nth-child(even) td { background:#f5f8fc; }
  .note { font-size:.86rem; color:var(--muted); margin-top:8px; }
  .cite { font-size:.82rem; color:var(--muted); }
  .controls { display:flex; align-items:center; gap:8px; margin-top:14px; }
  button { background:var(--navy); color:#fff; border:none; border-radius:4px; padding:8px 14px; cursor:pointer; font-size:.9rem; }
  button:hover { background:#16283f; }
  button.ghost { background:#fff; color:var(--navy); border:1px solid var(--navy); }
  button:disabled { opacity:.4; cursor:default; }
  .stepcount { font-size:.85rem; color:var(--muted); margin-left:auto; }
  svg { max-width:100%; height:auto; }
</style>
</head>
<body>
<div class="we">
  <h1 id="we-title"></h1>
  <div class="statement" id="we-statement"></div>
  <div class="stepper" id="stepper"></div>
  <div class="card">
    <div class="card-head"><span id="s-num"></span>. <span id="s-title"></span></div>
    <div class="card-body" id="s-body"></div>
  </div>
  <div class="controls">
    <button class="ghost" id="prev" type="button">Prev</button>
    <button id="play" type="button">Play</button>
    <button class="ghost" id="next" type="button">Next</button>
    <span class="stepcount" id="count"></span>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script>
var PROBLEM = {
  title: "Worked Example 1.1-A: Converting shaft properties to SI",
  statement: "A W12×14 steel beam section has cross-sectional area $= 4.12\\ \\text{in}^2$, section modulus $= 14.8\\ \\text{in}^3$, and moment of inertia $= 88.0\\ \\text{in}^4$. A motor delivers $12{,}550\\ \\text{lb·in}$ of torque. Convert all four quantities to SI."
};

var SKETCH = '<svg viewBox="0 0 440 210" role="img" aria-label="Wide-flange cross-section with area and neutral axis, and a torque symbol.">'
+ '<defs><marker id="ta" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1F3A5F"/></marker></defs>'
+ '<rect x="70" y="45" width="110" height="15" fill="#cfe0f2" stroke="#1F3A5F" stroke-width="1.5"/>'
+ '<rect x="117" y="60" width="16" height="90" fill="#cfe0f2" stroke="#1F3A5F" stroke-width="1.5"/>'
+ '<rect x="70" y="150" width="110" height="15" fill="#cfe0f2" stroke="#1F3A5F" stroke-width="1.5"/>'
+ '<line x1="48" y1="107" x2="205" y2="107" stroke="#1F3A5F" stroke-width="1.2" stroke-dasharray="5 4"/>'
+ '<text x="40" y="111" fill="#1F3A5F" font-size="13" font-style="italic">x</text>'
+ '<text x="210" y="111" fill="#1F3A5F" font-size="13" font-style="italic">x</text>'
+ '<text x="125" y="30" text-anchor="middle" fill="#1F3A5F" font-size="12">area A</text>'
+ '<text x="125" y="192" text-anchor="middle" fill="#1F3A5F" font-size="12">I, S about x–x</text>'
+ '<rect x="300" y="92" width="86" height="32" rx="4" fill="#E7EDF4" stroke="#1F3A5F" stroke-width="1.5"/>'
+ '<ellipse cx="386" cy="108" rx="8" ry="16" fill="#dfe8f3" stroke="#1F3A5F" stroke-width="1.5"/>'
+ '<path d="M300,80 A22,22 0 1 1 278,110" fill="none" stroke="#1F3A5F" stroke-width="2" marker-end="url(#ta)"/>'
+ '<text x="300" y="150" text-anchor="middle" fill="#1F3A5F" font-size="13" font-style="italic">T</text>'
+ '<text x="300" y="166" text-anchor="middle" fill="#5a6b80" font-size="11">torque</text>'
+ '</svg>';

var STEPS = [
  { label:"Restate", title:"Restate the problem",
    html:"<p>A W12×14 wide-flange steel section is given, along with the torque a motor delivers to it, all in US customary units. Our task is to express all four quantities — cross-sectional area, section modulus, moment of inertia, and torque — in SI units.</p><p>No design decision is required here; this is purely a unit conversion. We still follow the full engineering-process format so the habit is in place for the design problems that follow.</p>" },

  { label:"Given/Find", title:"Given and Find",
    html:"<p><strong>Given</strong> (US customary):</p><ul class='kv'>"
      +"<li>$A = 4.12\\ \\text{in}^2$ &nbsp;(cross-sectional area)</li>"
      +"<li>$S = 14.8\\ \\text{in}^3$ &nbsp;(section modulus)</li>"
      +"<li>$I = 88.0\\ \\text{in}^4$ &nbsp;(moment of inertia)</li>"
      +"<li>$T = 12{,}550\\ \\text{lb·in}$ &nbsp;(applied torque)</li></ul>"
      +"<p><strong>Find:</strong> each quantity in SI units — $A$, $S$, and $I$ in millimetre- and metre-based units, and $T$ in newton·metres.</p>" },

  { label:"Sketch", title:"Assumptions and sketch",
    html:"<p>We use the exact definitions $1\\ \\text{in} = 25.4\\ \\text{mm} = 0.0254\\ \\text{m}$ and $1\\ \\text{lbf} = 4.4482\\ \\text{N}$. Each section property is geometric, so it converts by the length ratio raised to the power of its dimension (area to the 2nd power, section modulus to the 3rd, moment of inertia to the 4th). Torque converts as force × length.</p>"
      + SKETCH
      + "<p class='cite'>Reference: Mott, front-matter conversion tables (unit definitions).</p>" },

  { label:"Equations", title:"Equations",
    html:"<p>Write each conversion symbolically before substituting numbers:</p>"
      +"$$\\begin{aligned} A_{SI} &= A \\times (25.4\\ \\text{mm/in})^2 \\\\ S_{SI} &= S \\times (25.4\\ \\text{mm/in})^3 \\\\ I_{SI} &= I \\times (25.4\\ \\text{mm/in})^4 \\\\ T_{SI} &= T \\times (4.4482\\ \\text{N/lbf})(0.0254\\ \\text{m/in}) \\end{aligned}$$"
      +"<p>Each geometric property scales by the length ratio raised to its dimension. The torque factor is $(4.4482)(0.0254) = 0.11298\\ \\text{N·m per lb·in}$.</p>" },

  { label:"Calculate", title:"Calculations (units tracked)",
    html:"<div class='calc'>$$\\begin{aligned} A &= 4.12\\ \\text{in}^2 \\times (25.4\\ \\text{mm/in})^2 \\\\ &= 4.12 \\times 645.16\\ \\text{mm}^2 \\\\ &= \\textcolor{#D85A30}{2.66\\times10^{3}\\ \\text{mm}^2} = 2.66\\times10^{-3}\\ \\text{m}^2 \\end{aligned}$$</div>"
      +"<div class='calc'>$$\\begin{aligned} S &= 14.8\\ \\text{in}^3 \\times (25.4\\ \\text{mm/in})^3 \\\\ &= 14.8 \\times 16{,}387\\ \\text{mm}^3 \\\\ &= \\textcolor{#D85A30}{2.43\\times10^{5}\\ \\text{mm}^3} = 2.43\\times10^{-4}\\ \\text{m}^3 \\end{aligned}$$</div>"
      +"<div class='calc'>$$\\begin{aligned} I &= 88.0\\ \\text{in}^4 \\times (25.4\\ \\text{mm/in})^4 \\\\ &= 88.0 \\times 416{,}231\\ \\text{mm}^4 \\\\ &= \\textcolor{#D85A30}{3.66\\times10^{7}\\ \\text{mm}^4} = 3.66\\times10^{-5}\\ \\text{m}^4 \\end{aligned}$$</div>"
      +"<div class='calc'>$$\\begin{aligned} T &= 12{,}550\\ \\text{lb·in} \\times 0.11298\\ \\tfrac{\\text{N·m}}{\\text{lb·in}} \\\\ &= \\textcolor{#D85A30}{1.42\\times10^{3}\\ \\text{N·m}} = 1.42\\ \\text{kN·m} \\end{aligned}$$</div>"
      +"<p class='note'>Units cancel at every step: $\\text{in}^2 \\times (\\text{mm/in})^2$ leaves $\\text{mm}^2$, and $\\text{lb·in} \\times \\text{N·m/(lb·in)}$ leaves $\\text{N·m}$.</p>" },

  { label:"Check", title:"Check for reasonableness",
    html:"<p>Order-of-magnitude checks:</p><ul class='kv'>"
      +"<li>$1\\ \\text{in}^2 \\approx 645\\ \\text{mm}^2$, so $4.12\\ \\text{in}^2 \\approx 4 \\times 650 \\approx 2{,}600\\ \\text{mm}^2$. ✓</li>"
      +"<li>$1\\ \\text{in}^4 \\approx 4.16\\times10^{5}\\ \\text{mm}^4$, so $88\\ \\text{in}^4 \\approx 3.5\\times10^{7}\\ \\text{mm}^4$. ✓</li>"
      +"<li>Torque cross-check: $12{,}550\\ \\text{lb·in} \\approx 1{,}046\\ \\text{lb·ft}$; at $\\approx 1.36\\ \\text{N·m/lb·ft}$ that is $\\approx 1{,}420\\ \\text{N·m}$, matching $1{,}418\\ \\text{N·m}$. ✓</li></ul>"
      +"<p>All four results are the right size, so the conversions are sound.</p>" },

  { label:"Result", title:"Result",
    html:"<table class='results'><tr><th>Quantity</th><th>US customary</th><th>SI (mm-based)</th><th>SI (m-based)</th></tr>"
      +"<tr><td>Area, $A$</td><td>$4.12\\ \\text{in}^2$</td><td>$2.66\\times10^{3}\\ \\text{mm}^2$</td><td>$2.66\\times10^{-3}\\ \\text{m}^2$</td></tr>"
      +"<tr><td>Section modulus, $S$</td><td>$14.8\\ \\text{in}^3$</td><td>$2.43\\times10^{5}\\ \\text{mm}^3$</td><td>$2.43\\times10^{-4}\\ \\text{m}^3$</td></tr>"
      +"<tr><td>Moment of inertia, $I$</td><td>$88.0\\ \\text{in}^4$</td><td>$3.66\\times10^{7}\\ \\text{mm}^4$</td><td>$3.66\\times10^{-5}\\ \\text{m}^4$</td></tr>"
      +"<tr><td>Torque, $T$</td><td>$12{,}550\\ \\text{lb·in}$</td><td colspan='2'>$1.42\\times10^{3}\\ \\text{N·m} = 1.42\\ \\text{kN·m}$</td></tr></table>"
      +"<p class='note'>Because this is a conversion rather than a design decision, there is no safety factor or pass/fail verdict; the result is simply the four SI values, reported to three significant figures to match the given data.</p>" }
];

(function(){
  function typeset(el){
    if(window.renderMathInElement){
      try{ renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}], throwOnError:false}); }catch(e){}
    }
  }
  var titleEl=document.getElementById('we-title'), stmtEl=document.getElementById('we-statement');
  titleEl.textContent=PROBLEM.title;
  stmtEl.innerHTML=PROBLEM.statement;
  typeset(stmtEl);

  var stepper=document.getElementById('stepper');
  var sNum=document.getElementById('s-num'), sTitle=document.getElementById('s-title'), sBody=document.getElementById('s-body'), count=document.getElementById('count');
  var prev=document.getElementById('prev'), next=document.getElementById('next'), play=document.getElementById('play');
  var i=0, timer=null;
  STEPS.forEach(function(s,idx){
    var c=document.createElement('div'); c.className='chip'; c.setAttribute('data-i',idx);
    c.innerHTML='<span class="num">'+(idx+1)+'</span>'+s.label;
    c.addEventListener('click',function(){ stop(); go(idx); });
    stepper.appendChild(c);
  });
  var chips=Array.prototype.slice.call(stepper.querySelectorAll('.chip'));
  function render(){
    var s=STEPS[i];
    sNum.textContent=(i+1); sTitle.textContent=s.title; sBody.innerHTML=s.html;
    typeset(sBody);
    count.textContent='Step '+(i+1)+' of '+STEPS.length;
    chips.forEach(function(c,idx){ c.classList.toggle('active',idx===i); c.classList.toggle('done',idx<i); });
    prev.disabled=(i===0); next.disabled=(i===STEPS.length-1);
  }
  function go(n){ i=Math.max(0,Math.min(STEPS.length-1,n)); render(); }
  function stop(){ if(timer){ clearInterval(timer); timer=null; play.textContent='Play'; } }
  prev.addEventListener('click',function(){ stop(); go(i-1); });
  next.addEventListener('click',function(){ stop(); go(i+1); });
  play.addEventListener('click',function(){
    if(timer){ stop(); return; }
    play.textContent='Pause';
    timer=setInterval(function(){ if(i>=STEPS.length-1){ stop(); return; } go(i+1); }, 7000);
  });
  render();
})();
</script>
</body>
</html>
