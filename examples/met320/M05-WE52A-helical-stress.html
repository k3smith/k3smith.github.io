<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Worked Example 5.2-A | MET 320</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" />
<style>
  :root { --navy:#1F3A5F; --light:#E7EDF4; --accent:#D85A30; --ink:#222; --muted:#5a6b80; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Arial, Helvetica, sans-serif; color:var(--ink); background:#fff; }
  .we { max-width:860px; margin:0 auto; padding:16px; }
  h1 { color:var(--navy); font-size:1.3rem; margin:0 0 6px; }
  .statement { margin:0 0 16px; color:#333; line-height:1.6; background:#f5f8fc; border-left:4px solid var(--navy); padding:10px 14px; border-radius:0 4px 4px 0; }
  .stepper { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .chip { display:flex; align-items:center; gap:6px; font-size:.8rem; color:var(--navy); background:#eef3f9; border:1px solid #cfe0f2; border-radius:16px; padding:4px 10px; cursor:pointer; transition:background .15s,color .15s; }
  .chip .num { display:inline-block; width:18px; height:18px; line-height:18px; text-align:center; background:#cfe0f2; color:var(--navy); border-radius:50%; font-size:.72rem; font-weight:bold; }
  .chip.done { color:#33628f; }
  .chip.active { background:var(--navy); color:#fff; }
  .chip.active .num { background:#fff; color:var(--navy); }
  .card { border:1px solid var(--navy); border-radius:8px; overflow:hidden; min-height:280px; }
  .card-head { background:var(--navy); color:#fff; padding:10px 16px; font-size:1.05rem; font-weight:bold; }
  .card-body { padding:16px; font-size:.97rem; line-height:1.6; }
  .card-body p { margin:0 0 10px; }
  .kv { list-style:none; margin:0 0 10px; padding:0; }
  .kv li { padding:3px 0; }
  .calc { background:#f5f8fc; border:1px solid #dbe6f2; border-radius:6px; padding:8px 12px; margin:8px 0; }
  .eq-label { margin:12px 0 0; font-size:.92rem; color:var(--navy); font-weight:bold; }
  .katex-display { overflow-x:auto; overflow-y:hidden; margin:.3em 0; }
  table.results { width:100%; border-collapse:collapse; margin-top:6px; font-size:.92rem; }
  table.results th, table.results td { border:1px solid #cfe0f2; padding:6px 8px; text-align:left; }
  table.results th { background:var(--navy); color:#fff; font-weight:bold; }
  table.results tr:nth-child(even) td { background:#f5f8fc; }
  .note { font-size:.86rem; color:var(--muted); margin-top:8px; }
  .cite { font-size:.82rem; color:var(--muted); }
  .controls { display:flex; align-items:center; gap:8px; margin-top:14px; }
  button { background:var(--navy); color:#fff; border:none; border-radius:4px; padding:8px 14px; cursor:pointer; font-size:.9rem; }
  button:hover { background:#16283f; }
  button.ghost { background:#fff; color:var(--navy); border:1px solid var(--navy); }
  button:disabled { opacity:.4; cursor:default; }
  .stepcount { font-size:.85rem; color:var(--muted); margin-left:auto; }
  svg { max-width:100%; height:auto; }
</style>
</head>
<body>
<div class="we">
  <h1 id="we-title"></h1>
  <div class="statement" id="we-statement"></div>
  <div class="stepper" id="stepper"></div>
  <div class="card">
    <div class="card-head"><span id="s-num"></span>. <span id="s-title"></span></div>
    <div class="card-body" id="s-body"></div>
  </div>
  <div class="controls">
    <button class="ghost" id="prev" type="button">Prev</button>
    <button id="play" type="button">Play</button>
    <button class="ghost" id="next" type="button">Next</button>
    <span class="stepcount" id="count"></span>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script>
var PROBLEM = {
  title: "Worked Example 5.2-A: Helical Gear Stress and Material",
  statement: "Continuing from Page 5.1: $W_t = 2402\\ \\text{N}$, $D_P = 99.4\\ \\text{mm}$, $v_t = 6.25\\ \\text{m/s}$, $m_n = 4\\ \\text{mm}$, $F = 35\\ \\text{mm}$, $N_P = 24$, $N_G = 72$. Use $J_P = 0.48$ (Fig. 10-6), $I = 0.20$ (Table 10-1), $K_o = 1.50$ (Table 9-1), $K_v = 1.22$ ($A_v = 8$). Compute the AGMA bending and contact stresses and specify the minimum hardness ($S_F \\ge 1.5$, $S_H \\ge 1.2$)."
};
var SKETCH = '<svg viewBox="0 0 360 210" role="img" aria-label="A helical gear tooth modeled as a cantilever: W_t near the tip causes bending at the root fillet; pitch-line contact causes Hertzian pitting stress.">'
+ '<defs><marker id="ar52" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#D85A30"/></marker></defs>'
+ '<line x1="40" y1="175" x2="250" y2="175" stroke="#1F3A5F" stroke-width="3"/>'
+ '<path d="M88,175'
+ ' C88,175 92,168 98,160'
+ ' L110,78 Q114,58 128,58'
+ ' L152,58 Q166,58 170,78'
+ ' L182,160'
+ ' C188,168 192,175 192,175'
+ ' Z" fill="#cfe0f2" stroke="#1F3A5F" stroke-width="1.5"/>'
+ '<line x1="170" y1="66" x2="210" y2="66" stroke="#D85A30" stroke-width="2.2" marker-end="url(#ar52)"/>'
+ '<text x="148" y="48" fill="#D85A30" font-size="12">W_t near tip</text>'
+ '<path d="M90,172 C92,166 96,160 100,156" fill="none" stroke="#D85A30" stroke-width="2.8"/>'
+ '<circle cx="96" cy="164" r="3.5" fill="#D85A30"/>'
+ '<line x1="96" y1="164" x2="52" y2="130" stroke="#D85A30" stroke-width="1.2"/>'
+ '<text x="8" y="118" fill="#D85A30" font-size="11">root fillet</text>'
+ '<text x="8" y="134" fill="#D85A30" font-size="11">max &#963; (bending)</text>'
+ '<line x1="150" y1="112" x2="330" y2="112" stroke="#5a6b80" stroke-width="0.8" stroke-dasharray="4 3"/>'
+ '<circle cx="182" cy="112" r="5" fill="#2a7a3a"/>'
+ '<text x="238" y="104" fill="#2a7a3a" font-size="11">pitch-line contact</text>'
+ '<text x="238" y="118" fill="#5a6b80" font-size="10">(pitting stress)</text>'
+ '<text x="140" y="198" text-anchor="middle" fill="#5a6b80" font-size="10">helical tooth (same failure modes as spur)</text>'
+ '</svg>';
var STEPS = [
  { label:"Restate", title:"Restate the problem",
    html:"<p>The AGMA equations carry over from spur gears (Chapter 9); only the geometry factors change &mdash; a larger $J$ (bending) and a larger $I$ (contact) are why helical gears carry more load. We check both modes and let the higher required hardness govern the material.</p>" },
  { label:"Given/Find", title:"Given and Find",
    html:"<p><strong>Given:</strong></p><ul class='kv'>"
      +"<li>$W_t = 2402\\ \\text{N}$; $m_n = 4\\ \\text{mm}$; $F = 35\\ \\text{mm}$; $D_P = 99.4\\ \\text{mm}$</li>"
      +"<li>$J_P = 0.48$; $I = 0.20$; $K_o = 1.50$; $K_v = 1.22$; $C_p = 191\\ \\sqrt{\\text{MPa}}$</li>"
      +"<li>Targets: $S_F \\ge 1.5$, $S_H \\ge 1.2$</li></ul>"
      +"<p><strong>Find:</strong> $s_t$; $s_c$; minimum $H_B$; final material.</p>" },
  { label:"Sketch", title:"Assumptions and sketch",
    html:"<p>Assumptions: simplified AGMA with the two dominant factors $K_o$ and $K_v$ ($K_s = K_B = 1.0$); through-hardened steel, Grade 1; the contact factor $I$ is read from <strong>Mott Table 10-1</strong> (helical, 20&deg; normal pressure), not the $m_N$ formula.</p>"
      + SKETCH
      + "<p class='cite'>Reference: Mott &sect;10-3 (bending), &sect;10-4 (contact); $J$ from Fig. 10-6, $I$ from Table 10-1, $s_{at}$/$s_{ac}$ from Figs. 9-18/9-19.</p>" },
  { label:"Equations", title:"Equations",
    html:"<p>Simplified AGMA bending and contact, then hardness from the Grade 1 fits:</p>"
      +"<p class='eq-label'>Bending stress number (metric normal-module form):</p>"
      +"$$s_t = \\frac{W_t\\,K_o\\,K_v}{F\\,m_n\\,J_P}$$"
      +"<p class='eq-label'>Contact (pitting) stress number:</p>"
      +"$$s_c = C_p\\sqrt{\\frac{W_t\\,K_o\\,K_v}{F\\,D_P\\,I}}$$"
      +"<p class='eq-label'>Allowable stress numbers (Grade 1 through-hardened, Mott Figs. 9-18/9-19 fits):</p>"
      +"$$s_{at} \\approx 0.533\\,H_B + 88.3\\ \\text{MPa}, \\qquad s_{ac} \\approx 2.22\\,H_B + 200.6\\ \\text{MPa}$$"
      +"<p class='eq-label'>Required hardness for each mode (use the larger):</p>"
      +"$$H_{B,\\text{bend}} = \\frac{S_F\\,s_t - 88.3}{0.533}, \\qquad H_{B,\\text{cont}} = \\frac{S_H\\,s_c - 200.6}{2.22}$$" },
  { label:"Calculate", title:"Calculations (units tracked)",
    html:"<div class='calc'>$$W_t K_o K_v = 2402(1.50)(1.22) = 4396\\ \\text{N}$$</div>"
      +"<div class='calc'>$$s_t = \\frac{4396}{35(4)(0.48)} = \\frac{4396}{67.2} = \\textcolor{#D85A30}{65.4\\ \\text{MPa}}$$</div>"
      +"<div class='calc'>$$s_c = 191\\sqrt{\\frac{4396}{35(99.4)(0.20)}} = 191\\sqrt{6.32} = \\textcolor{#D85A30}{480\\ \\text{MPa}}$$</div>"
      +"<div class='calc'>$$H_{B,\\text{bend}} = \\frac{1.5(65.4)-88.3}{0.533} = \\textcolor{#D85A30}{18}$$</div>"
      +"<p class='note'>$H_{B,\\text{bend}} = 18$ is mathematically correct but absurdly low &mdash; bending is non-limiting for this helical pair.</p>"
      +"<div class='calc'>$$H_{B,\\text{cont}} = \\frac{1.2(480)-200.6}{2.22} = \\textcolor{#D85A30}{169}$$</div>"
      +"<p>Contact governs ($H_B \\ge 169$). Check AISI 1045 Q&amp;T at 250 HB:</p>"
      +"<div class='calc'>$$s_{at}=0.533(250)+88.3=221.6\\ \\text{MPa},\\quad S_F=\\tfrac{221.6}{65.4}=\\textcolor{#D85A30}{3.4}$$</div>"
      +"<div class='calc'>$$s_{ac}=2.22(250)+200.6=755.6\\ \\text{MPa},\\quad S_H=\\tfrac{755.6}{480}=\\textcolor{#D85A30}{1.57}$$</div>" },
  { label:"Check", title:"Check for reasonableness",
    html:"<ul class='kv'>"
      +"<li>Contact needs $H_B \\ge 169$ vs. only 18 for bending &mdash; contact governs, as expected for through-hardened steel.</li>"
      +"<li>$250\\ \\text{HB} \\le 400\\ \\text{HB}$, so through-hardening is feasible; both $S_F$ and $S_H$ clear their targets &check;</li></ul>" },
  { label:"Result", title:"Result and verdict",
    html:"<table class='results'><tr><th>Quantity</th><th>Value</th></tr>"
      +"<tr><td>Bending $s_t$</td><td>65.4 MPa (not limiting)</td></tr>"
      +"<tr><td>Contact $s_c$</td><td>480 MPa (governs)</td></tr>"
      +"<tr><td>Minimum $H_B$</td><td>169</td></tr>"
      +"<tr><td>Spec: 1045 Q&amp;T @ 250 HB</td><td>$S_F=3.4$, $S_H=1.57$ &check;</td></tr></table>"
      +"<p><strong>Verdict:</strong> specify AISI 1045 Q&amp;T at 250 HB for both members. Contact governs; the larger helical $J$ and $I$ (vs. an equivalent spur pair) keep both stresses well below their allowables.</p>" }
];


(function(){
  function typeset(el){
    if(window.renderMathInElement){
      try{ renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}], throwOnError:false}); }catch(e){}
    }
  }
  var titleEl=document.getElementById('we-title'), stmtEl=document.getElementById('we-statement');
  titleEl.textContent=PROBLEM.title;
  stmtEl.innerHTML=PROBLEM.statement;
  typeset(stmtEl);

  var stepper=document.getElementById('stepper');
  var sNum=document.getElementById('s-num'), sTitle=document.getElementById('s-title'), sBody=document.getElementById('s-body'), count=document.getElementById('count');
  var prev=document.getElementById('prev'), next=document.getElementById('next'), play=document.getElementById('play');
  var i=0, timer=null;
  STEPS.forEach(function(s,idx){
    var c=document.createElement('div'); c.className='chip'; c.setAttribute('data-i',idx);
    c.innerHTML='<span class="num">'+(idx+1)+'</span>'+s.label;
    c.addEventListener('click',function(){ stop(); go(idx); });
    stepper.appendChild(c);
  });
  var chips=Array.prototype.slice.call(stepper.querySelectorAll('.chip'));
  function render(){
    var s=STEPS[i];
    sNum.textContent=(i+1); sTitle.textContent=s.title; sBody.innerHTML=s.html;
    typeset(sBody);
    count.textContent='Step '+(i+1)+' of '+STEPS.length;
    chips.forEach(function(c,idx){ c.classList.toggle('active',idx===i); c.classList.toggle('done',idx<i); });
    prev.disabled=(i===0); next.disabled=(i===STEPS.length-1);
  }
  function go(n){ i=Math.max(0,Math.min(STEPS.length-1,n)); render(); }
  function stop(){ if(timer){ clearInterval(timer); timer=null; play.textContent='Play'; } }
  prev.addEventListener('click',function(){ stop(); go(i-1); });
  next.addEventListener('click',function(){ stop(); go(i+1); });
  play.addEventListener('click',function(){
    if(timer){ stop(); return; }
    play.textContent='Pause';
    timer=setInterval(function(){ if(i>=STEPS.length-1){ stop(); return; } go(i+1); }, 7000);
  });
  render();
})();
</script>
</body>
</html>
